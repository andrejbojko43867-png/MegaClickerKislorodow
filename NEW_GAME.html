<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>🥐 MEGA CLICKER v16.0 [ULTIMATE]</title>
<style>
:root { --accent: #0f0; --glow: rgba(0,255,0,0.5); --bg: radial-gradient(circle at center, #0a1a0a 0%, #000000 100%); }
.theme-cyan { --accent: #0ff; --glow: rgba(0,255,255,0.5); --bg: radial-gradient(circle at center, #1a0b2e 0%, #000000 100%); }
.theme-pink { --accent: #f0f; --glow: rgba(255,0,255,0.5); --bg: radial-gradient(circle at center, #2e0b1a 0%, #000000 100%); }
.theme-gold { --accent: #0f0; --glow: rgba(255,209,102,0.5); --bg: radial-gradient(circle at center, #2e1a0b 0%, #000000 100%); }
.theme-blue { --accent: #00f; --glow: rgba(0,0,255,0.5); --bg: radial-gradient(circle at center, #0b0b2e 0%, #000000 100%); }
.theme-red { --accent: #f00; --glow: rgba(255,0,0,0.5); --bg: radial-gradient(circle at center, #2e0b0b 0%, #000000 100%); }
.theme-purple { --accent: #a0f; --glow: rgba(170,0,255,0.5); --bg: radial-gradient(circle at center, #1a0b2e 0%, #000000 100%); }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: #000 !important; color: #0f0 !important; height: 100%; overflow: hidden; }
body { background: #000 !important; color: #0f0 !important; font-family: 'Segoe UI', Roboto, Arial, sans-serif; color: #fff; display: flex; flex-direction: column; height: 100vh; height: 100dvh; user-select: none; touch-action: manipulation; overflow: hidden; background: var(--bg); transition: background 0.5s; }
.header { flex-shrink: 0; padding: 8px; background: rgba(0,0,0,0.7); border-bottom: 1px solid var(--accent); box-shadow: 0 0 20px var(--glow); }
h1 { text-align: center; font-size: 16px; margin-bottom: 4px; color: var(--accent); text-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent); letter-spacing: 2px; cursor: pointer; }
.level-bar { background: rgba(0,0,0,0.5); border: 1px solid var(--accent); border-radius: 8px; padding: 5px; margin-bottom: 5px; }
.level-progress { height: 6px; background: rgba(0, 255, 0, 0.1); border-radius: 3px; overflow: hidden; }
.level-progress-fill { height: 100%; background: linear-gradient(90deg, #f0f, var(--accent)); box-shadow: 0 0 10px var(--accent); transition: width 0.2s; }
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.stat { background: rgba(255,255,255,0.05); border: 1px solid var(--accent); border-radius: 6px; padding: 4px; text-align: center; }
.stat .label { font-size: 8px; color: #aaa; text-transform: uppercase; }
.stat .value { font-size: 12px; font-weight: bold; color: #0f0; text-shadow: 0 0 5px #0f0; }
.click-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; min-height: 0; }
#cookieBtn { font-size: clamp(100px, 40vw, 200px); background: none; border: none; cursor: pointer; transition: transform 0.05s; filter: drop-shadow(0 0 40px var(--glow)); line-height: 1; padding: 10px; animation: floatCookie 3s ease-in-out infinite; will-change: transform; }
#cookieBtn:active { transform: scale(0.9); animation: none; }
@keyframes floatCookie { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-15px) rotate(3deg); } }
.particle { position: fixed; pointer-events: none; font-size: 24px; z-index: 1000; animation: pop 0.8s ease-out forwards; will-change: transform, opacity; }
@keyframes pop { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
.skill-bar { display: flex; gap: 10px; margin-top: 15px; }
.skill-btn { width: 50px; height: 50px; border-radius: 50%; background: rgba(0,0,0,0.8); border: 2px solid var(--accent); color: var(--accent); font-size: 20px; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; box-shadow: 0 0 15px var(--glow); will-change: transform; }
.skill-btn:disabled { border-color: #555; color: #555; box-shadow: none; }
.skill-cd { position: absolute; bottom: -15px; font-size: 10px; color: #fff; }
/* МАТРИЧНЫЕ КНОПКИ (ОПТИМИЗИРОВАНО) */
@keyframes matrixFlow { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
.matrix-btn { position: relative; background: linear-gradient(90deg, #003300, #00ff00, #003300); background-size: 200% auto; animation: matrixFlow 3s linear infinite; color: #fff; text-shadow: 0 0 5px #0f0; border: 1px solid #0f0; box-shadow: 0 0 10px #0f0; font-weight: bold; will-change: background-position; }
.matrix-btn-red { position: relative; background: linear-gradient(90deg, #330000, #ff0000, #330000) !important; background-size: 200% auto !important; animation: matrixFlowRed 3s linear infinite !important; color: #fff !important; text-shadow: 0 0 5px #f00, 0 0 10px #f00 !important; border: 1px solid #f00 !important; box-shadow: 0 0 10px #f00 !important; font-weight: bold !important; will-change: background-position; }
@keyframes matrixFlowRed { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
.btn-gold { background: #0f0 !important; color: #000 !important; text-shadow: none; box-shadow: 0 0 10px #0f0; font-weight: bold; }
.btn-blue { background: #0f0 !important; color: #fff !important; box-shadow: 0 0 10px #0f0; font-weight: bold; }
/* ТЕКСТ В МАГАЗИНЕ */
@keyframes textFlow { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
.item-name { background: linear-gradient(90deg, #00ff00, #ffffff, #00ff00) !important; background-size: 200% auto !important; -webkit-background-clip: text !important; -webkit-text-fill-color: transparent !important; animation: textFlow 3s linear infinite !important; font-size: 15px !important; font-weight: 900 !important; will-change: background-position; }
.item-desc { color: #99ff99 !important; text-shadow: 0 0 3px #000, 0 0 5px #003300 !important; font-weight: bold !important; }
.item { border-left: 3px solid #00ff00 !important; box-shadow: inset 0 0 10px rgba(0,255,0,0.1) !important; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; margin-bottom: 8px; gap: 8px; }
.item button { border: none; padding: 10px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; min-width: 80px; color: #fff; font-size: 13px; }
.item button:disabled { opacity: 0.5; }
/* ВКЛАДКИ */
.tab-bar { flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; padding: 6px; background: rgba(0,0,0,0.8); border-top: 1px solid var(--accent); }
.tab-row { display: flex; gap: 6px; justify-content: space-between; }
.tab { flex: 1; min-height: 50px; background: rgba(255,255,255,0.05); border: 1px solid rgba(0, 255, 0, 0.1); color: #aaa; border-radius: 10px; cursor: pointer; font-size: 22px; display: flex; align-items: center; justify-content: center; transition: 0.2s; will-change: transform; }
.panel { position: fixed; bottom: 0; left: 0; right: 0; height: 80vh; background: linear-gradient(180deg, #111, #000); border-top: 2px solid var(--accent); border-radius: 20px 20px 0 0; padding: 15px; overflow-y: auto; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 900; will-change: transform; }
.panel.open { transform: translateY(0); }
.panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid rgba(0, 255, 0, 0.1); }
.panel-title { font-size: 20px; font-weight: bold; color: var(--accent); text-shadow: 0 0 10px var(--accent); }
.panel-close { background: rgba(255,0,0,0.2); border: 1px solid #f00; color: #f00; border-radius: 50%; width: 36px; height: 36px; font-size: 20px; cursor: pointer; }
.back-btn { background: #0f0; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; margin-bottom: 10px; width: 100%; cursor: pointer; text-align: left; }
/* МОДАЛКИ */
#bossModal, #offlineModal, #pwdModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
@keyframes floatBoss { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-20px) scale(1.1); } }
#pwdModal { top: -100%; bottom: auto; transition: top 0.4s; height: auto; padding: 30px; }
#pwdModal.active { top: 0; display: flex; }
#pwdInput { width: 80%; padding: 12px; margin: 10px 0; background: #001a00; border: 2px solid #0f0; color: #0f0; font-size: 18px; text-align: center; box-shadow: 0 0 10px #0f0 inset; outline: none; border-radius: 8px; }
/* АДМИНКА */
#adminPanel { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; flex-direction: column; padding: 15px; overflow-y: auto; }
.admin-header { color: #f00; text-align: center; font-size: 20px; font-weight: bold; text-shadow: 0 0 10px #f00; margin-bottom: 15px; }
.admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
.admin-btn { background: #333; border: 1px solid #555; color: #fff; padding: 10px; border-radius: 8px; font-size: 11px; cursor: pointer; text-align: center; }
.admin-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #f00; background: #111; color: #fff; margin-bottom: 10px; text-align: center; font-size: 16px; }
/* ТОСТЫ И ВСПЛЫВАШКИ */
.toast-container { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 20000; display: flex; flex-direction: column; gap: 4px; align-items: center; pointer-events: none; }
.toast { background: var(--accent); color: #000; padding: 8px 14px; border-radius: 10px; font-weight: bold; font-size: 12px; box-shadow: 0 0 20px var(--accent); text-align: center; }
.float { position: fixed; pointer-events: none; color: #0f0; font-weight: bold; font-size: 24px; text-shadow: 0 0 10px #f0f, 0 0 20px #f0f; animation: floatUp 0.8s ease-out forwards; z-index: 1000; will-change: transform, opacity; }
@keyframes floatUp { to { transform: translateY(-80px) scale(1.5); opacity: 0; } }
.setting-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: rgba(0, 20, 0, 0.8); border-radius: 8px; margin-bottom: 8px; border: 1px solid rgba(0, 255, 0, 0.1); }
.switch { position: relative; display: inline-block; width: 40px; height: 20px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
.slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
input:checked + .slider { background-color: var(--accent); }
input:checked + .slider:before { transform: translateX(20px); }
.theme-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; margin-left: 5px; display: inline-block; }
.golden-cookie { position: fixed; font-size: 60px; cursor: pointer; z-index: 9998; animation: pulseGold 0.5s infinite alternate; filter: drop-shadow(0 0 20px gold); will-change: transform; }
@keyframes pulseGold { to { transform: scale(1.2) rotate(10deg); } }
/* МИНИ-ИГРЫ */
.slot-container { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
.slot { width: 80px; height: 100px; background: #111; border: 3px solid var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 40px; box-shadow: 0 0 15px var(--glow); }
.fish-bar { width: 100%; height: 30px; background: #111; border-radius: 15px; position: relative; margin: 20px 0; border: 2px solid var(--accent); overflow: hidden; }
.fish-target { position: absolute; height: 100%; background: rgba(0,255,0,0.3); border: 2px solid #0f0; border-radius: 15px; will-change: left; }
</style>

function format(n) { n = Number(n); if(isNaN(n) || n === undefined) return '0';
    if (n >= 1e18) return (n / 1e18).toFixed(2) + 'E';
    if (n >= 1e15) return (n / 1e15).toFixed(2) + 'Q';
    if (n >= 1e12) return (n / 1e12).toFixed(2) + 'T';
    if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return Math.floor(n);
}

let audioCtx;
function playSound(freq, dur, type) {
    if (!state.settings.sound) return;
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
        osc.type = type || 'sine'; osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
    } catch(e){}
}
function vibrate(ms) { if (state.settings.haptics && navigator.vibrate) navigator.vibrate(ms); }

function applyTheme() {

    let mClick = 1, mCps = 1;
    mClick += state.prestige * 0.5; mCps += state.prestige * 0.5;
    mClick += (state.tree.click || 0) * 0.5; mCps += (state.tree.cps || 0) * 0.5;
    
    // Бонус от Душ
    mClick += (state.souls || 0) * 0.1;
    mCps += (state.souls || 0) * 0.1;
    
    // Бонус от Скина
    let currentSkin = SKINS.find(s => s.id === state.skins.eq) || SKINS[0];
    if (currentSkin.effect === 'click') mClick += currentSkin.bonus;
    if (currentSkin.effect === 'cps') mCps += currentSkin.bonus;
    if (currentSkin.effect === 'all') { mClick += currentSkin.bonus; mCps += currentSkin.bonus; }
    
    // Бонусы от Магазина Душ
    if (state.soulUpgrades) {
        if (state.soulUpgrades.s_click) mClick *= 5;
        if (state.soulUpgrades.s_cps) mCps *= 5;
        if (state.soulUpgrades.s_all) { mClick *= 10; mCps *= 10; }
    }
    
    // Бонус от Коллекции
    let colOres = (state.discoveredOres ? state.discoveredOres.length : 0) * 0.01;
    let colCrafts = Object.keys(state.craftedItems || {}).length * 0.02;
    mClick *= (1 + colOres + colCrafts);
    mCps *= (1 + colOres + colCrafts);
    
    // Бонусы от Крафта
    CRAFT_ITEMS.forEach(item => {
        if (state.craftedItems[item.id]) {
            if (item.effect === 'click') mClick *= item.val;
            if (item.effect === 'cps') mCps *= item.val;
            if (item.effect === 'all') { mClick *= item.val; mCps *= item.val; }
        }
    });
    PETS.forEach(p => {
        if (state.pets[p.id]) {
            if (p.mult === 'click') mClick += p.val;
            if (p.mult === 'cps') mCps += p.val;
            if (p.mult === 'all') { mClick += p.val; mCps += p.val; }
        }
    });
    RELICS.forEach(r => {
        if (state.relics[r.id]) {
            if (r.mult === 'click') mClick *= (r.val * (1 + (state.tree.relicPower || 0) * 0.1));
            if (r.mult === 'cps') mCps *= (r.val * (1 + (state.tree.relicPower || 0) * 0.1));
            if (r.mult === 'all') { mClick *= (r.val * (1 + (state.tree.relicPower || 0) * 0.1)); mCps *= (r.val * (1 + (state.tree.relicPower || 0) * 0.1)); }
        }
    });
    if (state.skills.s1 > Date.now()) mClick *= 7;
    if (state.skills.s3 > Date.now()) mCps *= 10;
    if (state.tempBoost > Date.now()) { mClick *= 100; mCps *= 100; }
    return { mClick, mCps };
}

function getCPC() {
    let base = 1;
    SHOP_CLICK.forEach(i => { if (state.cUpgrades[i.id]) base += state.cUpgrades[i.id] * i.val; });
    let res = Math.floor(base * getMultipliers().mClick);
    if (res > state.bestClick) state.bestClick = res;
    return res;
}

function getCPS() {
    let base = 0;
    SHOP_CPS.forEach(i => { if (state.pUpgrades[i.id]) base += state.pUpgrades[i.id] * i.val; });
    let res = Math.floor(base * getMultipliers().mCps);
    if (res > state.bestCPS) state.bestCPS = res;
    return res;
}

function getAutoCPS() { let speed = 1 + ((state.tree.autoSpeed || 0) * 0.1);
    let bots = [1, 5, 20, 100, 500, 2000, 10000];
    let total = 0;
    if (!state.auto.bots) state.auto.bots = [0,0,0,0,0,0,0];
    for(let i=0; i<7; i++) total += (state.auto.bots[i] || 0) * bots[i];
    return total;
}

                showToast('⛏️ ' + ORES[i].emoji + ' ' + ORES[i].name);

}

function useSkill(n) {

    else if (n === 3) { if (state.skills.s3 > now) return; state.skills.s3 = now + 45000; showToast('💎 ЗОЛОТАЯ ЛИХОРАДКА: x10 к пассиву на 20с!'); playSound(1200, 0.3); }

}

function checkAchievements() {

// БОССЫ
function spawnBoss() {
    state.bossActive = true; state.bossMaxHp = getCPC() * 100; state.bossHp = state.bossMaxHp; state.bossTime = 30;
    document.getElementById('bossModal').style.display = 'flex';

        state.bossTime--; updateBossUI();
        if(state.bossTime <= 0) bossLose();
    }, 1000);
}
function updateBossUI() {
    document.getElementById('bossHpFill').style.width = Math.max(0, (state.bossHp / state.bossMaxHp) * 100) + '%';
    document.getElementById('bossTimer').innerText = '⏱️ ' + state.bossTime + 'с';
}
function hitBoss() {
    if(!state.bossActive) return;
    state.bossHp -= getCPC();
    if(state.bossHp <= 0) { bossWin(); } 
    else { updateBossUI(); playSound(300, 0.05, 'square'); vibrate(20); }
}
function bossWin() {
    state.bossActive = false; clearInterval(window.bossInterval); document.getElementById('bossModal').style.display = 'none';
    addDailyProgress('bosses', 1);
    let bns = 1 + ((state.tree.bossLoot || 0) * 0.1); if(state.soulUpgrades && state.soulUpgrades.s_boss) bns *= 5; let rc = Math.floor(state.evoLevel * 2 * bns), rk = getCPC() * 500 * bns;
    state.crystals += rc; state.cookies += rk;
    showToast(`🏆 БОСС УБИТ! +${rc} 💎, +${format(rk)} 🍪`); playSound(1000, 0.3); updateUI();
}
function bossLose() {
    state.bossActive = false; clearInterval(window.bossInterval); document.getElementById('bossModal').style.display = 'none';
    let p = state.cookies * 0.1; state.cookies -= p;
    showToast(`💀 БОСС УБЕЖАЛ! Потеряно ${format(p)} 🍪`); playSound(150, 0.4, 'sawtooth'); updateUI();
}

function toggleAuto() {

function upgradeAuto(index, cost) {
    if (state.crystals < cost) return;
    if (!state.auto.bots) state.auto.bots = [0,0,0,0,0,0,0];
    if (state.auto.bots[index] >= 10) return;
    state.crystals -= cost; state.auto.bots[index]++;
    showToast('🤖 Робот улучшен!'); playSound(800, 0.1); updateUI(); openPanel('shop_auto');
}

// КВЕСТЫ
function generateDailyQuests() {
    let now = Date.now();
    if (now - state.lastDailyReset < 86400000 && state.dailyQuests.length > 0) return;
    state.lastDailyReset = now; state.dailyQuests = [];
    
    let pool = {
        easy: [
            { type: 'clicks', target: 500, reward: 10, desc: 'Сделай {t} кликов' },
            { type: 'cookies', target: 10000, reward: 15, desc: 'Испеки {t} 🍪' }
        ],
        medium: [
            { type: 'clicks', target: 2500, reward: 30, desc: 'Сделай {t} кликов' },
            { type: 'cookies', target: 100000, reward: 40, desc: 'Испеки {t} 🍪' },
            { type: 'bosses', target: 3, reward: 50, desc: 'Победи {t} Боссов' }
        ],
        hard: [
            { type: 'clicks', target: 10000, reward: 80, desc: 'Сделай {t} кликов' },
            { type: 'cookies', target: 1000000, reward: 100, desc: 'Испеки {t} 🍪' },
            { type: 'bosses', target: 10, reward: 150, desc: 'Победи {t} Боссов' }
        ]
    };
    
    ['easy', 'medium', 'hard'].forEach(diff => {
        let q = pool[diff][Math.floor(Math.random() * pool[diff].length)];
        state.dailyQuests.push({ 
            id: 'q_' + diff, type: q.type, target: q.target, reward: q.reward, 
            desc: q.desc.replace('{t}', format(q.target)), progress: 0, claimed: false, diff: diff
        });
    });
}
function addDailyProgress(type, amount) {
    if (!state.dailyQuests || state.dailyQuests.length === 0) return;
    state.dailyQuests.forEach(q => {
        if (q.type === type && !q.claimed && q.progress < q.target) {
            q.progress += amount; if (q.progress > q.target) q.progress = q.target;
        }
    });
}
function claimDaily(id) {
    let q = state.dailyQuests.find(x => x.id === id);
    if (!q || q.claimed || q.progress < q.target) return;
    q.claimed = true; let qBns = 1 + ((state.tree.dailyReward || 0) * 0.1); if(state.soulUpgrades && state.soulUpgrades.s_daily) qBns *= 2; state.crystals += Math.floor(q.reward * qBns);
    showToast('📅 Квест выполнен! +' + q.reward + ' 💎'); playSound(1200, 0.2); updateUI(); openPanel('daily');
}

function checkOfflineIncome() {

    let seconds = Math.floor(diff / 1000); let maxOff = 43200 + ((state.tree.offlineTime || 0) * 3600); if (seconds > maxOff) seconds = maxOff;
    let cps = getCPS(); let gain = cps * seconds;
    if (gain > 0) {
        document.getElementById('offlineAmount').innerText = '+' + format(gain) + ' 🍪';
        document.getElementById('offlineModal').style.display = 'flex';
        window.pendingOfflineGain = gain; playSound(600, 0.3);
    }
}
function collectOffline() {
    if (!window.pendingOfflineGain) return;
    state.cookies += window.pendingOfflineGain; state.totalBaked += window.pendingOfflineGain;
    window.pendingOfflineGain = 0; document.getElementById('offlineModal').style.display = 'none';

}

function playCasino() {
    if (state.cookies < 1000) return showToast('❌ Нужно 1000 🍪');
    state.cookies -= 1000; let syms = ['🍒','🍋','⭐','💎','7️⃣'];
    let s1 = syms[Math.floor(Math.random()*syms.length)]; let s2 = syms[Math.floor(Math.random()*syms.length)]; let s3 = syms[Math.floor(Math.random()*syms.length)];
    document.getElementById('slot1').innerText = s1; document.getElementById('slot2').innerText = s2; document.getElementById('slot3').innerText = s3;
    if (s1 === s2 && s2 === s3) { if (s1 === '7️⃣') { let winBns = 1 + ((state.tree.minigameWin || 0) * 0.1); state.cookies += (100000 * winBns); showToast('🎰 ДЖЕКПОТ! +' + format(100000 * winBns) + ' 🍪'); } else { state.cookies += 10000; showToast('🎰 ТРИ В РЯД! +10к 🍪'); } playSound(1500, 0.3); } 
    else if (s1 === s2 || s2 === s3 || s1 === s3) { state.cookies += 2000; showToast('🎰 Два в ряд! +2к 🍪'); } 
    else { showToast('💸 Проиграл 1000 🍪'); }
    updateUI();
}

function castFish() {
    if (document.getElementById('fishBar').style.display === 'block') return;
    let btn = document.getElementById('fishBtn'); let status = document.getElementById('fishStatus'); let bar = document.getElementById('fishBar'); let target = document.getElementById('fishTarget');
    btn.innerText = 'ЖДЕМ...'; btn.disabled = true; status.innerText = 'Рыба клюет...';
    let targetLeft = 10 + Math.random() * 70; target.style.left = targetLeft + '%';
    setTimeout(() => {
        bar.style.display = 'block'; status.innerText = 'ПОДСЕКАЙ!'; btn.innerText = 'ПОДСЕЧЬ'; btn.disabled = false;
        let width = 0; let dir = 1;
        let interval = setInterval(() => { width += dir * 4; if (width > 80 || width < 0) dir *= -1; target.style.left = width + '%'; }, 20);
        btn.onclick = () => {
            clearInterval(interval); let currentLeft = parseFloat(target.style.left);
            let hit = currentLeft >= targetLeft && currentLeft <= targetLeft + 20;
            bar.style.display = 'none'; btn.innerText = 'ЗАБРОСИТЬ'; btn.onclick = castFish;
            if (hit) { let winBns = 1 + ((state.tree.minigameWin || 0) * 0.1); let reward = (5000 + Math.floor(Math.random() * 50000)) * winBns; state.cookies += reward; document.getElementById('fishEmoji').innerText = '🐟'; showToast('🎣 Поймал рыбу! +' + format(reward) + ' 🍪'); playSound(1200, 0.2); } 
            else { document.getElementById('fishEmoji').innerText = '💨'; showToast('💨 Рыба сорвалась!'); }
            updateUI();
        };
    }, 2000 + Math.random() * 2000);
}

function sellRelic(id, cost) { if (!state.relics[id]) return; state.relics[id] = false; state.crystals += Math.floor(cost * 0.5); showToast('💰 Реликвия продана!'); updateUI(); state.marketView='main'; openPanel('market'); }


function generateMarketListings(force = false) {
    let now = Date.now();
    let timePassed = now - (state.lastMarketUpdate || 0);
    let limit = 15 * 60 * 1000; // 15 минут
    
    if (!force && state.marketListings && state.marketListings.length > 0 && timePassed < limit) return;
    
    state.lastMarketUpdate = now;
    
    let botNames = ['Торговец Джо', 'Гном Торин', 'Космо-барон', 'Матрица', 'Синдикат', 'Альфа-1', 'Скупщик', 'Древний', 'Кибер', 'Тень', 'Рыцарь', 'Мутант'];
    let listings = [];
    
    for (let i = 0; i < 100; i++) {
        let ore = ORES[i];
        if (!ore) continue;
        
        let seller = botNames[Math.floor(Math.random() * botNames.length)] + ' #' + (Math.floor(Math.random()*900)+100);
        let amount = Math.floor(Math.random() * 90) + 10;
        let markup = 1.2 + (Math.random() * 0.3); // Наценка ботов 1.2 - 1.5
        let totalPrice = Math.floor(ore.price * amount * markup);
        let pricePerPiece = Math.ceil(totalPrice / amount) || 1;
        
        listings.push({
            slot: i + 1,
            seller: seller,
            oreId: ore.id,
            oreName: ore.name,
            oreEmoji: ore.emoji,
            amount: amount,
            pricePerPiece: pricePerPiece,
            sold: false
        });
    }
    state.marketListings = listings;
}

function buyMarketPiece(slot) {
    let l = state.marketListings.find(x => x.slot === slot);
    if (!l || l.sold) return;
    
    let input = document.getElementById('qty-' + slot);
    if (!input) return;
    let qty = parseInt(input.value);
    
    if (isNaN(qty) || qty <= 0) return showToast('❌ Введи число больше 0!');
    if (qty > l.amount) qty = l.amount;
    
    let cost = qty * l.pricePerPiece;
    if (state.cookies < cost) return showToast('❌ Недостаточно печенек!');
    
    state.cookies -= cost;
    if (!state.minerals) state.minerals = {};
    
    state.minerals[l.oreId] = (state.minerals[l.oreId] || 0) + qty;
    if (!state.discoveredOres) state.discoveredOres = [];
    if (!state.discoveredOres.includes(l.oreId)) {
        state.discoveredOres.push(l.oreId);
        showToast('📖 НОВАЯ РУДА: ' + l.oreName + ' (+1% дохода)');
    }

    
    l.amount -= qty;
    if (l.amount <= 0) l.sold = true;
    
    showToast(`📥 Куплено: ${l.oreName} x${qty} (за ${format(cost)} 🍪)`);
    playSound(1000, 0.2);
    updateUI(); openPanel('market');
}

function buyMarketSlot(slotId) {
    let listing = state.marketListings.find(l => l.slot === slotId);
    if (!listing || listing.sold) return;
    if (state.cookies < listing.price) return showToast('❌ Недостаточно печенек!');
    
    state.cookies -= listing.price;
    if (!state.minerals) state.minerals = {};
    state.minerals[listing.oreId] = (state.minerals[listing.oreId] || 0) + listing.amount;
    
    listing.sold = true;
    showToast(`📥 Куплено: ${listing.oreName} x${listing.amount}`);
    playSound(1000, 0.2);
    updateUI(); openPanel('market');
}


function craftItem(id) {
    let item = CRAFT_ITEMS.find(x => x.id === id);
    if (!item || state.craftedItems[id]) return;
    
    let haveOre = (state.minerals && state.minerals[item.oreId]) || 0;
    if (haveOre < item.amount) return showToast('❌ Недостаточно руды!');
    
    state.minerals[item.oreId] -= item.amount;
    state.craftedItems[id] = true;
    
    showToast('🛠️ Скрафчено: ' + item.name);
    playSound(1200, 0.3);
    updateUI(); openPanel('craft');
}

function sellOre(id, price) {
    if (!state.minerals[id] || state.minerals[id] <= 0) return;
    state.minerals[id]--;
    if (state.minerals[id] <= 0) delete state.minerals[id];
    state.cookies += price;
    showToast('💰 Продано за ' + format(price) + ' 🍪');
    playSound(800, 0.1);
    updateUI(); state.marketView='main'; openPanel('market');
}
function buyOre(id, price) {
    if (state.cookies < price) return;
    state.cookies -= price;
    if (!state.minerals) state.minerals = {};

    showToast('📥 Куплено!');
    playSound(1000, 0.1);
    updateUI(); state.marketView='main'; openPanel('market');
}

    let stage = state.clan.stage || 1;
    let names = ['Тени', 'Вихри', 'Кровавые Луны', 'Древние', 'Кибер-Самураи', 'Мутанты', 'Синдикат', 'Легион Смерти', 'Космические Волки', 'Ангелы Хаоса'];
    let randomName = names[Math.floor(Math.random() * names.length)] + ' (Ур. ' + stage + ')';
    
    // Рандом, чтобы враги были разными
    let basePower = 50 * Math.pow(1.4, stage - 1);
    let power = Math.floor(basePower * (0.8 + Math.random() * 0.4));
    
    let baseReward = 50000 * Math.pow(1.5, stage - 1);
    let reward = Math.floor(baseReward * (0.8 + Math.random() * 0.4));
    
    state.clan.enemy = { name: randomName, power: power, reward: reward };
    
    showToast('🔍 Поиск клана...');
    playSound(600, 0.1);
    updateUI(); openPanel('clan');
}

function attackArenaClan() {
    let e = state.clan.enemy;
    if (!e) return;
    if (state.clan.troops < e.power) return showToast('❌ Мало войск!');
    
    let win = Math.random() < 0.7; // 70% шанс победы
    if (win) {
        state.cookies += e.reward;
        let losses = Math.floor(e.power * 0.2); // Теряем 20% от силы врага
        state.clan.troops -= losses;
        state.clan.stage++; // Повышаем этап
        showToast(`🏆 ПОБЕДА! +${format(e.reward)} 🍪 (потери: ${losses} войск)`);
        playSound(1500, 0.3);
    } else {
        let losses = Math.floor(e.power * 0.6); // При поражении теряем 60%
        state.clan.troops -= losses;
        state.clan.stage = Math.max(1, state.clan.stage - 1); // Откат этапа
        showToast(`💀 ПОРАЖЕНИЕ! Потеряно ${losses} войск. Этап снижен.`);
        playSound(200, 0.3, 'sawtooth');
    }
    
    state.clan.enemy = null; // Сбрасываем врага после боя
    updateUI(); openPanel('clan');
}

function buyTroopsQty() {
    let qty = parseInt(document.getElementById('troopQty').value);
    if (isNaN(qty) || qty < 1) return showToast('❌ Введи число больше 0!');
    let cost = qty * 10000;
    if (state.cookies < cost) return showToast('❌ Недостаточно печенек!');
    
    state.cookies -= cost;
    state.clan.troops += qty;
    showToast(`⚔️ Нанято ${qty} войск!`);
    playSound(800, 0.1);
    updateUI(); openPanel('clan');
}

function attackClanBot(index) {
    let bot = window.clanBots[index];
    if (state.clan.troops < bot.power) return showToast('❌ Мало войск для атаки!');
    
    let win = Math.random() < 0.7; // 70% шанс победы
    if (win) {
        state.clan.wins++;
        state.cookies += bot.reward;
        // Забираем 10% войск как потери
        let losses = Math.floor(bot.power * 0.1);
        state.clan.troops -= losses;
        showToast(`🏆 ПОБЕДА! Забрано ${format(bot.reward)} 🍪 (потери: ${losses})`);
        playSound(1500, 0.3);
    } else {
        let losses = Math.floor(bot.power * 0.5);
        state.clan.troops -= losses;
        showToast(`💀 ПОРАЖЕНИЕ! Потеряно ${losses} войск.`);
        playSound(200, 0.3, 'sawtooth');
    }
    updateUI(); openPanel('clan');
}


function startRaid(type, seconds, troopsNeeded) {
    if (state.clan.troops < troopsNeeded) return;
    state.clan.troops -= troopsNeeded;
    state.clan.raidEndTime = Date.now() + (seconds * 1000);
    state.clan.raidType = type;
    state.clan.raidTroops = troopsNeeded;
    showToast('⚔️ Отряд отправлен в поход на ' + type + '!');
    playSound(500, 0.3);
    updateUI(); openPanel('clan');
}

function claimRaid() {
    if (!state.clan || state.clan.raidEndTime === 0 || Date.now() < state.clan.raidEndTime) return;
    
    let isLost = Math.random() < 0.1; // 10% шанс потерять отряд
    let type = state.clan.raidType;
    let troops = state.clan.raidTroops;
    
    // Сброс похода
    state.clan.raidEndTime = 0;
    state.clan.raidType = null;
    state.clan.raidTroops = 0;
    
    if (isLost) {
        showToast('💀 Отряд погиб в походе... Войска потеряны.');
        playSound(200, 0.5, 'sawtooth');
    } else {
        // Награда зависит от типа похода
        let crystals = 0; let oreAmount = 0; let maxOreTier = 0;
        
        if (type === '1 час') { crystals = 5; oreAmount = 10; maxOreTier = 30; }
        if (type === '4 часа') { crystals = 25; oreAmount = 50; maxOreTier = 60; }
        if (type === '12 часов') { crystals = 100; oreAmount = 200; maxOreTier = 99; }
        
        state.crystals += crystals;
        
        // Выдаем руду
        if (!state.minerals) state.minerals = {};
        for (let i = 0; i < oreAmount; i++) {
            let oreIndex = Math.floor(Math.random() * (maxOreTier + 1));
            let ore = ORES[oreIndex];
            if (ore) {
                state.minerals[ore.id] = (state.minerals[ore.id] || 0) + 1;
            }
        }
        
        // Возвращаем половину войск (выжившие)
        let survivors = Math.floor(troops * 0.5);
        state.clan.troops += survivors;
        
        showToast(`🏆 Отряд вернулся! +${crystals} 💎, руда, выжило войск: ${survivors}`);
        playSound(1200, 0.3);
    }
    
    updateUI(); openPanel('clan');
}

function fightArena() { let petCount = Object.keys(state.pets).length; if (petCount < 3) return showToast('❌ Нужно минимум 3 питомца!'); let myPower = petCount * 10 + state.evoLevel * 5; let botPower = 20 + state.evoLevel * 10 + Math.random() * 30; if (myPower > botPower) { state.arenaWins++; state.crystals += 10; showToast('🏆 ПОБЕДА! +10 💎'); playSound(1500, 0.3); } else { showToast('💀 Поражение! Бот оказался сильнее.'); playSound(200, 0.3, 'sawtooth'); } updateUI(); openPanel('arena'); }

// ПРОЧЕЕ


function applyBackground() {
    let bg = BACKGROUNDS.find(b => b.id === state.background.eq) || BACKGROUNDS[0];
    document.documentElement.style.setProperty('--bg', bg.css);
    document.documentElement.style.setProperty('--accent', bg.glow);
    document.documentElement.style.setProperty('--glow', bg.glow + '88');
}

function buySkin(id, cost) {
    let skin = SKINS.find(s => s.id === id);
    if (!skin) return;
    
    if (!state.skins.owned.includes(id)) {
        if (state.crystals < cost) return showToast('❌ Мало кристаллов!');
        state.crystals -= cost;
        state.skins.owned.push(id);
    }
    
    state.skins.eq = id;
    document.getElementById('cookieBtn').innerText = skin.emoji;
    showToast('🎨 Скин применен: ' + skin.name);
    playSound(1000, 0.2);
    updateUI(); openPanel('skins');
}

function buyBackground(id, cost) {
    let bg = BACKGROUNDS.find(b => b.id === id);
    if (!bg) return;
    
    if (!state.background.owned.includes(id)) {
        if (state.crystals < cost) return showToast('❌ Мало кристаллов!');
        state.crystals -= cost;
        state.background.owned.push(id);
    }
    
    state.background.eq = id;
    applyBackground();
    showToast('🌌 Фон применен: ' + bg.name);
    playSound(1000, 0.2);
    updateUI(); openPanel('skins');
}

function buySoul(id, cost) {
    if (state.souls < cost) return;
    if (!state.soulUpgrades) state.soulUpgrades = {};
    if (state.soulUpgrades[id]) return;
    
    state.souls -= cost;
    state.soulUpgrades[id] = true;
    showToast('👻 Куплено: ' + id);
    playSound(1000, 0.3);
    updateUI(); openPanel('soul_shop');
}

function buyTree(key, cost) { if (state.crystals < cost) return; state.crystals -= cost; state.tree[key] = (state.tree[key] || 0) + 1; showToast('🌳 Навык улучшен!'); playSound(900, 0.1); updateUI(); openPanel('prestige'); }
function doPrestige() { let gain = Math.floor((state.totalBaked / 1000000) * (1 + ((state.tree.prestigeGain || 0) * 0.1))); if (gain <= 0) return; if (!confirm('Сбросить прогресс?')) return; state.prestige += gain; state.crystals += gain; let startBonus = (state.tree.start || 0) * 10000; state.cookies = startBonus; state.totalBaked = startBonus; state.cUpgrades = {}; state.pUpgrades = {}; state.evoLevel = 1; state.clicks = 0; showToast(`✨ Престиж! +${gain} 💎`); updateUI(); closePanel(); }
function toggleSetting(key, val) { state.settings[key] = val; applyTheme(); save(); }
function setTheme(t) { state.settings.theme = t; applyTheme(); save(); openPanel('settings'); }
function buyClick(id, cost) { let disc = Math.min(0.5, (state.tree.shopDiscount || 0) * 0.02); if(state.soulUpgrades && state.soulUpgrades.s_shop) disc = Math.min(0.9, disc + 0.5); let finalCost = Math.floor(cost * (1 - disc)); if (state.cookies < finalCost) return; state.cookies -= finalCost; state.cUpgrades[id] = (state.cUpgrades[id] || 0) + 1; playSound(800, 0.1); vibrate(20); updateUI(); openPanel('shop_click'); }
function buyCps(id, cost) { let disc = Math.min(0.5, (state.tree.shopDiscount || 0) * 0.02); if(state.soulUpgrades && state.soulUpgrades.s_shop) disc = Math.min(0.9, disc + 0.5); let finalCost = Math.floor(cost * (1 - disc)); if (state.cookies < finalCost) return; state.cookies -= finalCost; state.pUpgrades[id] = (state.pUpgrades[id] || 0) + 1; playSound(800, 0.1); vibrate(20); updateUI(); openPanel('shop_cps'); }
function buyPet(id, cost) { if (state.cookies < cost) return; state.cookies -= cost; state.pets[id] = true; playSound(1000, 0.2); vibrate(30); updateUI(); openPanel('pets'); }
function buyRelic(id, cost) { if (state.crystals < cost) return; state.crystals -= cost; state.relics[id] = true; playSound(1200, 0.3); vibrate(50); updateUI(); openPanel('relics'); }
function exportSave() { let code = btoa(JSON.stringify(state)); navigator.clipboard.writeText(code).then(() => showToast('📋 Код скопирован!')).catch(() => prompt('Скопируйте код:', code)); }
function importSave() { let code = prompt('Вставьте код сохранения:'); if (!code) return; try { Object.assign(state, JSON.parse(atob(code))); applyTheme(); showToast('✅ Загружено!'); updateUI(); closePanel(); save(); } catch(e) { showToast('❌ Ошибка кода'); } }
function closePanel() { document.getElementById('panel').classList.remove('open'); }
function showToast(text) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = text; document.getElementById('toastContainer').appendChild(t); setTimeout(() => t.remove(), 2500); }
function save() { state.lastSave = Date.now(); localStorage.setItem('megaSaveV16', JSON.stringify(state)); }
function load() { let s = localStorage.getItem('megaSaveV16'); if (s) { try { Object.assign(state, JSON.parse(s)); } catch(e){} } applyTheme(); updateUI(); }
function resetGame() { if (!confirm('Вы уверены, что хотите сбросить ВСЁ?')) return; localStorage.clear(); location.reload(); }

// АДМИНКА
let titleClicks = 0; let titleTimer;
document.getElementById('gameTitle').addEventListener('click', () => {
    titleClicks++; clearTimeout(titleTimer); titleTimer = setTimeout(() => titleClicks = 0, 1500);
    if (titleClicks >= 3) { titleClicks = 0; document.getElementById('pwdModal').classList.add('active'); document.getElementById('pwdInput').value = ''; document.getElementById('pwdInput').focus(); }
});
function checkAdminPassword() { let pwd = document.getElementById('pwdInput').value; if (pwd === "Kislorodow") { document.getElementById('pwdModal').classList.remove('active'); document.getElementById('adminPanel').style.display = 'flex'; playSound(1200, 0.3); } else { showToast("❌ Неверный пароль!"); vibrate(100); } }
function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; document.getElementById('pwdModal').classList.remove('active'); }
function adminGive(type) { let amount = Number(document.getElementById('adminAmount').value); if (isNaN(amount) || amount <= 0) return showToast('Введите число!'); if (type === 'cookies') state.cookies += amount; if (type === 'crystals') state.crystals += amount; updateUI(); showToast(`Выдано ${format(amount)}!`); playSound(1500, 0.2); }
function adminAction(action) {
    if (action === 'x10Cookies') state.cookies *= 10; else if (action === 'x100Cookies') state.cookies *= 100; else if (action === 'x10Crystals') state.crystals *= 10; else if (action === 'x100Crystals') state.crystals *= 100;
    else if (action === 'unlockPets') PETS.forEach(p => state.pets[p.id] = true); else if (action === 'unlockRelics') RELICS.forEach(r => state.relics[r.id] = true);
    else if (action === 'maxClick') SHOP_CLICK.forEach(i => state.cUpgrades[i.id] = 100); else if (action === 'maxCps') SHOP_CPS.forEach(i => state.pUpgrades[i.id] = 100);
    else if (action === 'resetCooldowns') state.skills = { s1: 0, s2: 0, s3: 0 }; else if (action === 'addPrestige') { state.prestige++; state.crystals++; } else if (action === 'add10Prestige') { state.prestige+=10; state.crystals+=10; }
    else if (action === 'addLevel') { state.clicks += 100; state.evoLevel++; state.crystals++; } else if (action === 'setLevel100') { state.evoLevel = 100; state.clicks = 10000; }
    else if (action === 'giveAchievements') ACHIEVEMENTS.forEach(a => state.achievements[a.id] = true); else if (action === 'clearAchievements') state.achievements = {};
    else if (action === 'resetPets') state.pets = {}; else if (action === 'resetRelics') state.relics = {}; else if (action === 'resetCPS') state.pUpgrades = {}; else if (action === 'resetClick') state.cUpgrades = {};
    else if (action === 'godMode') { state.godMode = !state.godMode; showToast(state.godMode ? "👑 БОГ ВКЛ" : "БОГ ВЫКЛ"); }
    else if (action === 'spawnGolden') { let g = document.createElement('div'); g.className = 'golden-cookie'; g.textContent = '🌟'; g.style.left = '50vw'; g.style.top = '50vh'; g.onclick = () => { let reward = getCPC() * 100 + 1000; state.cookies += reward; showToast('🌟 +' + format(reward)); g.remove(); updateUI(); }; document.body.appendChild(g); setTimeout(() => { if (g) g.remove(); }, 10000); }
    else if (action === 'addTime') state.playTime += 36000; else if (action === 'boost100') { state.tempBoost = Date.now() + 10000; showToast("🚀 БУСТ x100 на 10с!"); } else if (action === 'forceSave') save(); else if (action === 'resetGame') resetGame();
    updateUI(); if(action !== 'resetGame') showToast('Выполнено!');
}


setInterval(() => {
    if (state.lastMarketUpdate && Date.now() - state.lastMarketUpdate >= 15 * 60 * 1000) {
        generateMarketListings(true);
        // Если игрок сейчас в меню Биржи, перерисовываем его

            openPanel('market');

        showToast('🏪 Аукцион обновлен!');
    }
}, 1000);

load(); state.marketListings = []; state.lastMarketUpdate = 0; updateUI(); checkOfflineIncome();

// Универсальная игра (упрощенно)
window.playCasinoGame = function(gameId) {
    let bet = prompt("Введите вашу ставку (мин. 100):");
    if (!bet || isNaN(bet) || bet < 100) return alert("Неверная ставка!");
    bet = parseInt(bet);
    
    if (state.cookies < bet) return alert("Мало печенек!");
    
    state.cookies -= bet;
    
    let winChance = 0.45; // 45% шанс победы
    let win = Math.random() < winChance;
    
    if (win) {
        let prize = bet * 2;
        state.cookies += prize;
        alert(`🎉 ПОБЕДА в ${gameId}! Вы выиграли ${prize} 🍪`);
    } else {
        alert(`💀 ПРОИГРЫШ в ${gameId}. Вы потеряли ${bet} 🍪`);
    }
    
    if(typeof renderStats === 'function') renderStats();
    if(typeof save === 'function') save();
};

window.startWheelMiniGame = function() {
    let bet = parseInt(document.getElementById('wheel-bet-input').value);
    let result = document.getElementById('wheel-game-result');
    
    if (isNaN(bet) || bet < 100) return result.innerHTML = '<span style="color: #ff5252;">❌ Мин. ставка 100 🍪!</span>';
    if (state.cookies < bet) return result.innerHTML = '<span style="color: #ff5252;">❌ Мало печенек!</span>';
    
    state.cookies -= bet;
    
    if (window.currentWheelGame === 'Слоты') {
        let s = ['🍒', '🍋', '🍇', '💎', '7️⃣'];
        let r1 = s[Math.floor(Math.random()*s.length)];
        let r2 = s[Math.floor(Math.random()*s.length)];
        let r3 = s[Math.floor(Math.random()*s.length)];
        let win = (r1===r2 && r2===r3);
        
        result.innerHTML = `<div style="font-size: 30px;">${r1} ${r2} ${r3}</div>`;
        if (win) { state.cookies += bet*5; result.innerHTML += `<div style="color: #0f0;">🎉 x5! +${format(bet*5)} 🍪</div>`; }
        else { result.innerHTML += `<div style="color: #ff5252;">💀 Проигрыш</div>`; }
    }
    else if (window.currentWheelGame === 'Рулетка') {
        let guess = parseInt(document.getElementById('roulette-number').value);
        if (isNaN(guess) || guess < 0 || guess > 36) return result.innerHTML = '<span style="color: #ff5252;">❌ Введи число 0-36!</span>';
        let num = Math.floor(Math.random()*37);
        result.innerHTML = `<div style="font-size: 24px;">Выпало: ${num}</div>`;
        if (num === guess) { state.cookies += bet*35; result.innerHTML += `<div style="color: #0f0;">🎉 x35! +${format(bet*35)} 🍪</div>`; }
        else { result.innerHTML += `<div style="color: #ff5252;">💀 Проигрыш</div>`; }
    }
    else if (window.currentWheelGame === 'Кости') {
        let guess = parseInt(document.getElementById('dice-sum').value);
        if (isNaN(guess) || guess < 2 || guess > 12) return result.innerHTML = '<span style="color: #ff5252;">❌ Введи сумму 2-12!</span>';
        let d1 = Math.floor(Math.random()*6)+1;
        let d2 = Math.floor(Math.random()*6)+1;
        let sum = d1+d2;
        result.innerHTML = `<div style="font-size: 24px;">Выпало: ${d1} + ${d2} = ${sum}</div>`;
        if (sum === guess) { state.cookies += bet*5; result.innerHTML += `<div style="color: #0f0;">🎉 x5! +${format(bet*5)} 🍪</div>`; }
        else { result.innerHTML += `<div style="color: #ff5252;">💀 Проигрыш</div>`; }
    }
    else if (window.currentWheelGame === 'Монетка') {
        let g1 = document.getElementById('coin-1').value;
        let g2 = document.getElementById('coin-2').value;
        let g3 = document.getElementById('coin-3').value;
        
        let f1 = Math.random() < 0.5 ? 'heads' : 'tails';
        let f2 = Math.random() < 0.5 ? 'heads' : 'tails';
        let f3 = Math.random() < 0.5 ? 'heads' : 'tails';
        
        let wins = (g1===f1) + (g2===f2) + (g3===f3);
        result.innerHTML = `<div style="font-size: 20px;">${f1==='heads'?'О':'Р'} ${f2==='heads'?'О':'Р'} ${f3==='heads'?'О':'Р'}</div>`;
        
        if (wins === 3) { state.cookies += bet*8; result.innerHTML += `<div style="color: #0f0;">🎉 x8! +${format(bet*8)} 🍪</div>`; }
        else { result.innerHTML += `<div style="color: #ff5252;">💀 Угадано ${wins}/3. Проигрыш.</div>`; }
    }
    
    if(typeof renderStats === 'function') renderStats();
    if(typeof save === 'function') save();
};

window.playUniqueSlots = function() {
    let bet = parseInt(document.getElementById('wheel-bet-input').value);
    if (isNaN(bet) || bet < 100) return alert('Мин. ставка 100!');
    if (state.cookies < bet) return alert('Мало печенек!');
    
    state.cookies -= bet;
    let area = document.getElementById('unique-wheel-area');
    area.style.display = 'block';
    
    let symbols = ['🍒', '🍋', '🍇', '💎', '7️⃣'];
    let reels = [];
    for (let i = 0; i < 5; i++) {
        reels.push([
            symbols[Math.floor(Math.random() * symbols.length)],
            symbols[Math.floor(Math.random() * symbols.length)],
            symbols[Math.floor(Math.random() * symbols.length)]
        ]);
    }
    
    // Рисуем сетку
    let html = '<div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 15px;">';
    for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 5; col++) {
            html += `<div style="background: #000; border: 1px solid #0f0; padding: 10px; font-size: 24px; text-align: center;">${reels[col][row]}</div>`;
        }
    }
    html += '</div>';
    
    // Проверка выигрыша (упрощенно: если 3 одинаковых в ряду)
    let win = false;
    let prize = bet * 3;
    
    // Просто для демонстрации сделаем рандомный шанс победы
    if (Math.random() < 0.3) {
        win = true;
        state.cookies += prize;
        html += `<div style="color: #0f0; font-weight: bold;">🎉 Выигрыш! +${format(prize)} 🍪</div>`;
    } else {
        html += `<div style="color: #ff5252; font-weight: bold;">💀 Проигрыш.</div>`;
    }
    
    area.innerHTML = html;
    if(typeof renderStats === 'function') renderStats();
    if(typeof save === 'function') save();
};

// --- 4. МОНЕТКА (x3) ---
window.playUniqueCoin = function() {
    let bet = parseInt(document.getElementById('wheel-bet-input').value);
    if (isNaN(bet) || bet < 100) return alert('Мин. ставка 100!');
    if (state.cookies < bet) return alert('Мало печенек!');
    
    let area = document.getElementById('unique-wheel-area');
    area.style.display = 'block';
    
    let html = `<h4 style="color: #0f0;">Бросаем 3 раза. Угадай всё!</h4>`;
    let guesses = [];
    for (let i = 0; i < 3; i++) {
        let g = prompt(`Бросок ${i+1}. Орёл (1) или Решка (0)?`);
        guesses.push(g === '1' ? 'heads' : 'tails');
    }
    
    state.cookies -= bet;
    let results = [];
    let allWin = true;
    
    for (let i = 0; i < 3; i++) {
        let flip = Math.random() < 0.5 ? 'heads' : 'tails';
        results.push(flip);
        if (flip !== guesses[i]) allWin = false;
    }
    
    let resultStr = results.map(r => r === 'heads' ? 'Орёл' : 'Решка').join(' | ');
    html += `<div style="font-size: 20px; margin: 15px 0;">${resultStr}</div>`;
    
    if (allWin) {
        let prize = bet * 8;
        state.cookies += prize;
        html += `<div style="color: #0f0; font-weight: bold;">🎉 ВСЕ 3 УГАДАНЫ! +${format(prize)} 🍪</div>`;
    } else {
        html += `<div style="color: #ff5252; font-weight: bold;">💀 Не все угаданы.</div>`;
    }
    
    area.innerHTML = html;
    if(typeof renderStats === 'function') renderStats();
    if(typeof save === 'function') save();
};

window.showSkinTab = function(tab) {
    const content = document.getElementById('skins-content');
    if (!content) return;
    
    let html = '';
    
    if (tab === 'cookie') {
        html += `<h4 style="color: #0f0; margin-bottom: 10px;">Скины на печеньку (50 шт.)</h4>`;
        cookieNames.forEach((name, index) => {
            // Генерируем цвет для скина (по кругу)
            let colors = ['#0f0', '#ff9a3c', '#0f0', '#0f0', '#0f0', '#0f0'];
            let color = colors[index % colors.length];
            
            html += `<div style="background: rgba(0, 255, 0, 0.1); padding: 10px; border-radius: 8px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center;">

        });
    } else {
        html += `<h4 style="color: #0f0; margin-bottom: 10px;">Фоны игры (50 шт.)</h4>`;
        bgNames.forEach((name, index) => {
            // Генерируем градиент для фона
            let hue = (index * 37) % 360;
            let gradient = `linear-gradient(135deg, hsl(${hue}, 70%, 20%), hsl(${(hue+60)%360}, 70%, 40%))`;
            
            html += `<div style="background: rgba(0, 255, 0, 0.1); padding: 10px; border-radius: 8px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center;">

window.openBonusMenu = function() {
    const panel = document.getElementById('hardcoded-more-menu');
    const title = panel.querySelector('h2');
    const content = panel.querySelector('div[style*="grid"]');
    
    if (!panel || !title || !content) return;
    
    content.style.display = 'none';
    title.innerText = '🎁 Ежедневный Бонус';
    
    let bContainer = document.getElementById('bonus-menu-container');
    if (!bContainer) {
        bContainer = document.createElement('div');
        bContainer.id = 'bonus-menu-container';
        bContainer.style = 'padding: 15px; color: white; text-align: center;';
        panel.appendChild(bContainer);
    }
    bContainer.style.display = 'block';
    
    // Проверяем время последнего бонуса
    if (!state.lastBonus) state.lastBonus = 0;
    let now = Date.now();
    let cooldown = 24 * 60 * 60 * 1000; // 24 часа
    let timeLeft = (state.lastBonus + cooldown) - now;
    
    let canClaim = timeLeft <= 0;
    
    let html = `<h3 style="color: #0f0; margin-bottom: 20px;">Бонус за вход</h3>`;
    
    if (canClaim) {
        html += `
            <div style="font-size: 50px; margin-bottom: 20px;">🎁</div>
            <p style="margin-bottom: 20px;">Нажми, чтобы получить от 5 000 до 25 000 🍪!</p>
            <button onclick="claimBonus()" style="width: 100%; padding: 15px; background: #0f0; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 18px;">ЗАБРАТЬ БОНУС</button>
        `;
    } else {
        let hours = Math.floor(timeLeft / (1000 * 60 * 60));
        let mins = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
        html += `
            <div style="font-size: 50px; margin-bottom: 20px; opacity: 0.5;">⏳</div>
            <p style="margin-bottom: 20px; color: #aaa;">Следующий бонус через:</p>
            <h2 style="color: #0f0;">${hours}ч ${mins}м</h2>
        `;
    }
    
    html += `<button onclick="closeBonusAndShowGrid()" style="width: 100%; margin-top: 30px; padding: 10px; background: #333; color: white; border: none; border-radius: 8px;">⬅️ Назад</button>`;
    
    bContainer.innerHTML = html;
};

window.closeBonusAndShowGrid = function() {
    document.getElementById('bonus-menu-container').style.display = 'none';
    const panel = document.getElementById('hardcoded-more-menu');
    panel.querySelector('h2').innerText = '📁 Дополнительные функции';
    panel.querySelector('div[style*="grid"]').style.display = 'grid';
};

window.claimBonus = function() {
    let now = Date.now();
    let cooldown = 24 * 60 * 60 * 1000;
    
    if (now - (state.lastBonus || 0) < cooldown) return;
    
    // Выдаем от 5к до 25к
    let amount = Math.floor(Math.random() * (25000 - 5000 + 1)) + 5000;
    state.cookies += amount;
    state.totalBaked += amount;
    state.lastBonus = now; // Запоминаем время
    
    alert(`🎉 Вы получили ${format(amount)} 🍪!`);
    
    if(typeof renderStats === 'function') renderStats();
    if(typeof save === 'function') save();
    
    // Обновляем меню, чтобы показать кулдаун
    openBonusMenu();
};

window.showLeagueTab = function(tab) {
    const content = document.getElementById('league-content');
    if (!content) return;
    
    // Генерируем ботов (для примера)
    const botNames = ['Олег', 'Дмитрий', 'Сергей', 'Алексей', 'Тимофей', 'Максим', 'Андрей', 'Влад', 'Иван', 'Никита'];
    
    let players = botNames.map(name => {
        return {
            name: name,
            clicks: Math.floor(Math.random() * 100000),
            cps: Math.floor(Math.random() * 5000),
            factories: Math.floor(Math.random() * 50)
        };
    });
    
    // Добавляем игрока (тебя)
    let myClicks = state.clicks || 0;
    let myCps = typeof cookiesPerSecond === 'function' ? cookiesPerSecond() : 0;
    let myFactories = window.factoryData ? Object.keys(window.factoryData.owned).length : 0;
    
    players.push({ name: 'Ты', clicks: myClicks, cps: myCps, factories: myFactories, isMe: true });
    
    // Сортируем
    if (tab === 'clicks') players.sort((a, b) => b.clicks - a.clicks);
    if (tab === 'cps') players.sort((a, b) => b.cps - a.cps);
    if (tab === 'factories') players.sort((a, b) => b.factories - a.factories);
    
    let html = '';
    players.forEach((p, i) => {
        let medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1) + '.';
        let value = tab === 'clicks' ? format(p.clicks) + ' кликов' : (tab === 'cps' ? format(p.cps) + '/сек' : p.factories + ' заводов');
        
        html += `
            <div style="display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #333; background: ${p.isMe ? 'rgba(255,209,102,0.1)' : 'transparent'}; border-radius: 5px;">
                <div style="color: ${p.isMe ? '#0f0' : '#fff'}; font-weight: ${p.isMe ? 'bold' : 'normal'};">${medal} ${p.name}</div>
                <div style="color: #0f0; font-weight: bold;">${value}</div>
            </div>
        `;
    });
    
    content.innerHTML = html;
};

window.sellAll = function(resId, pricePerUnit) {
    if (!window.playerOre) return;
    let amount = Math.floor(window.playerOre[resId] || 0);
    
    if (amount <= 0) return alert('У тебя нет этого ресурса!');
    
    let totalPrice = amount * pricePerUnit;
    
    // Продаем всё
    window.playerOre[resId] = 0;
    state.cookies += totalPrice;
    state.totalBaked += totalPrice;
    
    if (typeof showToast === 'function') showToast(`💰 Продано ${amount} за ${format(totalPrice)} 🍪`);
    
    // Сохраняем
    if (typeof saveOreData === 'function') saveOreData();
    else localStorage.setItem('megaClicker_ore', JSON.stringify(window.playerOre));
    
    if (typeof renderStats === 'function') renderStats();
    if (typeof save === 'function') save();
    
    // Обновляем цифры в меню
    updateMarketUI();
};

window.sellResourceFromMarket = function(resId) {
    let amount = parseInt(document.getElementById('market-amount').value);
    let price = parseInt(document.getElementById('market-price').value);
    let result = document.getElementById('market-result');
    
    if(isNaN(amount) || amount <= 0) return result.innerHTML = '<span style="color:#ff5252;">Введи количество!</span>';
    if(isNaN(price) || price <= 0) return result.innerHTML = '<span style="color:#ff5252;">Введи цену!</span>';
    
    // ЛИМИТ НА ЦЕНУ: не больше 1 миллиарда за один лот
    const MAX_PRICE = 1000000000;
    if (price > MAX_PRICE) {
        price = MAX_PRICE;
        result.innerHTML = '<span style="color:#ffd166;">⚠️ Цена ограничена до 1 млрд!</span>';
        // Даем время прочитать, потом продолжаем
        setTimeout(() => {}, 1000);
    }
    
    if(!window.playerOre) window.playerOre = { coal: 0, copper: 0, iron: 0, gold: 0, diamond: 0 };
    
    let have = window.playerOre[resId] || 0;
    if(have < amount) return result.innerHTML = '<span style="color:#ff5252;">У тебя нет столько ресурсов!</span>';
    
    window.playerOre[resId] -= amount;
    state.cookies += price;
    state.totalBaked += price;
    
    result.innerHTML = `<span style="color:#0f0;">✅ Продано ${amount} за ${format(price)} 🍪</span>`;
    
    if (typeof saveOreData === 'function') saveOreData();
    else localStorage.setItem('megaClicker_ore', JSON.stringify(window.playerOre));
    
    if(typeof renderStats === 'function') renderStats();
    if(typeof save === 'function') save();
};



window.buyResourceFromMarket = function(resId) {
    let amount = parseInt(document.getElementById('market-amount').value);
    let price = parseInt(document.getElementById('market-price').value);
    let result = document.getElementById('market-result');
    
    if(isNaN(amount) || amount <= 0) return result.innerHTML = '<span style="color:#ff5252;">Введи количество!</span>';
    if(isNaN(price) || price <= 0) return result.innerHTML = '<span style="color:#ff5252;">Введи цену!</span>';
    
    // Лимит на покупку (защита от бесконечных ресурсов)
    const MAX_AMOUNT = 1000000; // Не больше 1 млн за раз
    if (amount > MAX_AMOUNT) amount = MAX_AMOUNT;
    
    if(state.cookies < price) return result.innerHTML = '<span style="color:#ff5252;">Мало печенек!</span>';
    
    state.cookies -= price;
    if(!window.playerOre) window.playerOre = { coal: 0, copper: 0, iron: 0, gold: 0, diamond: 0 };
    window.playerOre[resId] = (window.playerOre[resId] || 0) + amount;
    
    result.innerHTML = `<span style="color:#0f0;">✅ Куплено ${amount} за ${format(price)} 🍪</span>`;
    
    if (typeof saveOreData === 'function') saveOreData();
    else localStorage.setItem('megaClicker_ore', JSON.stringify(window.playerOre));
    
    if(typeof renderStats === 'function') renderStats();
    if(typeof save === 'function') save();
};

                    <button onclick="buyMarketLot('${res}', ${lot.slot})" style="background: #0f0; color: white; border: none; padding: 3px 8px; border-radius: 4px; font-size: 10px;">Купить</button>
                </div>`;
            });
            html += `</div>`;
        }
    }
    
    content.innerHTML = html;
};

window.createMarketLot = function() {
    let res = document.getElementById('sell-resource').value;
    let amount = parseInt(document.getElementById('sell-amount').value);
    let price = parseInt(document.getElementById('sell-price').value);
    
    if (isNaN(amount) || amount <= 0 || isNaN(price) || price <= 0) return alert("Введите корректные данные!");
    
    if (!window.factoryData || !window.factoryData.resources || window.factoryData.resources[res] < amount) {
        return alert("У вас нет столько ресурсов!");
    }
    
    window.factoryData.resources[res] -= amount;
    let nextSlot = window.marketLots[res].length > 0 ? Math.max(...window.marketLots[res].map(l => l.slot)) + 1 : 1;
    window.marketLots[res].push({ slot: nextSlot, name: 'Ты', amount: amount, price: price });
    
    alert('Лот выставлен!');
    showMarketTab('sell');
};

window.buyMarketLot = function(res, slot) {
    let lotIndex = window.marketLots[res].findIndex(l => l.slot === slot);
    if (lotIndex === -1) return;
    let lot = window.marketLots[res][lotIndex];
    
    if (state.cookies < lot.price) return alert("Мало печенек!");
    
    state.cookies -= lot.price;
    if (!window.factoryData.resources) window.factoryData.resources = {};
    window.factoryData.resources[res] = (window.factoryData.resources[res] || 0) + lot.amount;
    
    window.marketLots[res].splice(lotIndex, 1);
    alert(`Куплено ${lot.amount} ресурса!`);
    if(typeof renderStats === 'function') renderStats();
    if(typeof save === 'function') save();
    showMarketTab('buy');
};
</script>

window.scanGeoLocation = function() {
    let status = document.getElementById('geo-status');
    let result = document.getElementById('geo-result');
    
    status.innerText = 'Поиск спутников...';
    
    if (!navigator.geolocation) {
        status.innerText = 'GPS не поддерживается на этом устройстве.';
        return;
    }
    
    navigator.geolocation.getCurrentPosition(
        (position) => {
            let lat = position.coords.latitude.toFixed(4);
            let lon = position.coords.longitude.toFixed(4);
            
            // Сохраняем в стейт посещенные координаты (чтобы не давать награду за одно и то же место)
            if (!state.geoVisited) state.geoVisited = [];
            
            let coordKey = `${lat},${lon}`;
            let isNew = !state.geoVisited.includes(coordKey);
            
            if (isNew) {
                state.geoVisited.push(coordKey);
            }
            
            // Определяем тип портала (рандомно, но зависит от координат)
            let hash = Math.abs(Math.sin(lat) * Math.cos(lon)) * 100;
            let portalType, reward, color;
            
            if (hash < 25) {
                portalType = "🌋 Вулканический портал";
                reward = 50000;
                color = "#ff5252";
            } else if (hash < 50) {
                portalType = "❄️ Ледяной портал";
                reward = 75000;
                color = "#00bcd4";
            } else if (hash < 75) {
                portalType = "🌿 Природный портал";
                reward = 100000;
                color = "#4caf50";
            } else {
                portalType = "✨ Космический портал";
                reward = 250000;
                color = "#9c27b0";
            }
            
            let rewardText = isNew ? `Вы нашли новый портал! Награда: +${format(reward)} 🍪` : `Вы уже были здесь. Награда поменьше: +${format(reward / 10)} 🍪`;
            let actualReward = isNew ? reward : reward / 10;
            
            state.cookies += actualReward;
            state.totalBaked += actualReward;
            
            if(typeof renderStats === 'function') renderStats();
            if(typeof save === 'function') save();
            
            status.innerText = `Координаты: ${lat}, ${lon}`;
            result.style.display = 'block';
            result.style.background = `rgba(0,0,0,0.5)`;
            result.style.border = `2px solid ${color}`;
            result.innerHTML = `
                <div style="font-size: 30px; margin-bottom: 10px;">${portalType.split(' ')[0]}</div>
                <h4 style="color: ${color}; margin-bottom: 10px;">${portalType}</h4>
                <p style="font-size: 14px; margin-bottom: 10px;">${rewardText}</p>
                <div style="font-size: 12px; color: #aaa;">Всего открыто порталов: ${state.geoVisited.length}</div>
            `;
        },
        (error) => {
            status.innerText = 'Ошибка GPS: ' + error.message;
        }
    );
};

</script>

window.shareWithGhost = function() {
    let result = document.getElementById('ghost-result');
    let shareAmount = Math.floor(state.cookies * 0.1);
    
    if (shareAmount <= 0) {
        result.innerHTML = '<span style="color: #ff5252;">У тебя нет печенек для обмена!</span>';
        return;
    }
    
    state.cookies -= shareAmount;
    
    // В ответ получаем бонус (рандомно)
    let bonusType = Math.random();
    if (bonusType < 0.5) {
        // Бонус к клику
        let bonus = shareAmount * 2;
        state.cookies += bonus;
        result.innerHTML = `<span style="color: #4caf50;">✨ Призрак доволен! Он дал тебе ${format(bonus)} 🍪 (x2)!</span>`;
    } else {
        // Бонус к кристаллам
        let crystals = Math.max(1, Math.floor(shareAmount / 100000));
        state.crystals = (state.crystals || 0) + crystals;
        result.innerHTML = `<span style="color: #9c27b0;">💎 Призрак дал тебе ${crystals} кристаллов!</span>`;
    }
    
    if(typeof renderStats === 'function') renderStats();
    if(typeof save === 'function') save();
};

window.stealFromGhost = function() {
    let result = document.getElementById('ghost-result');
    
    if (!window.currentGhost) return;
    
    let success = Math.random() < 0.5; // 50% шанс успеха
    
    if (success) {
        let stolen = Math.floor(window.currentGhost.cookies * 0.2); // Крадем 20%
        state.cookies += stolen;
        state.totalBaked += stolen;
        result.innerHTML = `<span style="color: #4caf50;">🥷 Успех! Ты украл ${format(stolen)} 🍪!</span>`;
    } else {
        let penalty = Math.floor(state.cookies * 0.1); // Теряем 10%
        state.cookies -= penalty;
        result.innerHTML = `<span style="color: #ff5252;">💀 Провал! Призрак заметил тебя и забрал ${format(penalty)} 🍪.</span>`;
    }
    
    if(typeof renderStats === 'function') renderStats();
    if(typeof save === 'function') save();
};

</script>

window.puzzleFlipped = [];
window.puzzleMatched = 0;

window.startPuzzle = function() {
    const grid = document.getElementById('puzzle-grid');
    if (!grid) return;
    
    let symbols = ['🍪', '💎', '🔥', '⭐', '🍩', '🎁', '💀', '🌌'];
    let deck = [...symbols, ...symbols].sort(() => Math.random() - 0.5);
    
    window.puzzleCards = deck;
    window.puzzleFlipped = [];
    window.puzzleMatched = 0;
    grid.innerHTML = '';
    
    deck.forEach((sym, i) => {
        let cell = document.createElement('div');
        cell.style = 'height: 60px; background: #222; border: 1px solid #444; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; color: transparent;';
        cell.dataset.sym = sym;
        cell.dataset.index = i;
        cell.innerText = sym;
        cell.onclick = () => flipPuzzleCard(cell);
        grid.appendChild(cell);
    });
};

window.flipPuzzleCard = function(cell) {
    if (window.puzzleFlipped.length >= 2 || cell.style.color === 'white') return;
    
    cell.style.color = 'white';
    cell.style.background = '#333';
    window.puzzleFlipped.push(cell);
    
    if (window.puzzleFlipped.length === 2) {
        let [a, b] = window.puzzleFlipped;
        if (a.dataset.sym === b.dataset.sym) {
            // Пара найдена
            a.style.background = '#4caf50';
            b.style.background = '#4caf50';
            window.puzzleFlipped = [];
            window.puzzleMatched++;
            
            if (window.puzzleMatched === 8) {
                state.cookies += 100000;
                state.totalBaked += 100000;
                showToast('🧩 Пазл собран! +100 000 🍪');
                if(typeof renderStats === 'function') renderStats();
                if(typeof save === 'function') save();
            }
        } else {
            // Не пара
            setTimeout(() => {
                a.style.color = 'transparent';
                b.style.color = 'transparent';
                a.style.background = '#222';
                b.style.background = '#222';
                window.puzzleFlipped = [];
            }, 500);
        }
    }
};

</script>

                // Закрываем меню
                document.getElementById('hardcoded-more-menu').style.display = 'none';
                
                // Вызываем нужную функцию (или заглушку, если функции нет)
                if (f.id === 'quantum' && typeof window.openQuantumMenu === 'function') window.openQuantumMenu();

                else if (f.id === 'dna' && typeof window.openDnaMenu === 'function') window.openDnaMenu();
                else if (f.id === 'file' && typeof window.openFileMenu === 'function') window.openFileMenu();

        else { result.innerHTML += `<div style="color: #ff5252;">💀 Проигрыш</div>`; }

window.bankDeposit = function() {
    let val = parseInt(document.getElementById('bank-input').value);
    if (isNaN(val) || val <= 0) return alert('Введите сумму!');
    if (state.cookies < val) return alert('Мало печенек!');
    state.cookies -= val;
    if (!state.bank) state.bank = { balance: 0, lastInterest: Date.now() };
    state.bank.balance += val;
    alert(`Вложено ${format(val)} 🍪`);
    if(typeof renderStats === 'function') renderStats(); if(typeof save === 'function') save();
    openBankMenu();
};
window.bankWithdraw = function() {
    if (!state.bank || !state.bank.balance) return alert('Нет вклада!');
    let val = parseInt(document.getElementById('bank-input').value);
    if (isNaN(val) || val <= 0) val = state.bank.balance;
    if (val > state.bank.balance) val = state.bank.balance;
    state.cookies += val;
    state.bank.balance -= val;
    alert(`Снято ${format(val)} 🍪`);
    if(typeof renderStats === 'function') renderStats(); if(typeof save === 'function') save();
    openBankMenu();
};

    `;
};

    }

    function showOreToast(oreKey, amount, isFound = true) {

<script>
// --- НОВАЯ МАТЕМАТИКА БАЛАНСА ---

// 1. Стоимость покупки (растет на 15% за уровень)
window.costOf = function(item) {
    const owned = state.upgrades[item.id] || 0;
    
    // Базовая цена (берем из твоего массива SHOP)
    let base = item.baseCost;
    
    // Жесткий рост для заводов и улучшений
    let multiplier = Math.pow(1.15, owned);
    
    return Math.floor(base * multiplier);
};

// 2. Доход в секунду (тоже растет на 15% за уровень, если это завод)
window.cookiesPerSecond = function() {
    let totalIncome = 0;
    
    if (typeof SHOP !== 'undefined') {
        SHOP.forEach(item => {
            const owned = state.upgrades[item.id] || 0;
            if (owned > 0) {
                if (item.cat === 'cps' || item.cat === 'hybrid') {
                    // Базовый доход за 1 уровень
                    let baseIncome = item.value;
                    
                    // Доход умножается на 1.15 за каждый уровень (как и цена)
                    let currentIncome = baseIncome * Math.pow(1.15, owned - 1) * owned;
                    
                    totalIncome += currentIncome;
                }
            }
        });
    }
    
    // Добавляем доход от кликов (если есть авто-кликеры)
    if (state.upgrades['auto']) {
        totalIncome += cookiesPerClick() * 1; // 1 клик в сек
    }
    
    // Множители (престиж, кристаллы и т.д.)
    let mult = typeof totalMultiplier === 'function' ? totalMultiplier() : 1;
    
    return Math.floor(totalIncome * mult);
};

// 3. Функция покупки
window.buy = function(item) {
    const cost = window.costOf(item);
    if (state.cookies < cost) return;
    
    state.cookies -= cost;
    state.upgrades[item.id] = (state.upgrades[item.id] || 0) + 1;
    
    if (typeof sfxBuy === 'function') sfxBuy();
    if (typeof renderStats === 'function') renderStats();
    if (typeof renderPanel === 'function') renderPanel();
    if (typeof checkAchievements === 'function') checkAchievements();
    if (typeof save === 'function') save();
};

// 4. Мгновенный пересчет (чтобы UI обновился)
setInterval(() => {
    if (typeof renderStats === 'function') renderStats();
}, 1000);
</script>

            let cost = 10;     // Начальная цена
            
            for (let i = 1; i <= 100; i++) {
                let name = clickNames[(i - 1) % clickNames.length];
                SHOP_CLICK.push({ 
                    id: 'c' + i, 
                    name: `${name} ${i}`, 
                    desc: `+${format(val)} к клику`, 
                    cost: cost, 
                    val: val 
                });
                
                // Идеальная прогрессия для кликера:
                // Доход растет в 1.15 раза, Цена растет в 1.18 раза.
                // На 100 уровне цена будет ~ 100 млн, а доход ~ 10 млн. Это баланс.
                val = Math.floor(val * 1.15 + 1);
                cost = Math.floor(cost * 1.18 + 10);

            let cost = 50;     // Начальная цена
            
            for (let i = 1; i <= 100; i++) {
                let name = cpsNames[(i - 1) % cpsNames.length];
                SHOP_CPS.push({ 
                    id: 'p' + i, 
                    name: `${name} ${i}`, 
                    desc: `+${format(val)} в сек`, 
                    cost: cost, 
                    val: val 
                });
                
                // Пассив должен окупаться чуть дольше, чем клик
                val = Math.floor(val * 1.15 + 2);
                cost = Math.floor(cost * 1.18 + 20);
            }
        }
        
        console.log("✅ Экономика полностью пересчитана! Скачков на 100 ур. больше нет.");
