        }

        // Инициализация данных друзей
        if (!state.friends) {
            state.friends = { invited: [], bonusMult: 1 };
        }

        // 1. ПРОВЕРКА РЕФЕРАЛЬНОЙ ССЫЛКИ ПРИ ЗАГРУЗКЕ
        window.checkReferral = function() {
            let urlParams = new URLSearchParams(window.location.search);
            let refId = urlParams.get('ref');
            
            if (refId && refId != state.playerId && !state.friends.invited.includes(refId)) {
                state.friends.invited.push(refId);
                state.friends.bonusMult += 0.05; // +5% к доходу за друга
                
                // Награда тому, кто пригласил (в реальной игре это было бы через сервер)
                state.crystals += 500; 
                
                showToast(`👥 Ты пришел по ссылке друга! Бонус +5% к доходу!`);
                if (typeof save === 'function') save();
            }
        };
        
        // Запускаем проверку
        checkReferral();

        // 2. МЕНЮ ДРУЗЕЙ
        window.openFriendsMenu = function() {
            let refLink = window.location.origin + window.location.pathname + '?ref=' + state.playerId;
            let invitedCount = state.friends.invited.length;
            let bonusPercent = invitedCount * 5;

            <div style="background:#000; border:1px solid #0f0; padding:10px; border-radius:5px; word-break:break-all; font-size:10px; color:#0f0; margin-bottom:15px;">

            showCustomModal(html);

        // 3. КОПИРОВАНИЕ ССЫЛКИ
        window.copyRefLink = function(link) {
            navigator.clipboard.writeText(link).then(() => {
                showToast('📋 Ссылка скопирована! Отправь её другу.');
            }).catch(() => {
                showToast('❌ Не удалось скопировать. Выдели текст вручную.');
            });
        };

        // 4. ПРИМЕНЕНИЕ БОНУСА ОТ ДРУЗЕЙ
        const oldGetMultipliers = window.getMultipliers;
        window.getMultipliers = function() {
            let base = { mClick: 1, mCps: 1 };
            if (typeof oldGetMultipliers === 'function') base = oldGetMultipliers();
            
            if (state.friends && state.friends.bonusMult) {
                base.mClick *= state.friends.bonusMult;
                base.mCps *= state.friends.bonusMult;
            }
            return base;
        };

        console.log("✅ Система Друзей 2.0 загружена!");
    }, 1500);
});
</script>

<script>
// ==========================================
// ГЕНЕРАЛЬНЫЙ ФИКС РЫНКА (УДАЛЯЕМ БИРЖУ, ЧИНИМ РЫНОК)
// ==========================================
window.addEventListener('load', () => {
    setTimeout(() => {
        if (typeof state === 'undefined') return;

        // 1. УДАЛЯЕМ ЛИШНЮЮ КНОПКУ "БИРЖА" ИЗ МЕНЮ
        let menu = document.getElementById('hardcoded-more-menu');
        if (menu) {
            let buttons = menu.querySelectorAll('button');
            buttons.forEach(btn => {
                let text = btn.innerText || btn.textContent;
                if (text.includes('Биржа')) {
                    btn.remove(); // Физически удаляем кнопку
                }
            });
        }

        // 2. ПОЛНОСТЬЮ ПЕРЕПИСЫВАЕМ РЫНОК (САМАЯ ЛУЧШАЯ ВЕРСИЯ)
        window.openMarketMenu = function() {
            // Инициализируем данные, если их нет
            if (!state.market) state.market = {};
            if (!state.market.prices) state.market.prices = { coal: 50, copper: 250, iron: 1000, gold: 5000, diamond: 25000 };
            
            // Все 5 руд
            const ores = [
                { id: 'coal', name: 'Уголь', icon: '🪨', base: 50 },
                { id: 'copper', name: 'Медь', icon: '🟠', base: 250 },
                { id: 'iron', name: 'Железо', icon: '⚙️', base: 1000 },
                { id: 'gold', name: 'Золото', icon: '🟡', base: 5000 },
                { id: 'diamond', name: 'Алмаз', icon: '💎', base: 25000 }
            ];

            let html = `<h3 style="text-align:center; color:#0f0; text-shadow:0 0 10px #0f0;">💱 Торговый Рынок</h3>
            <p style="text-align:center; color:#aaa; font-size:11px; margin-bottom:15px;">Цены обновляются в реальном времени</p>
            
            <div style="max-height:55vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px;">`;

            ores.forEach(ore => {
                let currentPrice = state.market.prices[ore.id];
                let owned = (state.inventory && state.inventory[ore.id]) || 0;
                
                // Считаем изменение цены
                let diff = currentPrice - ore.base;
                let isUp = diff >= 0;
                let color = isUp ? '#0f0' : '#f00';
                let arrow = isUp ? '📈' : '📉';

                html += `
                <div style="background:rgba(0,0,0,0.5); border:1px solid #333; border-radius:10px; padding:12px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span style="font-size:20px;">${ore.icon}</span>
                            <b style="color:#fff; font-size:14px;">${ore.name}</b>
                        </div>
                        <div style="text-align:right;">
                            <span style="color:${color}; font-weight:bold; font-size:14px;">${format(currentPrice)} 🍪 ${arrow}</span>
                        </div>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding-top:8px; border-top:1px solid #222;">
                        <span style="color:#aaa; font-size:12px;">В наличии: <b style="color:#0f0;">${format(owned)}</b></span>
                        <div style="display:flex; gap:5px;">
                            <button class="btn-3d btn-3d-red" onclick="sellMarketOre('${ore.id}', 1)" style="padding:5px 10px; font-size:11px;" ${owned < 1 ? 'disabled' : ''}>Продать 1</button>
                            <button class="btn-3d btn-3d-red" onclick="sellMarketOre('${ore.id}', ${owned})" style="padding:5px 10px; font-size:11px;" ${owned < 1 ? 'disabled' : ''}>Всё</button>
                            <button class="btn-3d btn-3d-blue" onclick="buyMarketOre('${ore.id}', 1)" style="padding:5px 10px; font-size:11px;">Купить 1</button>
                        </div>
                    </div>
                </div>`;
            });

            html += `</div>
            <button class="btn-3d" onclick="closeCustomModal()" style="width:100%; margin-top:15px;">Закрыть</button>`;
            showCustomModal(html);
        };

        // 3. ФУНКЦИИ ПОКУПКИ И ПРОДАЖИ
        window.sellMarketOre = function(oreId, amount) {
            if (!state.inventory || (state.inventory[oreId] || 0) < amount) return showToast('❌ Недостаточно руды!');
            let price = state.market.prices[oreId];
            let total = price * amount;
            
            state.inventory[oreId] -= amount;
            state.cookies += total;
            state.totalBaked += total;
            
            showToast(`💱 Продано ${amount} руды за ${format(total)} 🍪`);
            playSound(600, 0.1);
            openMarketMenu(); 
            if (typeof updateUI === 'function') updateUI();
            if (typeof save === 'function') save();
        };

        window.buyMarketOre = function(oreId, amount) {
            let price = state.market.prices[oreId];
            let total = price * amount;
            if (state.cookies < total) return showToast('❌ Не хватает печенек!');
            
            state.cookies -= total;
            if (!state.inventory) state.inventory = {};
            state.inventory[oreId] = (state.inventory[oreId] || 0) + amount;
            
            showToast(`💱 Куплено ${amount} руды за ${format(total)} 🍪`);
            playSound(600, 0.1);
            openMarketMenu();
            if (typeof updateUI === 'function') updateUI();
            if (typeof save === 'function') save();
        };

        // 4. ОБНОВЛЕНИЕ ЦЕН В ФОНЕ (РАБОТАЕТ ВСЕГДА)
        setInterval(() => {
            if (!state.market || !state.market.prices) return;
            
            const ores = ['coal', 'copper', 'iron', 'gold', 'diamond'];
            ores.forEach(id => {
                let current = state.market.prices[id];
                let change = 1 + (Math.random() * 0.04 - 0.02); // от -2% до +2%
                let newPrice = Math.max(10, Math.floor(current * change));
                state.market.prices[id] = newPrice;
            });

            // Если меню открыто, обновляем его каждые 2 секунды
            if (Date.now() % 2 === 0) {
                let modal = document.getElementById('customModal');
                if (modal && modal.style.display === 'flex' && modal.innerText.includes('Торговый Рынок')) {
                    openMarketMenu();
                }
            }
        }, 1000);

        // 5. ПРИНУДИТЕЛЬНАЯ ПРИВЯЗКА КНОПКИ "РЫНОК"
        setTimeout(() => {
            let menu = document.getElementById('hardcoded-more-menu');
            if (menu) {
                let buttons = menu.querySelectorAll('button');
                buttons.forEach(btn => {
                    let text = btn.innerText || btn.textContent;
                    if (text.includes('Рынок')) {
                        btn.onclick = function(e) {
                            e.preventDefault();
                            openMarketMenu();
                        };
                    }
                });
            }
        }, 1000);

        console.log("✅ Рынок починен, Биржа удалена!");
    }, 1500);
});
</script>

<script>
// ==========================================
// ИНТЕГРАЦИЯ С TELEGRAM MINI APPS
// ==========================================
window.addEventListener('load', () => {
    setTimeout(() => {
        // Проверяем, запущена ли игра внутри Telegram
        if (window.Telegram && window.Telegram.WebApp) {
            let tg = window.Telegram.WebApp;
            
            // 1. Сообщаем ТГ, что игра готова к работе
            tg.ready();
            
            // 2. Разворачиваем игру на весь экран
            tg.expand();
            
            // 3. Берем данные игрока
            let user = tg.initDataUnsafe?.user;
            if (user) {
                console.log(`👋 Привет, ${user.first_name}! (ID: ${user.id})`);
                showToast(`👋 Привет, ${user.first_name}!`);
                
                // Сохраняем ID игрока в state для будущих рефералов
                if (!state.playerId) state.playerId = user.id;
                if (typeof save === 'function') save();
            }

            // 4. Красим шапку ТГ в черный (под стиль матрицы)
            tg.setHeaderColor('#000000');
            tg.setBackgroundColor('#000000');

            // 5. Включаем тактильный отклик (вибрацию) при кликах
            // (Только если на телефоне включена вибрация)
            let cookieBtn = document.getElementById('cookieBtn');
            if (cookieBtn) {
                cookieBtn.addEventListener('click', () => {
                    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                });
            }
            
            console.log("✅ Интеграция с Telegram успешно!");
        } else {
            console.log("ℹ️ Игра запущена в обычном браузере (не в Telegram)");
        }
    }, 1000);
});
</script>
