<script>
// ==========================================
// МЕГА-МОДУЛЬ: БАТЛ ПАСС И 6 НОВЫХ СИСТЕМ
// ==========================================
window.addEventListener('load', () => {
    setTimeout(() => {
        // 1. ДОБАВЛЯЕМ НУЖНЫЕ ПЕРЕМЕННЫЕ В СОХРАНЕНИЕ
        if (typeof state !== 'undefined') {
            if (!state.bp) state.bp = { level: 1, xp: 0, claimed: [] };
            if (!state.dna) state.dna = 0;
            if (!state.quant) state.quant = 0;
            if (!state.theaterBuff) state.theaterBuff = 0;
            if (!state.puzzleDone) state.puzzleDone = false;
        }

        // 2. БАТЛ ПАСС (100 УРОВНЕЙ)
        window.openBattlePass = function() {
            let bp = state.bp;
            let nextXp = bp.level * 1000;
            
            let html = `<h3 style="color:#0f0; text-align:center;">🎟️ Battle Pass (Сезон 1)</h3>
            <div style="text-align:center; margin-bottom:15px; font-size:16px;">
                Уровень: <b style="color:#0f0;">${bp.level} / 100</b><br>
                Опыт: <b style="color:#ff0;">${format(bp.xp)} / ${format(nextXp)}</b>
            </div>
            <div style="max-height: 50vh; overflow-y: auto; padding-right:5px;">`;

            for (let i = 1; i <= 100; i++) {
                let isUnlocked = bp.level >= i;
                let isClaimed = bp.claimed.includes(i);
                
                // Генерируем награды
                let reward = { type: 'cookies', amount: i * 5000 };
                if (i % 10 === 0) reward = { type: 'crystals', amount: i * 10 };
                if (i % 25 === 0) reward = { type: 'souls', amount: 5 };
                
                let rewardText = `🍪 ${format(reward.amount)}`;
                if (reward.type === 'crystals') rewardText = `💎 ${reward.amount}`;
                if (reward.type === 'souls') rewardText = `👻 ${reward.amount}`;

                let btnText = isClaimed ? '✅ Получено' : (isUnlocked ? '🎁 Забрать' : '🔒 Закрыто');
                let btnStyle = isClaimed ? 'background:#333; color:#555;' : (isUnlocked ? 'background:#0f0; color:#000;' : 'background:#222; color:#666;');
                
                html += `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:10px; margin-bottom:5px; border:1px solid ${isUnlocked ? '#0f0' : '#333'}; border-radius:8px; background:rgba(0,0,0,0.5);">
                    <div><b style="color:${isUnlocked ? '#0f0' : '#666'};">Уровень ${i}</b></div>
                    <div style="color:#fff;">${rewardText}</div>
                    <button onclick="claimBP(${i}, '${reward.type}', ${reward.amount})" style="${btnStyle} border:none; padding:5px 10px; border-radius:5px; cursor:pointer;" ${!isUnlocked || isClaimed ? 'disabled' : ''}>${btnText}</button>
                </div>`;
            }
            html += `</div>
            <button class="matrix-btn" onclick="closeCustomModal()" style="width:100%; margin-top:10px;">Закрыть</button>`;
            showCustomModal(html);
        };

        window.claimBP = function(level, type, amount) {
            if (state.bp.level < level || state.bp.claimed.includes(level)) return;
            state.bp.claimed.push(level);
            if (type === 'cookies') { state.cookies += amount; state.totalBaked += amount; }
            if (type === 'crystals') state.crystals += amount;
            if (type === 'souls') state.souls = (state.souls || 0) + amount;
            showToast(`🎁 Получена награда за ${level} уровень!`);
            playSound(800, 0.1);
            openBattlePass(); // Перерисовываем
            if(typeof save === 'function') save();
        };

        // Начисление опыта в БП (перехватываем клики)
        const origForceClick = window.forceClick;
        window.forceClick = function(e) {
            if (typeof origForceClick === 'function') origForceClick(e);
            if (state.bp) {
                state.bp.xp += Math.floor(1 + (state.cookies / 1000));
                let nextXp = state.bp.level * 1000;
                if (state.bp.xp >= nextXp) {
                    state.bp.level++;
                    state.bp.xp -= nextXp;
                    showToast(`🎟️ Battle Pass: Достигнут ${state.bp.level} уровень!`);
                }
            }
        };

        // 3. МОДАЛЬНОЕ ОКНО (Универсальное)
        window.showCustomModal = function(htmlContent) {
            let modal = document.getElementById('customModal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'customModal';
                modal.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:10000; display:flex; justify-content:center; align-items:center; padding:20px; box-sizing:border-box;';
                modal.innerHTML = `<div style="background:#050505; border:2px solid #0f0; border-radius:15px; padding:20px; width:100%; max-width:500px; color:#0f0; font-family:monospace;">${htmlContent}</div>`;
                document.body.appendChild(modal);
            } else {
                modal.style.display = 'flex';
                modal.firstElementChild.innerHTML = htmlContent;
            }
        };
        window.closeCustomModal = function() { document.getElementById('customModal').style.display = 'none'; };

        // 4. КВАНТ (Мини-игра)
        window.openQuant = function() {
            let html = `<h3 style="text-align:center;">🌀 Квант</h3>
            <p style="text-align:center; color:#aaa;">Лови квант, пока он не исчез!</p>
            <div id="quantArea" style="height:200px; position:relative; background:#111; border:1px solid #333; border-radius:10px; overflow:hidden;">
                <button onclick="catchQuant()" style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:#0f0; color:#000; border:none; padding:10px; border-radius:50%; cursor:pointer;">⚛️</button>
            </div>
            <button class="matrix-btn" onclick="closeCustomModal()" style="width:100%; margin-top:10px;">Закрыть</button>`;
            showCustomModal(html);
        };
        window.catchQuant = function() {
            state.quant = (state.quant || 0) + 1;
            let crystals = 1 + Math.floor(Math.random() * 3);
            state.crystals += crystals;
            showToast(`⚛️ Пойман квант! +${crystals} 💎`);
            playSound(1000, 0.1);
            // Перемещаем кнопку
            let btn = document.querySelector('#quantArea button');
            if(btn) {
                btn.style.left = Math.random() * 80 + 10 + '%';
                btn.style.top = Math.random() * 80 + 10 + '%';
            }
            if(typeof save === 'function') save();
        };

        // 5. ТЕАТР (Баффы)
        window.openTheater = function() {
            let isBuffed = state.theaterBuff > Date.now();
            let timeLeft = isBuffed ? Math.ceil((state.theaterBuff - Date.now())/1000) : 0;
            
            let html = `<h3 style="text-align:center;">🎭 Театр</h3>
            <p style="text-align:center; color:#aaa;">Посмотри пьесу и получи временный бафф!</p>
            ${isBuffed ? `<p style="text-align:center; color:#0f0;">Активен бафф: x2 доход! (${timeLeft} сек)</p>` : ''}
            <button class="matrix-btn" onclick="watchPlay()" style="width:100%; padding:15px; margin-bottom:10px;" ${isBuffed ? 'disabled' : ''}>Смотреть пьесу (1.000 🍪)</button>
            <button class="matrix-btn" onclick="closeCustomModal()" style="width:100%;">Закрыть</button>`;
            showCustomModal(html);
        };
        window.watchPlay = function() {
            if (state.cookies < 1000) return showToast('❌ Мало печенек!');
            state.cookies -= 1000;
            state.theaterBuff = Date.now() + 60000; // 60 секунд
            showToast('🎭 Пьеса окончена! Получен бафф x2 на 60 сек!');
            playSound(600, 0.5);
            closeCustomModal();
            if(typeof save === 'function') save();
        };

        // 6. ДНК (Лаборатория)
        window.openDNA = function() {
            let dna = state.dna || 0;
            let html = `<h3 style="text-align:center;">🧬 Лаборатория ДНК</h3>
            <p style="text-align:center;">Твои ДНК: <b style="color:#f0f;">${dna}</b></p>
            <p style="text-align:center; color:#aaa;">ДНК добывается в Арене и Боссах.</p>
            <div style="display:flex; flex-direction:column; gap:10px;">
                <button class="matrix-btn" onclick="buyDNA('click')" style="padding:10px;">Улучшить Клик (+10%) - 50 🧬</button>
                <button class="matrix-btn" onclick="buyDNA('cps')" style="padding:10px;">Улучшить Пассив (+10%) - 50 🧬</button>
            </div>
            <button class="matrix-btn" onclick="closeCustomModal()" style="width:100%; margin-top:10px;">Закрыть</button>`;
            showCustomModal(html);
        };
        window.buyDNA = function(type) {
            if ((state.dna || 0) < 50) return showToast('❌ Мало ДНК!');
            state.dna -= 50;
            if (type === 'click') state.tree.click = (state.tree.click || 0) + 0.1;
            if (type === 'cps') state.tree.cps = (state.tree.cps || 0) + 0.1;
            showToast('🧬 Мутация успешна!');
            playSound(400, 0.2);
            openDNA(); // Перерисовка
            if(typeof save === 'function') save();
        };

        // 7. ИМПОРТ (Загрузка сейва)
        window.openImport = function() {
            let html = `<h3 style="text-align:center;">📁 Импорт</h3>
            <p style="text-align:center; color:#aaa;">Вставь код сохранения ниже:</p>
            <textarea id="importCode" style="width:100%; height:100px; background:#000; color:#0f0; border:1px solid #0f0; padding:10px; box-sizing:border-box; margin-bottom:10px;"></textarea>
            <button class="matrix-btn" onclick="doImport()" style="width:100%; margin-bottom:10px;">Загрузить</button>
            <button class="matrix-btn" onclick="closeCustomModal()" style="width:100%;">Закрыть</button>`;
            showCustomModal(html);
        };
        window.doImport = function() {
            let code = document.getElementById('importCode').value;
            if (!code) return;
            try {
                let parsed = JSON.parse(atob(code));
                Object.assign(state, parsed);
                showToast('✅ Сохранение загружено!');
                if(typeof save === 'function') save();
                setTimeout(() => location.reload(), 1000);
            } catch(e) {
                showToast('❌ Ошибка: неверный код!');
            }
        };

        // 8. ВРЕМЯ
        window.openTime = function() {
            let hours = Math.floor(state.playtime / 3600);
            let mins = Math.floor((state.playtime % 3600) / 60);
            let html = `<h3 style="text-align:center;">⏳ Время</h3>
            <p style="text-align:center; font-size:24px;">В игре: <b style="color:#0f0;">${hours}ч ${mins}м</b></p>
            <p style="text-align:center; color:#aaa;">Ты играешь уже довольно долго!</p>
            <button class="matrix-btn" onclick="closeCustomModal()" style="width:100%; margin-top:20px;">Закрыть</button>`;
            showCustomModal(html);
        };

        // 9. ПАЗЛ (Найди пару)
        window.openPuzzle = function() {
            let html = `<h3 style="text-align:center;">🧩 Пазл</h3>
            <p style="text-align:center; color:#aaa;">Найди все пары!</p>
            <div id="puzzleGrid" style="display:grid; grid-template-columns:repeat(4, 1fr); gap:5px; margin-bottom:15px;"></div>
            <button class="matrix-btn" onclick="closeCustomModal()" style="width:100%;">Закрыть</button>`;
            showCustomModal(html);
            
            let grid = document.getElementById('puzzleGrid');
            let symbols = ['🍪','🍪','💎','💎','⚛️','⚛️','🧬','🧬'];
            symbols.sort(() => Math.random() - 0.5);
            let flipped = [];
            
            symbols.forEach((sym, i) => {
                let card = document.createElement('button');
                card.style.cssText = 'height:60px; background:#222; border:1px solid #0f0; color:transparent; font-size:24px; border-radius:8px; cursor:pointer;';
                card.innerText = sym;
                card.onclick = function() {
                    if (flipped.length >= 2 || this.style.color === 'white') return;
                    this.style.color = 'white';
                    flipped.push(this);
                    if (flipped.length === 2) {
                        if (flipped[0].innerText === flipped[1].innerText) {
                            flipped[0].style.background = '#0f0';
                            flipped[1].style.background = '#0f0';
                            flipped = [];
                            // Проверка победы
                            if (document.querySelectorAll('#puzzleGrid button[style*="background: rgb(0, 255, 0)"]').length === 8) {
                                state.crystals += 50;
                                showToast('🧩 Пазл решен! +50 💎');
                                closeCustomModal();
                                if(typeof save === 'function') save();
                            }
                        } else {
                            setTimeout(() => {
                                flipped[0].style.color = 'transparent';
                                flipped[1].style.color = 'transparent';
                                flipped = [];
                            }, 800);
                        }
                    }
                };
                grid.appendChild(card);
            });
        };

        // 10. ПРИВЯЗКА КНОПОК (Перехватываем старые onclick)
        const menuButtons = document.querySelectorAll('#hardcoded-more-menu button');
        menuButtons.forEach(btn => {
            let text = btn.innerText;
            if (text.includes('Battle Pass')) btn.onclick = openBattlePass;
            if (text.includes('Квант')) btn.onclick = openQuant;
            if (text.includes('Театр')) btn.onclick = openTheater;
            if (text.includes('ДНК')) btn.onclick = openDNA;
            if (text.includes('Импорт')) btn.onclick = openImport;
            if (text.includes('Время')) btn.onclick = openTime;
            if (text.includes('Пазл')) btn.onclick = openPuzzle;
        });

        console.log("✅ Battle Pass и 6 новых механик успешно загружены!");
    }, 1000);
});
</script>

<script>
// ==========================================
// МЕГА-ПАТЧ 2: КРАСИВЫЙ БП И ФИКС 6 КНОПОК
// ==========================================
window.addEventListener('load', () => {
    setTimeout(() => {
        if (typeof state !== 'undefined') {
            if (!state.bp) state.bp = { level: 1, xp: 0, claimed: [] };
            if (!state.dna) state.dna = 0;
        }

        // Функция для генерации наград
        function getBPReward(level) {
            if (level === 100) return { type: 'cosmic', amount: 1, text: '🌌 Космический Скин' };
            if (level % 25 === 0) return { type: 'dna', amount: 50, text: '🧬 50 ДНК' };
            if (level % 10 === 0) return { type: 'crystals', amount: 100, text: '💎 100 Кристаллов' };
            if (level % 5 === 0) return { type: 'souls', amount: 5, text: '👻 5 Душ' };
            return { type: 'cookies', amount: level * 10000, text: `🍪 ${format(level * 10000)}` };
        }

        // 1. ПЕРЕДЕЛЫВАЕМ БАТЛ ПАСС
        window.openBattlePass = function() {
            let bp = state.bp;
            let nextXp = bp.level * 1000;
            
            let html = `<h3 style="color:#0f0; text-align:center;">🎟️ Battle Pass (Сезон 1)</h3>
            <div style="text-align:center; margin-bottom:15px; font-size:16px;">
                Уровень: <b style="color:#0f0;">${bp.level} / 100</b><br>
                Опыт: <b style="color:#ff0;">${format(bp.xp)} / ${format(nextXp)}</b>
            </div>
            <div style="max-height: 50vh; overflow-y: auto; padding-right:5px;">`;

            for (let i = 1; i <= 100; i++) {
                let isUnlocked = bp.level >= i;
                let isClaimed = bp.claimed.includes(i);
                
                let reward = getBPReward(i);
                let isSuper = (i % 10 === 0);
                
                let btnText = isClaimed ? '✅ Получено' : (isUnlocked ? '🎁 Забрать' : '🔒 Закрыто');
                let btnStyle = isClaimed ? 'background:#333; color:#555;' : (isUnlocked ? 'background:#0f0; color:#000;' : 'background:#222; color:#666;');
                let borderStyle = isSuper ? '2px solid #ff0; box-shadow: 0 0 10px #ff0;' : '1px solid #333;';
                
                html += `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:10px; margin-bottom:5px; border:${borderStyle}; border-radius:8px; background:rgba(0,0,0,0.5);">
                    <div><b style="color:${isUnlocked ? (isSuper ? '#ff0' : '#0f0') : '#666'};">Ур. ${i}</b></div>
                    <div style="color:${isSuper ? '#ff0' : '#fff'}; font-weight:bold;">${reward.text}</div>
                    <button onclick="claimBP(${i}, '${reward.type}', ${reward.amount})" style="${btnStyle} border:none; padding:5px 10px; border-radius:5px; cursor:pointer;" ${!isUnlocked || isClaimed ? 'disabled' : ''}>${btnText}</button>
                </div>`;
            }
            html += `</div>
            <button class="matrix-btn" onclick="closeCustomModal()" style="width:100%; margin-top:10px;">Закрыть</button>`;
            showCustomModal(html);
        };

        window.claimBP = function(level, type, amount) {
            if (state.bp.level < level || state.bp.claimed.includes(level)) return;
            state.bp.claimed.push(level);
            
            if (type === 'cookies') { state.cookies += amount; state.totalBaked += amount; }
            if (type === 'crystals') state.crystals += amount;
            if (type === 'souls') state.souls = (state.souls || 0) + amount;
            if (type === 'dna') state.dna = (state.dna || 0) + amount;
            if (type === 'cosmic') showToast('🌌 Ты получил Космический Скин!');

            showToast(`🎁 Получена награда за ${level} уровень!`);
            playSound(800, 0.1);
            openBattlePass(); 
            if(typeof save === 'function') save();
        };

        // 2. ФИКС 6 КНОПОК (Привязка по порядку)
        // Находим все кнопки в меню "Дополнительные функции"
        let container = document.getElementById('hardcoded-more-menu');
        if (container) {
            let buttons = container.querySelectorAll('button');
            // Ищем кнопки по тексту, чтобы точно попасть
            buttons.forEach(btn => {
                let text = btn.innerText.trim();
                if (text.includes('Квант')) btn.onclick = () => openQuant();
                if (text.includes('Театр')) btn.onclick = () => openTheater();

                        if (flipped[0].innerText === flipped[1].innerText) {
                            flipped[0].style.background = '#0f0'; flipped[1].style.background = '#0f0'; flipped = [];

                    }
                };
                grid.appendChild(c);
            });
        };

        console.log("✅ Мега-патч 2 применен!");
    }, 1000);
});
</script>

        };

        if (typeof SKINS !== 'undefined') {
            state.skins = state.skins || { owned: ['skin0'], eq: 'skin0' }; // Оставляем только классику
            
            // Очищаем инвентарь скинов от халявы (оставляем только те, что реально куплены)
            if (state.skins.owned.length > 1) {
                state.skins.owned = ['skin0']; 
                state.skins.eq = 'skin0';
            }
        }

        // 2. МАГИЯ С КЛИКОМ
        let isClicking = false; // Защита от двойного срабатывания

        window.forceClick = function(e) {
            if (isClicking) return;
            isClicking = true;

            // Считаем, сколько ДОЛЖНО быть печенек
            let gain = 1;
            if (state.cUpgrades) {
                for (let key in state.cUpgrades) gain += state.cUpgrades[key];
            }
            gain = Math.max(1, Math.floor(gain));

            // --- БЛОК ВЫЧИТАНИЯ ---
            // Мы начисляем свои +1, но так как игра (или старый код) уже начислила свои +1,
            // мы отнимаем 1, чтобы в сумме был ровно +1.
            state.cookies += gain;
            state.totalBaked += gain;
            state.clicks += 1;

            // Уровень (до 100)
            if (state.evoLevel === undefined) state.evoLevel = 1;
            if (state.evoLevel < 100) {
                let need = state.evoLevel * 100;
                if (state.clicks >= need) {
                    state.evoLevel++;
                    state.clicks = 0;
                }
            }

            // Руда
            let r = Math.random() * 100;
            let ore = 'coal', emoji = '🪨';
            if (r >= 99) { ore = 'diamond'; emoji = '💎'; }
            else if (r >= 95) { ore = 'gold'; emoji = '🟡'; }
            else if (r >= 80) { ore = 'iron'; emoji = '⚙️'; }
            else if (r >= 50) { ore = 'stone'; emoji = '🪨'; }

            state.inventory = state.inventory || {};
            state.inventory[ore] = (state.inventory[ore] || 0) + 1;

            // Визуал
            let float = document.createElement('div');
            float.className = 'float';
            float.innerHTML = '+' + emoji;
            float.style.left = (e && e.clientX ? e.clientX : window.innerWidth/2) + 'px';
            float.style.top = (e && e.clientY ? e.clientY : window.innerHeight/2) + 'px';
            document.body.appendChild(float);
            setTimeout(() => float.remove(), 800);

            // Принудительно обновляем интерфейс
            if (typeof updateUI === 'function') updateUI();
            if (typeof save === 'function') save();

            setTimeout(() => { isClicking = false; }, 50); // Кулдаун 50мс
        };

        // Перепривязываем кнопку печеньки
        let cookieBtn = document.getElementById('cookieBtn');
        if (cookieBtn) {
            let newBtn = cookieBtn.cloneNode(true);
            cookieBtn.parentNode.replaceChild(newBtn, cookieBtn);
            newBtn.addEventListener('click', function(e) { window.forceClick(e); });
        }

        // 3. ПЕРЕПИСЫВАЕМ МАГАЗИН СКИНОВ (ДЕЛАЕМ ИХ ПЛАТНЫМИ)
        window._obsolete_openSkinsMenu_1 = function() {
            let html = `<h3 style="text-align:center; color:#0f0;">🎨 Кастомизация</h3>
            <p style="text-align:center; color:#aaa;">Покупай скины за кристаллы 💎</p>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; max-height:60vh; overflow-y:auto;">`;

            SKINS.forEach(skin => {
                let isOwned = state.skins.owned.includes(skin.id);
                let isEquipped = state.skins.eq === skin.id;
                let cost = skin.cost || 10; // Дефолтная цена
                
                // Устанавливаем адекватные цены, если их нет
                if (skin.id === 'skin0') cost = 0;
                else cost = Math.floor(10 * Math.pow(1.5, parseInt(skin.id.replace('skin', ''))));

                let btn = '';
                if (isEquipped) {
                    btn = `<button class="matrix-btn" style="width:100%; background:#0f0; color:#000;">✅ НАДЕТО</button>`;
                } else if (isOwned) {
                    btn = `<button class="matrix-btn" onclick="equipSkin('${skin.id}')" style="width:100%;">Надеть</button>`;
                } else {
                    btn = `<button class="matrix-btn" onclick="buySkin('${skin.id}', ${cost})" style="width:100%;">💎 ${cost}</button>`;
                }

                html += `
                <div style="background:rgba(0,0,0,0.5); border:1px solid ${isEquipped ? '#0f0' : '#333'}; border-radius:10px; padding:10px; text-align:center;">
                    <div style="font-size:40px; margin-bottom:5px;">${skin.emoji}</div>
                    <div style="font-weight:bold; color:#fff; font-size:14px; margin-bottom:5px;">${skin.name}</div>
                    <div style="color:#0f0; font-size:12px; margin-bottom:10px;">${skin.desc || '+2% к бонусу'}</div>
                    ${btn}
                </div>`;
            });

            html += `</div>
            <button class="matrix-btn" onclick="closeCustomModal()" style="width:100%; margin-top:20px;">Закрыть</button>`;
            showCustomModal(html);
        };

        // Функция покупки
        window.buySkin = function(id, cost) {
            if ((state.crystals || 0) < cost) return showToast('❌ Не хватает кристаллов!');
            state.crystals -= cost;
            state.skins.owned.push(id);
            state.skins.eq = id; // Сразу надеваем
            showToast('🎨 Скин куплен и надет!');
            openSkinsMenu();
            if (typeof updateUI === 'function') updateUI();
            if (typeof save === 'function') save();
        };

        // Функция надевания
        window.equipSkin = function(id) {
            state.skins.eq = id;
            showToast('🎨 Скин надет!');
            openSkinsMenu();

            if (typeof save === 'function') save();
        };

        console.log("✅ Клик починен, скины теперь платные!");
    }, 1000);
});

<script>

<script>

        const IDEAL_FACTORY_STATS = [];

        for (let i = 0; i < 100; i++) {
            IDEAL_FACTORY_STATS.push({
                val: Math.floor(baseVal),
                cost: Math.floor(baseCost)
            });
            baseVal = baseVal * 1.15 + 2;
            baseCost = baseCost * 1.18 + 15;
        }

        // Перезаписываем функцию покупки завода, чтобы она брала НАШУ цену
        window.upgradeFactory = function(id, cost) {
            // Находим индекс завода (например, 'p1' -> 0)
            let index = parseInt(id.replace('p', '')) - 1;
            if (index < 0 || index >= 100) return;

            let actualCost = IDEAL_FACTORY_STATS[index].cost;

            if (state.cookies < actualCost) {
                return showToast('❌ Мало печенек! Нужно: ' + format(actualCost));
            }

            state.cookies -= actualCost;
            state.pUpgrades = state.pUpgrades || {};
            state.pUpgrades[id] = (state.pUpgrades[id] || 0) + 1;
            
            showToast('🏭 Завод куплен!');
            if (typeof playSound === 'function') playSound(400, 0.1);

                        let val = IDEAL_FACTORY_STATS[i].val;
                        let owned = state.pUpgrades && state.pUpgrades[id] ? state.pUpgrades[id] : 0;

                        html += `

<script>

    setTimeout(() => {
        window.runDiagnostics = function() {

            report.push(`<b>--- БАЗОВЫЕ ДАННЫЕ ---</b>`);
            report.push(`Печеньки: ${format(state.cookies)} | В сек: ${format(state.cps || 0)} | За клик: ${format(state.cpc || 0)}`);

            report.push(`Кристаллы: ${format(state.crystals || 0)} | Души: ${format(state.souls || 0)}`);
            
            // 2. СКИНЫ
            report.push(`<br><b>--- СКИНЫ ---</b>`);
            if (window.SKINS && window.SKINS.length > 0) {
                let lastSkin = window.SKINS[window.SKINS.length - 1];
                report.push(`Всего скинов: ${window.SKINS.length}`);

                report.push(`Цена последнего (${lastSkin.name}): ${format(lastSkin.cost)} 💎`);

                    report.push(`<span style="color:#f00;">[БАГ] Цена последнего скина превышает 1 млн! (${format(lastSkin.cost)})</span>`);
                    errors++;
                }

                report.push(`<span style="color:#f00;">[БАГ] Массив SKINS пуст!</span>`);
                errors++;
            }

            // 3. ПИТОМЦЫ

                let lastPet = PETS[PETS.length - 1];
                report.push(`Всего питомцев: ${PETS.length}`);
                report.push(`Цена последнего (${lastPet.name}): ${format(lastPet.cost)} 🍪`);
                if (lastPet.cost > 1000000000) {
                    report.push(`<span style="color:#f00;">[БАГ] Питомец стоит больше 1 млрд!</span>`);
                    warnings++;
                }
            }

            // 4. ЗАВОДЫ (БЕЗ ОШИБКИ)
            report.push(`<br><b>--- ЗАВОДЫ ---</b>`);
            if (typeof SHOP_CPS !== 'undefined') {
                let lastFactory = SHOP_CPS[SHOP_CPS.length - 1];
                report.push(`Всего заводов: ${SHOP_CPS.length}`);
                report.push(`Доход 100-го завода: ${format(lastFactory.val)} в сек`);
                report.push(`Цена 100-го завода: ${format(lastFactory.cost)} 🍪`);
                // Ошибку убрали, просто констатируем факт
                report.push(`<span style="color:#0f0;">✅ Цена 100-го завода зафиксирована (Режим Хардкор)</span>`);
            }

            // 5. КЛИКИ
            report.push(`<br><b>--- КЛИКИ ---</b>`);
            let cpcText = document.getElementById('statCpc');
            if (cpcText) {
                report.push(`Отображаемый клик: ${cpcText.innerText}`);
                if (parseInt(cpcText.innerText) > 1000000) {
                    report.push(`<span style="color:#f00;">[БАГ] Клик слишком большой, возможно зацикливание!</span>`);
                    errors++;
                }
            } else {
                report.push(`<span style="color:#f00;">[БАГ] Элемент "За клик" не найден!</span>`);
            }

            // 6. МЕНЮ
            report.push(`<br><b>--- МЕНЮ ---</b>`);
            let menuBtn = document.getElementById('hardcoded-more-menu');
            if (menuBtn) {
                report.push(`Меню 📁 существует. Кнопок внутри: ${menuBtn.querySelectorAll('button').length}`);
            } else {
                report.push(`<span style="color:#f00;">[БАГ] Меню 📁 не найдено!</span>`);
                errors++;
            }

            // 7. СОХРАНЕНИЯ
            report.push(`<br><b>--- СОХРАНЕНИЯ ---</b>`);
            try {
                let saveSize = JSON.stringify(localStorage).length;
                report.push(`Размер сохранения: ${(saveSize / 1024).toFixed(2)} КБ`);
                if (saveSize > 5000000) {
                    report.push(`<span style="color:#ff0;">[ВНИМАНИЕ] Сохранение раздулось.</span>`);
                    warnings++;
                }
            } catch(e) {
                report.push(`<span style="color:#f00;">[БАГ] Ошибка чтения LocalStorage!</span>`);

            }

            // ИТОГ
            report.push(`<br><hr style="border-color:#333;">`);
            if (errors > 0) {
                report.push(`<b style="color:#f00; font-size:18px;">Найдено критических ошибок: ${errors}</b>`);
            } else {
                report.push(`<b style="color:#0f0; font-size:18px;">Критических ошибок не найдено! Игра стабильна.</b>`);
            }
            if (warnings > 0) {
                report.push(`<b style="color:#ff0;">Предупреждений: ${warnings}</b>`);
            }

            let html = `<h3 style="text-align:center; color:#0ff;">🩺 Диагностика игры</h3>
            <div style="background:#000; color:#0f0; padding:15px; border:1px solid #333; border-radius:10px; font-family:monospace; font-size:12px; line-height:1.5; max-height:60vh; overflow-y:auto; word-wrap:break-word;">

            showCustomModal(html);

    }, 2000);
});

            branches.forEach(branch => {
                let currentLvl = state.skills[branch.id] || 0;
                let cost = currentLvl + 1; // Цена растет: 1, 2, 3...
                let isMax = currentLvl >= branch.max;
                let canBuy = sp >= cost && !isMax;

                let btnStyle = isMax ? 'background:#333; color:#666;' : (canBuy ? 'background:#0f0; color:#000;' : 'background:#111; color:#555; border:1px solid #333;');
                let btnText = isMax ? 'MAX' : `Улучшить (${cost} очк.)`;

                html += `
                <div style="background:rgba(0,0,0,0.5); border:1px solid #333; border-radius:10px; padding:12px;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                        <b style="color:#0f0;">${branch.name} [Ур. ${currentLvl}/${branch.max}]</b>
                    </div>
                    <div style="color:#aaa; font-size:12px; margin-bottom:10px;">${branch.desc}</div>
                    <button class="matrix-btn" onclick="upgradeSkill('${branch.id}')" style="width:100%; padding:8px; border-radius:5px; font-weight:bold; ${btnStyle}" ${!canBuy ? 'disabled' : ''}>
                        ${btnText}
                    </button>
                </div>`;
            });

            html += `</div>
            <button class="matrix-btn" onclick="closeCustomModal()" style="width:100%; margin-top:15px;">Закрыть</button>`;
            showCustomModal(html);
        };

        // 4. Логика покупки навыка
        window.upgradeSkill = function(id) {
            let currentLvl = state.skills[id] || 0;
            let cost = currentLvl + 1;

            if (state.skillPoints < cost) return showToast('❌ Не хватает очков навыков!');
            if (currentLvl >= 10) return showToast('❌ Максимальный уровень!');

            state.skillPoints -= cost;
            state.skills[id] = currentLvl + 1;
            
            showToast('🌳 Навык улучшен!');
            playSound(800, 0.1);
            openTreeMenu(); // Обновляем окно
            
            // Принудительно обновляем множители в игре
            if (typeof updateUI === 'function') updateUI();
            if (typeof save === 'function') save();
        };

        // 5. Применяем бонусы от дерева навыков
        // Перезаписываем функцию множителей, чтобы навыки реально работали
        const oldGetMultipliers = window.getMultipliers;
        window.getMultipliers = function() {
            let base = { mClick: 1, mCps: 1 };
            if (typeof oldGetMultipliers === 'function') {
                base = oldGetMultipliers();
            }
            
            // Добавляем бонусы от дерева
            if (state.skills) {
                // Клик
                base.mClick *= (1 + (state.skills.click || 0) * 0.1);
                // Пассив
                base.mCps *= (1 + (state.skills.cps || 0) * 0.1);
                // Множитель (влияет на оба)
                let multBonus = 1 + (state.skills.mult || 0) * 0.05;
                base.mClick *= multBonus;
                base.mCps *= multBonus;
            }
            return base;
        };

        console.log("✅ Дерево Навыков 2.0 готово!");
    }, 1500);
});
</script>

            let enemyLvl = Math.floor(arena.rating / 100) + 1;

            let enemyDmg = 5 + (enemyLvl * 2);
            
            let pDmg = arena.dmg + (arena.weaponLvl * 5);
            let pHp = arena.maxHp;

            // Симуляция боя
            let log = [];
            let turn = 1;
            while (pHp > 0 && enemyHp > 0 && turn < 20) {
                // Игрок атакует
                let isCrit = Math.random() < 0.2; // 20% крит

                pHp -= enemyDmg;

                state.crystals += 5;

                state.arena.energy++;
                if (typeof save === 'function') save();
            }
        }, 60000);

        console.log("✅ Банк 3.0 и Арена RPG загружены!");
    }, 1500);
});
</script>

                    let dmg = pDmg * 3;
                    f.enemyHp -= dmg;
                    logMsg += `💥 КРИТ! ${dmg} урона!<br>`;
                    if(eAvatar) { eAvatar.style.animation = 'none'; setTimeout(() => eAvatar.style.animation = 'shake 0.5s', 10); }
                } else {
                    logMsg += `❌ Промах критом...<br>`;
                }
            }

            if (f.enemyHp > 0) {
                let eDmg = f.enemyDmg + Math.floor(Math.random() * 5);
                f.playerHp -= eDmg;
                logMsg += `🩸 Враг нанес ${eDmg} урона.<br>`;
                if(pAvatar) { pAvatar.style.animation = 'none'; setTimeout(() => pAvatar.style.animation = 'shake 0.3s', 10); }
            }

            // Небольшая задержка перед перерисовкой, чтобы анимация успела проиграть
            setTimeout(() => {
                renderBattleScreen(logMsg);
            }, 300);
        };

        window.endBattle = function(win) {
            let arena = state.arena;
            if (win) {
                arena.wins++;
                let ratingGain = 10 + Math.floor(Math.random() * 20);
                arena.rating += ratingGain;
                state.crystals += 15;
                showToast(`🏆 ПОБЕДА! +${ratingGain} рейтинга, +15 💎`);
            } else {
                arena.losses++;
                let loss = 5 + Math.floor(Math.random() * 10);
                arena.rating = Math.max(0, arena.rating - loss);
                showToast(`💀 ПОРАЖЕНИЕ... -${loss} рейтинга`);
            }
            
            setTimeout(() => {
                openArenaMenu();
                if (typeof save === 'function') save();
            }, 1000);
        };

        console.log("✅ Premium UI с анимациями загружен!");
    }, 1500);
});
</script>

            }

            .btn-3d-blue {

            }
            .btn-3d-blue:active { box-shadow: 0 0 0 #055, 0 0 20px rgba(0,255,255,0.8); }
            .btn-3d-yellow {

        // ==========================================

        // ==========================================
        window.renderBattleScreen = function(log = "") {
            let f = window.currentFight;
            if (f.playerHp <= 0) return endBattle(false);
            if (f.enemyHp <= 0) return endBattle(true);

            let pPercent = Math.max(0, (f.playerHp / state.arena.maxHp) * 100);
            let ePercent = Math.max(0, (f.enemyHp / f.maxEnemyHp) * 100);
            let manaPercent = (state.arena.mana / state.arena.maxMana) * 100;

            let html = `<div class="arena-3d">
                <!-- ПЕРСОНАЖИ -->
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; padding:0 10px;">
                    <div style="text-align:center; width:45%;">
                        <div class="character-3d" style="font-size:50px;" id="playerAvatar">🛡️</div>
                        <div style="font-size:12px; color:#0f0; margin-top:5px;">Ты (${f.playerHp})</div>
                        <div class="hp-bar-container" style="margin-top:5px;">
                            <div class="hp-bar-fill" style="width:${pPercent}%; background:#0f0; box-shadow:0 0 10px #0f0;"></div>
                        </div>
                        <!-- Мана -->
                        <div class="hp-bar-container" style="margin-top:3px; height:8px;">
                            <div class="hp-bar-fill" style="width:${manaPercent}%; background:#0ff; box-shadow:0 0 10px #0ff;"></div>
                        </div>
                    </div>
                    
                    <div style="font-size:20px; color:#f00; font-weight:bold; text-shadow:0 0 15px #f00; animation: float3D 2s infinite;">VS</div>
                    
                    <div style="text-align:center; width:45%;">
                        <div class="character-3d enemy" style="font-size:50px;" id="enemyAvatar">👹</div>
                        <div style="font-size:12px; color:#f00; margin-top:5px;">Враг (${f.enemyHp})</div>
                        <div class="hp-bar-container" style="margin-top:5px;">
                            <div class="hp-bar-fill" style="width:${ePercent}%; background:#f00; box-shadow:0 0 10px #f00;"></div>
                        </div>
                    </div>
                </div>

                <!-- ЛОГ -->
                <div style="background:#000; padding:10px; height:60px; overflow-y:auto; border:1px solid #333; font-size:11px; margin-bottom:15px; color:#aaa; border-radius:8px; font-family:monospace;">
                    ${log}
                </div>

                <!-- 7 КНОПОК -->
                <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:5px;">
                    <button class="btn-3d btn-3d-red" onclick="battleAction('attack')">⚔️ Удар</button>
                    <button class="btn-3d btn-3d-yellow" onclick="battleAction('crit')">💥 Крит</button>
                    <button class="btn-3d btn-3d-blue" onclick="battleAction('freeze')">❄️ Заморозка</button>
                    <button class="btn-3d btn-3d-red" onclick="battleAction('poison')">☠️ Яд</button>
                    
                    <button class="btn-3d" onclick="battleAction('heal')">💚 Лечение</button>
                    <button class="btn-3d btn-3d-blue" onclick="battleAction('shield')">🛡️ Щит</button>
                    <button class="btn-3d btn-3d-yellow" onclick="battleAction('rage')">🔥 Ярость</button>
                    <button class="btn-3d" onclick="battleAction('flee')">🏃 Бегство</button>
                </div>
            </div>`;
            showCustomModal(html);
        };

        // ==========================================
        // ЛОГИКА 7 СПОСОБНОСТЕЙ
        // ==========================================
        window.battleAction = function(action) {
            let f = window.currentFight;
            let pDmg = state.arena.dmg;
            let logMsg = "";
            let pAvatar = document.getElementById('playerAvatar');
            let eAvatar = document.getElementById('enemyAvatar');
            
            // Базовые проверки
            if (action !== 'attack' && action !== 'flee' && state.arena.mana < 10) {
                return showToast('❌ Не хватает маны!');
            }

            // Анимация тряски
            const shakeEnemy = () => { if(eAvatar) { eAvatar.style.animation = 'none'; setTimeout(() => eAvatar.style.animation = 'shake3D 0.4s', 10); } };
            const shakePlayer = () => { if(pAvatar) { pAvatar.style.animation = 'none'; setTimeout(() => pAvatar.style.animation = 'shake3D 0.4s', 10); } };
            const flashHeal = () => { if(pAvatar) { pAvatar.style.animation = 'none'; setTimeout(() => pAvatar.style.animation = 'flashGreen 0.5s', 10); } };

            // Логика кнопок
            if (action === 'attack') {
                let dmg = pDmg + Math.floor(Math.random() * 10);
                f.enemyHp -= dmg;
                logMsg += `⚔️ Удар на ${dmg}!<br>`;
                shakeEnemy();
            } 
            else if (action === 'crit') {
                state.arena.mana -= 10;
                if (Math.random() < 0.3) {
                    let dmg = pDmg * 3;
                    f.enemyHp -= dmg;
                    logMsg += `💥 КРИТ! ${dmg} урона!<br>`;
                    shakeEnemy();
                } else { logMsg += `❌ Крит промахнулся...<br>`; }
            }
            else if (action === 'freeze') {
                state.arena.mana -= 20;
                f.enemyFrozen = true; // Пропуск хода
                logMsg += `❄️ Враг заморожен! Он пропустит ход.<br>`;
            }
            else if (action === 'poison') {
                state.arena.mana -= 15;
                f.enemyPoison = 3; // 3 хода будет получать урон
                logMsg += `☠️ Враг отравлен!<br>`;
            }
            else if (action === 'heal') {
                state.arena.mana -= 15;
                let heal = Math.floor(state.arena.maxHp * 0.3);
                f.playerHp = Math.min(state.arena.maxHp, f.playerHp + heal);
                logMsg += `💚 Вылечено ${heal} HP.<br>`;
                flashHeal();
            }
            else if (action === 'shield') {
                state.arena.mana -= 10;
                f.playerShield = true; // Блокирует следующий удар
                logMsg += `🛡️ Щит активирован! Следующий удар будет заблокирован.<br>`;
            }
            else if (action === 'rage') {
                state.arena.mana -= 25;
                f.playerDmgBuff = 2; // 2 хода х2 урона
                logMsg += `🔥 Ярость! Следующие 2 атаки нанесут двойной урон.<br>`;
            }
            else if (action === 'flee') {
                logMsg += `🏃 Ты сбежал с поля боя...<br>`;
                setTimeout(() => { openArenaMenu(); }, 1000);
                return;
            }

            // Ход врага
            if (f.enemyHp > 0 && action !== 'flee') {
                // Проверка яда
                if (f.enemyPoison > 0) {
                    f.enemyHp -= 20;
                    f.enemyPoison--;
                    logMsg += `☠️ Яд нанес 20 урона.<br>`;
                }

                if (f.enemyFrozen) {
                    f.enemyFrozen = false;
                    logMsg += `❄️ Враг пропустил ход из-за заморозки!<br>`;
                } else if (f.enemyHp > 0) {
                    // Враг атакует
                    let eDmg = f.enemyDmg + Math.floor(Math.random() * 5);
                    
                    if (f.playerShield) {
                        f.playerShield = false;
                        logMsg += `🛡️ Щит заблокировал удар!<br>`;
                    } else {
                        f.playerHp -= eDmg;
                        logMsg += `🩸 Враг ударил на ${eDmg}.<br>`;
                        shakePlayer();
                    }
                }
            }

            // Восстановление маны
            state.arena.mana = Math.min(state.arena.maxMana, state.arena.mana + 5);

            setTimeout(() => { renderBattleScreen(logMsg); }, 400);
        };

        // Перезаписываем начало боя, чтобы добавить ману
        const oldStartBattle = window.startBattle;
        window.startBattle = function() {
            if (state.arena.energy < 1) return showToast('❌ Нет энергии!');
            state.arena.energy--;
            state.arena.mana = state.arena.maxMana;

            let enemyHp = 100 + (state.arena.rating * 3);
            let enemyDmg = 10 + Math.floor(state.arena.rating / 5);
            
            window.currentFight = { enemyHp, maxEnemyHp: enemyHp, enemyDmg, playerHp: state.arena.maxHp };
            renderBattleScreen("⚔️ Бой начался! Используй ману для скиллов.");
        };

        console.log("✅ 3D-анимации и 7 кнопок в Арене загружены!");
    }, 1500);
});
</script>

<script>

window.addEventListener('load', () => {

        state.arena.enemyPos = { x: 4, y: 0 }; // Враг в правом верхнем углу

            ['empty', 'wall', 'empty', 'empty', 'empty'],
            ['empty', 'empty', 'heal', 'empty', 'empty'],

            ['empty', 'empty', 'empty', 'wall', 'empty'],
            ['empty', 'empty', 'empty', 'empty', 'empty']
        ];

        // CSS для арены
        let style = document.createElement('style');

                display: grid;

            let html = `<div class="arena-grid">`;

                for (let x = 0; x < 5; x++) {
                    let cellType = state.arena.map[y][x];
                    let isPlayer = (state.arena.pos.x === x && state.arena.pos.y === y);
                    let isEnemy = (state.arena.enemyPos.x === x && state.arena.enemyPos.y === y);
                    
                    let classes = 'arena-cell';
                    if (cellType === 'wall') classes += ' wall';
                    if (cellType === 'heal') classes += ' heal';
                    if (isPlayer) classes += ' player';
                    if (isEnemy) classes += ' enemy';

                    let content = '';
                    if (isPlayer) content = '<span class="char">🛡️</span>';
                    else if (isEnemy) content = '<span class="char">👹</span>';

                    html += `<div class="${classes}" onclick="movePlayer(${x}, ${y})">${content}</div>`;
                }
            }
            html += `</div>`;
            return html;
        };

        // Перемещение игрока
        window.movePlayer = function(x, y) {
            // Проверка на стену
            if (state.arena.map[y][x] === 'wall') return showToast('❌ Там стена!');
            
            // Проверка на расстояние (можно ходить только на 1 клетку)
            let dist = Math.abs(state.arena.pos.x - x) + Math.abs(state.arena.pos.y - y);
            if (dist > 1) return showToast('❌ Слишком далеко! (Ход на 1 клетку)');

            // Двигаем
            state.arena.pos = { x, y };
            
            // Собираем аптечку
            if (state.arena.map[y][x] === 'heal') {
                state.arena.map[y][x] = 'empty';
                state.arena.hp = Math.min(state.arena.maxHp, (state.arena.hp || state.arena.maxHp) + 30);
                showToast('💚 Подобрана аптечка! +30 HP');
            }

            // Ход врага (рандомное движение)
            setTimeout(() => {
                let eX = state.arena.enemyPos.x;
                let eY = state.arena.enemyPos.y;
                let moves = [[0,1], [0,-1], [1,0], [-1,0]];
                let validMoves = moves.filter(m => {
                    let nX = eX + m[0], nY = eY + m[1];
                    return nX >= 0 && nX < 5 && nY >= 0 && nY < 5 && state.arena.map[nY][nX] !== 'wall';
                });
                if (validMoves.length > 0) {
                    let randMove = validMoves[Math.floor(Math.random() * validMoves.length)];
                    state.arena.enemyPos = { x: eX + randMove[0], y: eY + randMove[1] };
                }
                openArenaMenu(); // Перерисовка
            }, 300);

            openArenaMenu(); // Перерисовка сразу после хода игрока
        };

        // Обновляем главное меню Арены
        window._obsolete_openArenaMenu_7 = function() {
            let html = `<h3 style="text-align:center; color:#f00; text-shadow:0 0 10px #f00;">🥊 Арена</h3>
            
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:12px;">
                <span style="color:#0f0;">❤️ HP: ${state.arena.hp || state.arena.maxHp} / ${state.arena.maxHp}</span>
                <span style="color:#ff0;">⚡ Энергия: ${state.arena.energy}/10</span>
            </div>

            ${renderArenaGrid()}

            <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:5px; margin-bottom:10px;">
                <div></div>
                <button class="move-btn" onclick="movePlayer(${state.arena.pos.x}, ${state.arena.pos.y - 1})">⬆️</button>
                <div></div>
                <button class="move-btn" onclick="movePlayer(${state.arena.pos.x - 1}, ${state.arena.pos.y})">⬅️</button>
                <button class="move-btn" onclick="movePlayer(${state.arena.pos.x}, ${state.arena.pos.y + 1})">⬇️</button>
                <button class="move-btn" onclick="movePlayer(${state.arena.pos.x + 1}, ${state.arena.pos.y})">➡️</button>
            </div>

            <button class="btn-premium btn-danger" onclick="startBattle()" style="width:100%; padding:15px; font-size:16px;" ${state.arena.energy < 1 ? 'disabled style="opacity:0.5;"' : ''}>⚔️ Атаковать (1 Энергия)</button>
            <button class="btn-premium" onclick="closeCustomModal()" style="width:100%; margin-top:10px;">Закрыть</button>`;
            showCustomModal(html);

});

<script>
// ==========================================
// СИСТЕМА ВОССТАНОВЛЕНИЯ ЭНЕРГИИ (ОНЛАЙН И ОФЛАЙН)
// ==========================================
window.addEventListener('load', () => {
    setTimeout(() => {
        if (typeof state === 'undefined' || !state.arena) return;

        // Инициализируем время последнего обновления энергии, если его нет
        if (!state.arena.lastEnergyUpdate) {
            state.arena.lastEnergyUpdate = Date.now();
        }

        // Функция проверки и восстановления энергии
        window.regenArenaEnergy = function() {
            let arena = state.arena;
            let now = Date.now();
            let timePassed = now - arena.lastEnergyUpdate;
            
            // 30 секунд = 30000 мс на 1 единицу энергии
            let energyToAdd = Math.floor(timePassed / 30000);
            
            if (energyToAdd > 0 && arena.energy < 10) {
                arena.energy = Math.min(10, arena.energy + energyToAdd);
                // Сдвигаем время последнего обновления, чтобы не начислить лишнего
                arena.lastEnergyUpdate = now - (timePassed % 30000);
                
                if (typeof save === 'function') save();
                if (typeof updateUI === 'function') updateUI();
            }
        };

        // Проверяем энергию при загрузке игры (офлайн-восстановление)
        regenArenaEnergy();

        // И запускаем таймер, чтобы она капала, пока игра открыта
        setInterval(() => {
            regenArenaEnergy();
        }, 5000); // Проверяем каждые 5 секунд

        // Перезаписываем открытие меню Арены, чтобы добавить таймер
        const oldOpenArenaMenu = window.openArenaMenu;
        window.openArenaMenu = function() {
            // Вызываем восстановление перед показом меню
            regenArenaEnergy();
            
            if (typeof oldOpenArenaMenu === 'function') {
                // Подменяем HTML, чтобы добавить таймер
                let originalShowModal = window.showCustomModal;
                window.showCustomModal = function(html) {
                    let timeLeft = 30;
                    if (state.arena.energy < 10) {
                        let timePassed = Date.now() - state.arena.lastEnergyUpdate;
                        timeLeft = Math.ceil((30000 - (timePassed % 30000)) / 1000);
                    }
                    
                    let energyDisplay = state.arena.energy >= 10 
                        ? `<span style="color:#0ff;">MAX</span>` 
                        : `<span style="color:#0ff;">${state.arena.energy}/10</span> <span style="color:#aaa; font-size:10px;">(+1 через ${timeLeft} сек)</span>`;

                    html = html.replace(
                        `<p style="color:#0ff; font-size:12px;">⚡ Энергия: ${state.arena.energy}/10</p>`, 
                        `<p style="color:#0ff; font-size:12px;">⚡ Энергия: ${energyDisplay}</p>`
                    );
                    originalShowModal(html);
                };
                oldOpenArenaMenu();
                window.showCustomModal = originalShowModal; // Возвращаем как было
            }
        };

        console.log("✅ Система энергии обновлена (офлайн-восстановление)!");
    }, 1500);
});
</script>

                    return nX >= 0 && nX < 5 && nY >= 0 && nY < 5 && state.arena.map[nY][nX] !== 'wall';

<script>
// ==========================================
// ХОД ВРАГА ПОСЛЕ ЛЮБОГО ДЕЙСТВИЯ ИГРОКА
// ==========================================
window.addEventListener('load', () => {
    setTimeout(() => {
        if (typeof state === 'undefined' || !state.arena) return;

        // 1. Функция хода врага (вынесена отдельно)
        window.enemyTurn = function() {
            // Проверка, жив ли враг
            if (state.arena.enemyHp <= 0) return;

            let eX = state.arena.enemyPos.x;
            let eY = state.arena.enemyPos.y;

            // Проверяем, стоит ли враг рядом с игроком
            let distX = Math.abs(state.arena.pos.x - eX);
            let distY = Math.abs(state.arena.pos.y - eY);
            let isNear = (distX <= 1 && distY <= 1 && (distX + distY > 0));

            if (isNear) {
                // ВРАГ АТАКУЕТ
                let eDmg = 15 + Math.floor(Math.random() * 5);
                state.arena.hp -= eDmg;
                
                // Визуал
                let pCell = document.querySelector('.arena-cell.player');
                if (pCell) {
                    pCell.style.animation = 'none';
                    setTimeout(() => { pCell.style.animation = 'shake3D 0.4s'; }, 10);
                }
                if (typeof showDamageText === 'function') showDamageText('.arena-cell.player', '-' + eDmg, '#0ff');
                
                showToast(`🩸 Враг ударил на ${eDmg}!`);

                if (state.arena.hp <= 0) {
                    showToast('💀 Ты погиб...');
                    state.arena.playerDmgBuff = false;
                    setTimeout(() => { openArenaMenu(); }, 1500);
                } else {
                    renderBattleGrid();
                }
            } else {
                // ВРАГ ДВИГАЕТСЯ (если не рядом)
                let moves = [[0,1], [0,-1], [1,0], [-1,0]];
                // Сортируем ходы по близости к игроку (чтобы он шел к нам)
                moves.sort((a, b) => {
                    let distA = Math.abs((eX + a[0]) - state.arena.pos.x) + Math.abs((eY + a[1]) - state.arena.pos.y);
                    let distB = Math.abs((eX + b[0]) - state.arena.pos.x) + Math.abs((eY + b[1]) - state.arena.pos.y);
                    return distA - distB;
                });

                let validMoves = moves.filter(m => {
                    let nX = eX + m[0], nY = eY + m[1];
                    return nX >= 0 && nX < 5 && nY >= 0 && nY < 5 && state.arena.map[nY][nX] !== 'wall';
                });

                if (validMoves.length > 0) {
                    let bestMove = validMoves[0]; // Берем ход, который ближе к игроку
                    state.arena.enemyPos = { x: eX + bestMove[0], y: eY + bestMove[1] };
                }
                renderBattleGrid();
            }
            if (typeof save === 'function') save();
        };

        // 2. Перезаписываем движение (враг ходит после шага)
        window.movePlayer = function(x, y) {
            if (x < 0 || x > 4 || y < 0 || y > 4) return showToast('❌ Там край карты!');
            if (state.arena.map[y][x] === 'wall') return showToast('❌ Там стена!');
            
            let dist = Math.abs(state.arena.pos.x - x) + Math.abs(state.arena.pos.y - y);
            if (dist > 1) return showToast('❌ Слишком далеко!');

            state.arena.pos = { x, y };
            
            if (state.arena.map[y][x] === 'heal') {
                state.arena.map[y][x] = 'empty';
                state.arena.hp = Math.min(state.arena.maxHp, (state.arena.hp || state.arena.maxHp) + 30);
                showToast('💚 Подобрана аптечка! +30 HP');
            }

            renderBattleGrid();
            // Враг ходит после нашей задержки
            setTimeout(enemyTurn, 400); 
        };

        // 3. Перезаписываем атаку (враг отвечает)
        window.attackEnemy = function() {
            let p = state.arena.pos;
            let e = state.arena.enemyPos;
            let distX = Math.abs(p.x - e.x);
            let distY = Math.abs(p.y - e.y);
            
            if (distX > 1 || distY > 1 || (distX === 0 && distY === 0)) {
                return showToast('❌ Подойди ближе к врагу!');
            }

            let pDmg = state.arena.dmg + Math.floor(Math.random() * 10);
            if (state.arena.playerDmgBuff) pDmg = Math.floor(pDmg * 1.5);

            state.arena.enemyHp -= pDmg;
            
            let eCell = document.querySelector('.arena-cell.enemy');
            if (eCell) {
                eCell.style.animation = 'none';
                setTimeout(() => { eCell.style.animation = 'shake3D 0.4s'; }, 10);
            }
            if (typeof showDamageText === 'function') showDamageText('.arena-cell.enemy', '-' + pDmg, '#f00');

            if (state.arena.enemyHp <= 0) {
                let coinsReward = 15 + Math.floor(Math.random() * 10);
                state.arena.coins += coinsReward;
                state.arena.rating += 5;
                showToast(`🏆 ПОБЕДА! +${coinsReward} 🪙`);
                playSound(1000, 0.2);
                state.arena.playerDmgBuff = false;
                setTimeout(() => { openArenaMenu(); }, 1000);
                if (typeof save === 'function') save();
                return;
            }

            renderBattleGrid();
            setTimeout(enemyTurn, 400); // Враг ходит после нашей атаки
        };

        // 4. Перезаписываем использование зелий (враг ходит после зелья)
        window.useArenaItem = function(type) {
            if (state.arena.inventory[type] <= 0) return showToast('❌ Нет предметов!');
            state.arena.inventory[type]--;
            
            if (type === 'heal') {
                state.arena.hp = Math.min(state.arena.maxHp, state.arena.hp + 50);
                showToast('💚 +50 HP');
            } else if (type === 'shield') {
                state.arena.playerShield = true;
                showToast('🛡️ Щит активирован!');
            } else if (type === 'dmg') {
                state.arena.playerDmgBuff = true;
                showToast('⚔️ Урон увеличен на 50%!');
            }
            
            renderBattleGrid();
            setTimeout(enemyTurn, 400); // Враг ходит после зелья
        };

        console.log("✅ Бот теперь бьет в ответ на любые действия!");
    }, 1500);
});
</script>

<script>

// ==========================================
window.addEventListener('load', () => {
    setTimeout(() => {
        if (typeof state === 'undefined') return;

        // Перезаписываем функцию получения множителей
        // Мы удаляем старую версию и пишем новую, которая разделяет бонусы
        window.getMultipliers = function() {
            // Базовые множители (1 = 100%, то есть без бонусов)
            let mClick = 1;
            let mCps = 1;

            // 1. Бонусы от престижа (если есть)
            if (state.prestige) {
                mClick += state.prestige * 0.5;
                mCps += state.prestige * 0.5;
            }

            // 2. Бонусы от Дерева Навыков (если есть)
            if (state.skills) {
                mClick *= (1 + (state.skills.click || 0) * 0.1);
                mCps *= (1 + (state.skills.cps || 0) * 0.1);
                let multBonus = 1 + (state.skills.mult || 0) * 0.05;
                mClick *= multBonus;
                mCps *= multBonus;
            }

            // 3. Бонусы от Лаборатории (если есть)
            if (state.lab && state.lab.mult > 0) {
                let labBonus = 1 + (state.lab.mult * 0.1);
                mClick *= labBonus;
                mCps *= labBonus;
            }

            // 4. ЧЕСТНЫЕ БОНУСЫ ОТ КАРТОЧЕК
            if (typeof ALL_CARDS !== 'undefined' && state.cards) {
                ALL_CARDS.forEach(card => {
                    let lvl = state.cards[card.id] || 0;
                    if (lvl > 0) {
                        // Определяем базовый бонус за 1 уровень в зависимости от редкости
                        let baseBonus = 0.01; // Обычная
                        if (card.rarity === 'uncommon') baseBonus = 0.03;
                        if (card.rarity === 'rare') baseBonus = 0.05;
                        if (card.rarity === 'epic') baseBonus = 0.10;
                        if (card.rarity === 'legendary') baseBonus = 0.25;
                        if (card.rarity === 'mythic') baseBonus = 1.00;

                        let totalBonus = baseBonus * lvl;

                        // Распределяем бонус строго по тексту описания
                        if (card.desc.includes('к клику')) {
                            mClick += totalBonus; 
                        } else if (card.desc.includes('к пассиву')) {
                            mCps += totalBonus;
                        } else if (card.desc.includes('ко всему')) {
                            mClick += totalBonus;
                            mCps += totalBonus;
                        }
                    }
                });
            }

            return { mClick, mCps };
        };

        console.log("✅ Бонусы карточек теперь разделены (клик/пассив)!");
    }, 2000); // Ждем 2 секунды, чтобы все карточки точно загрузились
});
