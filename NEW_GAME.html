                console.log(`👋 Привет, ${user.first_name}! (ID: ${user.id})`);
                
                // Если у игрока нет сохранения, создаем новое
                if (!localStorage.getItem('megaClicker_tg_' + user.id)) {
                    console.log("Создаем новое сохранение для ТГ пользователя...");
                    // Тут в будущем мы будем отправлять запрос на сервер для создания профиля
                }
            }

            // 5. Красим шапку ТГ в зеленый (под стиль матрицы)
            tg.setHeaderColor('#000000');
            tg.setBackgroundColor('#000000');

            // 6. Добавляем кнопку "Закрыть" в интерфейс ТГ
            // (Или оставляем стандартную)
            
        } else {
            console.log("ℹ️ Игра запущена в обычном браузере (не в Telegram)");
        }
    }, 1000);
});
</script>

<script>
// ==========================================
// ЛИГА 2.0: РЕЙТИНГОВЫЕ ДИВИЗИОНЫ (БЕЗ БОТОВ)
// ==========================================
window.addEventListener('load', () => {
    setTimeout(() => {
        if (typeof state === 'undefined') return;

        // Инициализация
        if (!state.league) {
            state.league = { claimed: [] };
        }

        const divisions = [
            { name: 'Бронза', icon: '🥉', req: 1000, rewardCrystals: 50, rewardCoins: 20 },
            { name: 'Серебро', icon: '🥈', req: 100000, rewardCrystals: 100, rewardCoins: 50 },
            { name: 'Золото', icon: '🥇', req: 10000000, rewardCrystals: 250, rewardCoins: 100 },
            { name: 'Платина', icon: '💠', req: 1000000000, rewardCrystals: 500, rewardCoins: 250 },
            { name: 'Алмаз', icon: '💎', req: 100000000000, rewardCrystals: 1000, rewardCoins: 500 },
            { name: 'Легенда', icon: '👑', req: 10000000000000, rewardCrystals: 5000, rewardCoins: 2000 }
        ];

        // Определение текущего дивизиона
        function getCurrentDivision() {
            let score = (state.cookies || 0) + (state.cps || 0) * 100;
            for (let i = divisions.length - 1; i >= 0; i--) {
                if (score >= divisions[i].req) return i;
            }
            return -1; // Ниже Бронзы
        }

        // 1. МЕНЮ ЛИГИ
        window.openLeagueMenu = function() {
            let currentDiv = getCurrentDivision();
            let score = (state.cookies || 0) + (state.cps || 0) * 100;

            let html = `<h3 style="text-align:center; color:#ff0; text-shadow:0 0 10px #ff0;">🏆 Рейтинговая Лига</h3>
            <div style="text-align:center; margin-bottom:15px; background:rgba(0,0,0,0.5); padding:10px; border-radius:10px; border:1px solid #333;">
                <p style="color:#0f0; font-size:18px;">Твой доход: <b>${format(score)} 🍪</b></p>
            </div>
            
            <div style="display:flex; flex-direction:column; gap:5px;">`;

            divisions.forEach((div, index) => {
                let isUnlocked = currentDiv >= index;
                let isCurrent = currentDiv === index;
                let isClaimed = state.league.claimed.includes(index);
                
                let border = isCurrent ? '2px solid #0f0' : '1px solid #333';
                let bg = isCurrent ? 'rgba(0,255,0,0.1)' : 'rgba(0,0,0,0.5)';
                let opacity = isUnlocked ? '1' : '0.5';
                
                let btn = '';
                if (isUnlocked) {
                    if (!isClaimed) {
                        btn = `<button class="btn-3d" onclick="claimLeagueDiv(${index})" style="padding:5px 10px; border-color:#ff0 !important; color:#ff0 !important;">🎁 Забрать</button>`;
                    } else {
                        btn = `<span style="color:#0f0; font-size:12px;">✅ Получено</span>`;
                    }
                } else {
                    btn = `<span style="color:#aaa; font-size:10px;">Нужно: ${format(div.req)}</span>`;
                }

                html += `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:10px; border:${border}; border-radius:8px; background:${bg}; opacity:${opacity};">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span style="font-size:24px;">${div.icon}</span>
                        <div>
                            <b style="color:${isCurrent ? '#0f0' : '#fff'};">${div.name}</b><br>
                            <span style="font-size:10px; color:#aaa;">Награда: ${div.rewardCrystals} 💎, ${div.rewardCoins} 🪙</span>
                        </div>
                    </div>
                    <div>${btn}</div>
                </div>`;
            });

            html += `</div>
            <button class="btn-3d" onclick="closeCustomModal()" style="width:100%; margin-top:15px;">Закрыть</button>`;
            showCustomModal(html);
        };

        // 2. ПОЛУЧЕНИЕ НАГРАДЫ
        window.claimLeagueDiv = function(index) {
            let currentDiv = getCurrentDivision();
            if (currentDiv < index) return showToast('❌ Ты еще не достиг этого дивизиона!');
            if (state.league.claimed.includes(index)) return showToast('❌ Награда уже получена!');

            state.league.claimed.push(index);
            let div = divisions[index];
            
            state.crystals += div.rewardCrystals;
            if (!state.arena.coins) state.arena.coins = 0;
            state.arena.coins += div.rewardCoins;

            showToast(`🎁 Получено: ${div.rewardCrystals} 💎 и ${div.rewardCoins} 🪙 за ${div.name}!`);
            playSound(1000, 0.3);
            
            openLeagueMenu(); // Перерисовка
            if (typeof updateUI === 'function') updateUI();
            if (typeof save === 'function') save();
        };

        console.log("✅ Лига 2.0 (Рейтинговые дивизионы) загружена!");
    }, 1500);
});
</script>

<script>
// ==========================================
// КОЛЕСО ФОРТУНЫ 2.0 (РЕАЛИСТИЧНОЕ)
// ==========================================
window.addEventListener('load', () => {
    setTimeout(() => {
        if (typeof state === 'undefined') return;

        if (!state.wheel) state.wheel = { lastSpin: 0 };

        // Сектора (8 штук)
        const sectors = [
            { name: '100 🍪', type: 'cookies', val: 100, color: '#1a5c1a' }, // Темно-зеленый
            { name: '1.000 🍪', type: 'cookies', val: 1000, color: '#0f0' },  // Зеленый
            { name: '10 💎', type: 'crystals', val: 10, color: '#008b8b' },   // Темно-бирюзовый
            { name: 'ДЖЕКПОТ', type: 'cookies', val: 10000, color: '#ffd700' },// Золотой
            { name: '50 🪙', type: 'coins', val: 50, color: '#8b0000' },      // Темно-красный
            { name: '500 🍪', type: 'cookies', val: 500, color: '#2e8b57' },  // Морской
            { name: '5 💎', type: 'crystals', val: 5, color: '#0ff' },        // Бирюзовый
            { name: 'Провал', type: 'none', val: 0, color: '#111' }           // Черный
        ];

        // 1. МЕНЮ КОЛЕСА
        window.openWheelMenu = function() {
            let now = Date.now();
            let timePassed = now - state.wheel.lastSpin;
            let cooldown = 3 * 60 * 60 * 1000; // 3 часа
            let timeLeft = cooldown - timePassed;
            
            let canSpin = timeLeft <= 0;
            let timerText = "Доступно!";
            if (!canSpin) {
                let h = Math.floor(timeLeft / (1000 * 60 * 60));
                let m = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                timerText = `${h}ч ${m}м`;
            }

            // Генерируем SVG для колеса
            let svg = `<svg viewBox="0 0 200 200" style="width:100%; height:100%; transform: rotate(0deg); transition: transform 4s cubic-bezier(0.15, 0.9, 0.15, 1);" id="wheelSvg">`;
            
            let angleStep = 360 / sectors.length;
            sectors.forEach((sec, i) => {
                let startAngle = i * angleStep;
                let endAngle = startAngle + angleStep;
                
                // Формулы для расчета координат сектора
                let x1 = 100 + 100 * Math.cos((startAngle - 90) * Math.PI / 180);
                let y1 = 100 + 100 * Math.sin((startAngle - 90) * Math.PI / 180);
                let x2 = 100 + 100 * Math.cos((endAngle - 90) * Math.PI / 180);
                let y2 = 100 + 100 * Math.sin((endAngle - 90) * Math.PI / 180);
                
                let largeArcFlag = angleStep > 180 ? 1 : 0;
                let pathData = `M 100 100 L ${x1} ${y1} A 100 100 0 ${largeArcFlag} 1 ${x2} ${y2} Z`;
                
                svg += `<path d="${pathData}" fill="${sec.color}" stroke="#000" stroke-width="1" />`;
                
                // Текст внутри сектора
                let textAngle = startAngle + angleStep / 2;
                let textX = 100 + 65 * Math.cos((textAngle - 90) * Math.PI / 180);
                let textY = 100 + 65 * Math.sin((textAngle - 90) * Math.PI / 180);
                svg += `<text x="${textX}" y="${textY}" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="middle" transform="rotate(${textAngle} ${textX} ${textY})">${sec.name}</text>`;
            });
            svg += `</svg>`;

            let html = `<h3 style="text-align:center; color:#ff0; text-shadow:0 0 10px #ff0; margin-bottom:5px;">🎰 Колесо Фортуны</h3>
            <p style="text-align:center; color:#aaa; font-size:12px; margin-bottom:20px;">Испытай удачу раз в 3 часа!</p>
            
            <div style="display:flex; justify-content:center; margin:20px 0; position:relative;">
                <!-- Стрелка сверху -->
                <div style="position:absolute; top:-15px; left:50%; transform:translateX(-50%); font-size:40px; color:#f00; z-index:10; text-shadow:0 0 10px #f00; filter: drop-shadow(0 0 5px #000);">▼</div>
                
                <!-- Контейнер колеса -->
                <div style="width:280px; height:280px; border-radius:50%; border:5px solid #333; box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 20px #000; background:#050505; padding:5px;">
                    ${svg}
                </div>
                
                <!-- Центральная кнопка -->
                <div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); width:50px; height:50px; background:#111; border:3px solid #0f0; border-radius:50%; display:flex; justify-content:center; align-items:center; color:#0f0; font-size:24px; box-shadow:0 0 15px #0f0;">
                    🎰
                </div>
            </div>

            <div style="text-align:center; margin-top:30px;">
                <p style="color:${canSpin ? '#0f0' : '#f00'}; font-size:14px; margin-bottom:10px;">${canSpin ? 'Бесплатная прокрутка доступна!' : 'Кулдаун: ' + timerText}</p>
                <button class="btn-3d btn-3d-yellow" onclick="spinWheel(0)" style="width:100%; padding:15px; font-size:18px; border-radius:10px;" ${!canSpin ? 'disabled style="opacity:0.5;"' : ''}>🎰 Крутить (Бесплатно)</button>
                <button class="btn-3d btn-3d-blue" onclick="spinWheel(50)" style="width:100%; padding:10px; margin-top:10px; border-radius:10px; font-size:14px;" ${!canSpin ? '' : 'style="display:none;"'}>💎 Крутить за 50 Кристаллов</button>
            </div>

            <button class="btn-3d" onclick="closeCustomModal()" style="width:100%; margin-top:15px;">Закрыть</button>`;
            showCustomModal(html);
        };

        // 2. ЛОГИКА ПРОКРУТКИ
        window.spinWheel = function(cost) {
            if (cost > 0) {
                if (state.crystals < cost) return showToast('❌ Не хватает кристаллов!');
                state.crystals -= cost;
            } else {
                let now = Date.now();
                if (now - state.wheel.lastSpin < 3 * 60 * 60 * 1000) {
                    return showToast('❌ Кулдаун еще не прошел!');
                }
                state.wheel.lastSpin = now;
            }

            let wheel = document.getElementById('wheelSvg');
            if (!wheel) return;

            // Выбираем победителя (с весами шансов)
            let random = Math.random() * 100;
            let winIndex = 0;
            
            // Шансы: 100(30%), 1000(20%), 10кам(15%), Джекпот(5%), 50монет(10%), 500(10%), 5кам(9%), Провал(1%)
            if (random < 30) winIndex = 0;
            else if (random < 50) winIndex = 1;
            else if (random < 65) winIndex = 2;
            else if (random < 70) winIndex = 3;
            else if (random < 80) winIndex = 4;
            else if (random < 90) winIndex = 5;
            else if (random < 99) winIndex = 6;
            else winIndex = 7;

            let winSector = sectors[winIndex];

            // Расчет угла поворота
            // Нам нужно, чтобы выигрышный сектор оказался под стрелкой (сверху, 0 градусов)
            let sectorAngle = winIndex * (360 / sectors.length);
            let baseSpins = 10 * 360; // 10 оборотов
            // Стрелка сверху, поэтому крутим на 360 - sectorAngle
            let finalRotation = baseSpins + (360 - sectorAngle);

            // Запускаем анимацию
            wheel.style.transform = `rotate(${finalRotation}deg)`;

            // Ждем окончания анимации
            setTimeout(() => {
                if (winSector.type === 'cookies') {
                    state.cookies += winSector.val;
                    state.totalBaked += winSector.val;
                } else if (winSector.type === 'crystals') {
                    state.crystals += winSector.val;
                } else if (winSector.type === 'coins') {
                    if (!state.arena.coins) state.arena.coins = 0;
                    state.arena.coins += winSector.val;
                }

                // Окно результата
                let resultHtml = `
                <div style="text-align:center; padding:20px;">
                    <div style="font-size:60px; margin-bottom:10px; animation: float3D 1s infinite;">${winSector.type === 'none' ? '😢' : '🎉'}</div>
                    <h2 style="color:${winSector.color}; text-shadow:0 0 15px ${winSector.color}; margin-bottom:10px;">${winSector.name}</h2>
                    <p style="color:#fff; font-size:18px; margin-bottom:20px;">${winSector.type === 'none' ? 'В этот раз не повезло...' : 'Ты выиграл: ' + winSector.name}</p>
                    <button class="btn-3d" onclick="openWheelMenu()" style="width:100%; padding:15px;">Забрать</button>
                </div>`;
                showCustomModal(resultHtml);

                playSound(winSector.type === 'none' ? 200 : 1000, 0.5);
                if (typeof updateUI === 'function') updateUI();
                if (typeof save === 'function') save();
                
            }, 4200);
        };

        console.log("✅ Реалистичное Колесо Фортуны загружено!");
    }, 1500);
});
</script>

<script>
// ==========================================
// PVP 2.0: ВЫБОР КЛАССА, АНИМАЦИИ, МАГАЗИН
// ==========================================
window.addEventListener('load', () => {
    setTimeout(() => {
        if (typeof state === 'undefined') return;

        if (!state.pvp) state.pvp = { wins: 0, losses: 0, medals: 0 };

        // 1. МЕНЮ PVP
        window.openPvpMenu = function() {
            let html = `<h3 style="text-align:center; color:#0ff; text-shadow:0 0 10px #0ff;">⚔️ PvP Арена</h3>
            
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <div style="flex:1; background:rgba(0,0,0,0.5); padding:10px; border:1px solid #333; border-radius:10px; text-align:center;">
                    <p style="color:#0f0; font-size:12px;">Победы</p>
                    <b style="color:#0f0; font-size:18px;">${state.pvp.wins}</b>
                </div>
                <div style="flex:1; background:rgba(0,0,0,0.5); padding:10px; border:1px solid #333; border-radius:10px; text-align:center;">
                    <p style="color:#f00; font-size:12px;">Поражения</p>
                    <b style="color:#f00; font-size:18px;">${state.pvp.losses}</b>
                </div>
                <div style="flex:1; background:rgba(0,0,0,0.5); padding:10px; border:1px solid #333; border-radius:10px; text-align:center;">
                    <p style="color:#ff0; font-size:12px;">Медали</p>
                    <b style="color:#ff0; font-size:18px;">${state.pvp.medals} 🏅</b>
                </div>
            </div>

            <div style="display:flex; flex-direction:column; gap:10px;">
                <button class="btn-3d btn-3d-red" onclick="openPvpClassSelect()" style="padding:15px; font-size:16px;">⚔️ Найти противника</button>
                <button class="btn-3d btn-3d-yellow" onclick="openPvpShop()" style="padding:15px; font-size:16px;">🛒 Магазин Медалей</button>
            </div>
            <button class="btn-3d" onclick="closeCustomModal()" style="width:100%; margin-top:15px;">Закрыть</button>`;
            showCustomModal(html);
        };

        // 2. ВЫБОР КЛАССА
        window.openPvpClassSelect = function() {
            let html = `<h3 style="text-align:center; color:#f00;">Выбери класс</h3>
            <div style="display:flex; flex-direction:column; gap:10px; margin-top:15px;">
                <button class="btn-3d" onclick="startPvpBattle('tank')" style="padding:15px; border-color:#0f0 !important; color:#0f0 !important;">🛡️ Танк (Много HP, мало урона)</button>
                <button class="btn-3d" onclick="startPvpBattle('assassin')" style="padding:15px; border-color:#ff0 !important; color:#ff0 !important;">🗡️ Убийца (Мало HP, много урона)</button>
                <button class="btn-3d" onclick="startPvpBattle('mage')" style="padding:15px; border-color:#0ff !important; color:#0ff !important;">🔮 Маг (Баланс, шанс крита)</button>
            </div>
            <button class="btn-3d" onclick="openPvpMenu()" style="width:100%; margin-top:15px;">Назад</button>`;
            showCustomModal(html);
        };

        // 3. НАЧАЛО БОЯ
        window.startPvpBattle = function(playerClass) {
            let myPower = (state.cpc || 1) + (state.cps || 0) + (state.arena?.rating || 0) * 10;
            if (myPower < 100) myPower = 100;

            let enemyPower = Math.floor(myPower * (0.8 + Math.random() * 0.4));

            // Статы в зависимости от класса
            let pMaxHp = 100, pDmg = 10, pCrit = 0.1;
            if (playerClass === 'tank') { pMaxHp = 200; pDmg = 8; pCrit = 0.05; }
            if (playerClass === 'assassin') { pMaxHp = 80; pDmg = 20; pCrit = 0.25; }
            if (playerClass === 'mage') { pMaxHp = 120; pDmg = 15; pCrit = 0.15; }

            window.currentPvp = {
                playerClass: playerClass,
                playerHp: pMaxHp, playerMaxHp: pMaxHp,
                enemyHp: 100, enemyMaxHp: 100,
                playerDmg: pDmg + Math.floor(myPower / 10),
                enemyDmg: Math.floor(enemyPower / 10) + 5,
                playerCrit: pCrit,
                log: "⚔️ Бой начался! Выбери действие."
            };

            renderPvpScreen();
        };

        // 4. ЭКРАН БОЯ
        window.renderPvpScreen = function() {
            let pvp = window.currentPvp;
            if (!pvp) return;

            if (pvp.playerHp <= 0) return endPvpBattle(false);
            if (pvp.enemyHp <= 0) return endPvpBattle(true);

            let pPercent = Math.max(0, (pvp.playerHp / pvp.playerMaxHp) * 100);
            let ePercent = Math.max(0, (pvp.enemyHp / pvp.enemyMaxHp) * 100);

            let pAvatar = pvp.playerClass === 'tank' ? '🛡️' : (pvp.playerClass === 'assassin' ? '🗡️' : '🔮');

            let html = `<div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:20px;">
                <div style="text-align:center; width:40%;">
                    <div style="font-size:40px; margin-bottom:5px;" id="pvpPlayerAvatar">${pAvatar}</div>
                    <div style="font-size:12px; color:#0f0;">Ты (${Math.max(0,pvp.playerHp)} HP)</div>
                    <div class="hp-bar-container" style="height:15px; margin-top:5px;">
                        <div class="hp-bar-fill" style="width:${pPercent}%; background:#0f0; box-shadow:0 0 10px #0f0;"></div>
                    </div>
                </div>
                <div style="font-size:24px; color:#f00; font-weight:bold; text-shadow:0 0 10px #f00; animation: float3D 1s infinite;">VS</div>
                <div style="text-align:center; width:40%;">
                    <div style="font-size:40px; margin-bottom:5px;" id="pvpEnemyAvatar">👤</div>
                    <div style="font-size:12px; color:#f00;">Тень (${Math.max(0,pvp.enemyHp)} HP)</div>
                    <div class="hp-bar-container" style="height:15px; margin-top:5px;">
                        <div class="hp-bar-fill" style="width:${ePercent}%; background:#f00; box-shadow:0 0 10px #f00;"></div>
                    </div>
                </div>
            </div>

            <div style="background:#000; padding:10px; height:80px; overflow-y:auto; border:1px solid #333; font-size:12px; margin-bottom:15px; color:#aaa; border-radius:8px; font-family:monospace;">
                ${pvp.log}
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px;">
                <button class="btn-3d btn-3d-red" onclick="pvpAction('attack')" style="padding:15px; font-size:14px;">⚔️ Атака</button>
                <button class="btn-3d btn-3d-blue" onclick="pvpAction('defend')" style="padding:15px; font-size:14px;">🛡️ Защита</button>
                <button class="btn-3d btn-3d-yellow" onclick="pvpAction('special')" style="padding:15px; font-size:14px;">💥 Спец</button>
            </div>`;
            showCustomModal(html);
        };

        // 5. ЛОГИКА ХОДОВ
        window.pvpAction = function(action) {
            let pvp = window.currentPvp;
            let log = "";

            let pAvatar = document.getElementById('pvpPlayerAvatar');
            let eAvatar = document.getElementById('pvpEnemyAvatar');

            if (action === 'attack') {
                let dmg = pvp.playerDmg + Math.floor(Math.random() * 10);
                let isCrit = Math.random() < pvp.playerCrit;
                if (isCrit) dmg = Math.floor(dmg * 2);
                
                pvp.enemyHp -= dmg;
                log = `⚔️ Ты нанес ${dmg} урона ${isCrit ? '(КРИТ!)' : ''}.<br>`;
                
                if(eAvatar) { eAvatar.style.animation = 'none'; setTimeout(() => eAvatar.style.animation = 'shake3D 0.4s', 10); }
            } else if (action === 'defend') {
                pvp.playerShield = true;
                log = `🛡️ Ты встал в защиту.<br>`;
                if(pAvatar) { pAvatar.style.animation = 'none'; setTimeout(() => pAvatar.style.animation = 'flashGreen 0.5s', 10); }
            } else if (action === 'special') {
                if (Math.random() < 0.6) { // 60% шанс успеха
                    let dmg = pvp.playerDmg * 2;
                    pvp.enemyHp -= dmg;
                    log = `💥 Спецприем! ${dmg} урона!<br>`;
                    if(eAvatar) { eAvatar.style.animation = 'none'; setTimeout(() => eAvatar.style.animation = 'shake3D 0.5s', 10); }

// ОБНОВЛЕНИЕ: КВЕСТЫ 2.0 (ЕЖЕДНЕВНЫЕ + МАГАЗИН)

        if (!state.quests) {

        const questPool = [
            { id: 'clicks', text: 'Сделай 500 кликов', target: 500, reward: 10, type: 'click' },
            { id: 'cookies', text: 'Накопи 10.000 печенек', target: 10000, reward: 15, type: 'cookie' },
            { id: 'arena', text: 'Победи в Арене 3 раза', target: 3, reward: 20, type: 'arena' },
            { id: 'factory', text: 'Купи 5 заводов', target: 5, reward: 15, type: 'factory' },
            { id: 'boss', text: 'Убей босса', target: 1, reward: 30, type: 'boss' }
        ];

        // 1. ГЕНЕРАЦИЯ КВЕСТОВ
        window.generateDailyQuests = function(force = false) {
            let now = Date.now();
            let oneDay = 24 * 60 * 60 * 1000;
            
            if (force || now - state.quests.lastReset > oneDay || state.quests.daily.length === 0) {
                state.quests.lastReset = now;
                state.quests.daily = [];
                
                let shuffled = [...questPool].sort(() => 0.5 - Math.random());
                let selected = shuffled.slice(0, 3);
                
                selected.forEach(q => {
                    state.quests.daily.push({
                        id: q.id, text: q.text, target: q.target, reward: q.reward, progress: 0, claimed: false
                    });
                });
                if (typeof save === 'function') save();
            }
        };

        // 2. МЕНЮ КВЕСТОВ
        window._obsolete_openQuestMenu_2 = function() {
            generateDailyQuests();

            let html = `<h3 style="text-align:center; color:#0f0; text-shadow:0 0 10px #0f0;">📜 Квесты</h3>
            <div style="text-align:center; margin-bottom:15px;">
                <p style="color:#ff0; font-size:18px;">Квестовые монеты: <b>${state.quests.coins} 📜</b></p>
            </div>
            
            <div style="display:flex; flex-direction:column; gap:10px;">`;

            state.quests.daily.forEach(q => {

                </div>
            </div>
            
            <button class="btn-3d" onclick="openQuestMenu()" style="width:100%; margin-top:15px;">Назад</button>`;
            showCustomModal(html);
        };

        // 4. ЛОГИКА
        window.claimQuest = function(id) {
            let q = state.quests.daily.find(x => x.id === id);
            if (!q || q.claimed || q.progress < q.target) return;
            
            q.claimed = true;
            state.quests.coins += q.reward;
            showToast(`🎁 Получено ${q.reward} 📜!`);
            playSound(800, 0.2);
            openQuestMenu();
            if (typeof save === 'function') save();
        };

            if (type === 'click') {

                state.quests.buffs.clickMult = 2;
                state.quests.buffs.expire = Date.now() + 10 * 60 * 1000; 
                showToast('⚡ Бафф клика активирован на 10 минут!');

                if (state.quests.coins < 100) return showToast('❌ Мало монет!');
                state.quests.coins -= 100;
                state.crystals += 500;
                showToast('💎 Получено 500 Кристаллов!');
            }
            playSound(1000, 0.2);
            openQuestShop();
            if (typeof save === 'function') save();
        };

        // 5. ОТСЛЕЖИВАНИЕ
        const oldForceClick = window.forceClick;
        window.forceClick = function(e) {
            if (typeof oldForceClick === 'function') oldForceClick(e);
            
            if (state.quests && state.quests.daily) {
                state.quests.daily.forEach(q => {
                    if (q.id === 'clicks' && q.progress < q.target) q.progress++;
                    if (q.id === 'cookies' && state.totalBaked >= q.target && q.progress < q.target) q.progress = q.target;
                });
            }

            if (state.quests && state.quests.buffs && state.quests.buffs.expire > Date.now()) {
                state.cookies += 1; 
            }
        };

        const oldEndBattle = window.endBattle;
        window.endBattle = function(win) {
            if (typeof oldEndBattle === 'function') oldEndBattle(win);
            if (win && state.quests && state.quests.daily) {
                state.quests.daily.forEach(q => {
                    if (q.id === 'arena' && q.progress < q.target) q.progress++;
                });
            }
        };

        const oldBuyFactory = window.upgradeFactory;
        window.upgradeFactory = function(id, cost) {
            if (typeof oldBuyFactory === 'function') oldBuyFactory(id, cost);
            if (state.quests && state.quests.daily) {
                state.quests.daily.forEach(q => {
                    if (q.id === 'factory' && q.progress < q.target) q.progress++;
                });
            }
        };

        console.log("✅ Квесты 2.0 загружены!");
    }, 1500);
});
</script>

            let amt = parseInt(document.getElementById('dep' + slot).value);

            if (state.cookies < amt) return showToast('❌ Мало печенек!');
            
            window.bankWithdrawAll(true); 
            state.cookies -= amt;
            if (slot === 1) state.bank.v1 += amt;
            if (slot === 2) state.bank.v2 += amt;
            if (slot === 3) state.bank.v3 += amt;
            state.bank.lastUpdate = Date.now();
            
            showToast('🏦 Вложено!');
            openBankMenu();
            if (typeof updateUI === 'function') updateUI();
            if (typeof save === 'function') save();
        };

            if (state.crystals < 50) return showToast('❌ Нужно 50 💎!');
            state.crystals -= 50;
            state.bank.lvl++;
            showToast('🏦 Банк улучшен!');
            openBankMenu();
            if (typeof save === 'function') save();
        };

        window.bankWithdrawAll = function(silent = false) {
            let bank = state.bank;
            let timePassed = (Date.now() - bank.lastUpdate) / 1000 / 3600;
            let lvlBonus = 1 + (bank.lvl * 0.1);
            
            let total = (bank.v1 + Math.floor(bank.v1 * 0.05 * timePassed * lvlBonus)) + 
                        (bank.v2 + Math.floor(bank.v2 * 0.10 * timePassed * lvlBonus)) + 
                        (bank.v3 + Math.floor(bank.v3 * 0.15 * timePassed * lvlBonus));
            
            if (total <= 0) return;
            
            state.cookies += total;
            state.bank.v1 = 0; state.bank.v2 = 0; state.bank.v3 = 0;
            state.bank.lastUpdate = Date.now();
            
            if (!silent) {
                showToast(`🏦 Собрано ${format(total)} 🍪`);
                openBankMenu();
                if (typeof updateUI === 'function') updateUI();
            }
            if (typeof save === 'function') save();
        };

        // 3. ЛОГИКА КРЕДИТОВ

            if (state.bank.loan > 0) return showToast('❌ У тебя уже есть кредит!');
            let amount = 10000; // Можно сделать выбор суммы
            state.cookies += amount;
            state.bank.loan = amount * 1.5; // Вернуть нужно в 1.5 раза больше
            state.bank.loanTime = Date.now() + 5 * 60 * 1000; // 5 минут на возврат
            
            showToast(`🏦 Взят кредит: ${format(amount)} 🍪. Верни ${format(state.bank.loan)} за 5 минут!`);
            openBankMenu();
            if (typeof updateUI === 'function') updateUI();
            if (typeof save === 'function') save();
        };

        window.repayLoan = function() {
            if (state.bank.loan <= 0) return showToast('❌ У тебя нет кредита!');
            if (state.cookies < state.bank.loan) return showToast('❌ Не хватает печенек для возврата!');
            
            state.cookies -= state.bank.loan;
            showToast(`🏦 Кредит погашен!`);
            state.bank.loan = 0;
            state.bank.loanTime = 0;
            
            openBankMenu();
            if (typeof updateUI === 'function') updateUI();
            if (typeof save === 'function') save();
        };

        // 4. ШТРАФ ЗА ПРОСРОЧКУ
        setInterval(() => {
            if (state.bank && state.bank.loan > 0 && Date.now() > state.bank.loanTime) {
                // Забираем 50% печенек каждую секунду
                let penalty = Math.floor(state.cookies * 0.5);
                state.cookies -= penalty;
                if (typeof updateUI === 'function') updateUI();
            }
        }, 1000);

        console.log("✅ Банк 2.0 с кредитами загружен!");
    }, 1500);
});
</script>

<script>
// ==========================================
// РЫНОК PRO: СВЕЧНЫЕ ГРАФИКИ, ВКЛАДКИ, ТЕРМИНАЛ
// ==========================================
window.addEventListener('load', () => {
    setTimeout(() => {
        if (typeof state === 'undefined') return;

        if (!state.market) {
            state.market = {
                prices: { coal: 50, copper: 250, iron: 1000, gold: 5000, diamond: 25000 },
                history: { coal: [], copper: [], iron: [], gold: [], diamond: [] },
                lastUpdate: Date.now(),
                activeTab: 'trade',
                selectedOre: 'coal'
            };
        }
        if (!state.market.activeTab) state.market.activeTab = 'trade';

        const ores = [
            { id: 'coal', name: 'Уголь', icon: '🪨', base: 50, color: '#888' },
            { id: 'copper', name: 'Медь', icon: '🟠', base: 250, color: '#f80' },
            { id: 'iron', name: 'Железо', icon: '⚙️', base: 1000, color: '#aaa' },
            { id: 'gold', name: 'Золото', icon: '🟡', base: 5000, color: '#ff0' },
            { id: 'diamond', name: 'Алмаз', icon: '💎', base: 25000, color: '#0ff' }
        ];

        // 1. ГЛАВНОЕ МЕНЮ РЫНКА
        window._obsolete_openMarketMenu_3 = function() {
            let activeTab = state.market.activeTab;
            
            // Верхняя панель с вкладками
            let tabsHtml = `
            <div style="display:flex; gap:5px; margin-bottom:15px; border-bottom:1px solid #333; padding-bottom:5px;">
                <button class="btn-3d ${activeTab === 'trade' ? 'btn-3d-yellow' : ''}" onclick="state.market.activeTab='trade'; openMarketMenu()" style="flex:1; padding:8px; font-size:12px;">📊 Торговля</button>
                <button class="btn-3d ${activeTab === 'chart' ? 'btn-3d-yellow' : ''}" onclick="state.market.activeTab='chart'; openMarketMenu()" style="flex:1; padding:8px; font-size:12px;">📈 График</button>
                <button class="btn-3d ${activeTab === 'history' ? 'btn-3d-yellow' : ''}" onclick="state.market.activeTab='history'; openMarketMenu()" style="flex:1; padding:8px; font-size:12px;">📜 История</button>
            </div>`;

            let contentHtml = '';

            if (activeTab === 'trade') {
                contentHtml = `<div style="display:flex; flex-direction:column; gap:8px; max-height:50vh; overflow-y:auto;">`;
                ores.forEach(ore => {
                    let currentPrice = state.market.prices[ore.id];
                    let diff = currentPrice - ore.base;
                    let diffPercent = ((diff / ore.base) * 100).toFixed(1);
                    let isUp = diff >= 0;
                    let color = isUp ? '#0f0' : '#f00';
                    let arrow = isUp ? '📈' : '📉';
                    let owned = (state.inventory && state.inventory[ore.id]) || 0;

                    contentHtml += `
                    <div style="background:rgba(0,0,0,0.5); border:1px solid #333; border-radius:10px; padding:10px; display:flex; justify-content:space-between; align-items:center;">
                        <div style="flex:1;">
                            <div style="font-size:14px; color:#fff; font-weight:bold;">${ore.icon} ${ore.name}</div>
                            <div style="font-size:11px; color:#aaa;">В наличии: <b style="color:#0f0;">${owned}</b></div>
                        </div>
                        <div style="text-align:right; flex:1;">
                            <div style="font-size:14px; color:${color}; font-weight:bold;">${format(currentPrice)} 🍪 ${arrow}</div>
                            <div style="font-size:10px; color:${color};">${diffPercent > 0 ? '+' : ''}${diffPercent}%</div>
                        </div>
                        <div style="display:flex; flex-direction:column; gap:5px; margin-left:10px;">
                            <button class="btn-3d btn-3d-red" onclick="sellMarketOre('${ore.id}', ${owned})" style="padding:5px 8px; font-size:10px;" ${owned < 1 ? 'disabled' : ''}>Продать всё</button>
                            <button class="btn-3d btn-3d-blue" onclick="buyMarketOre('${ore.id}', 1)" style="padding:5px 8px; font-size:10px;">Купить 1</button>
                        </div>
                    </div>`;
                });
                contentHtml += `</div>`;
            } 
            else if (activeTab === 'chart') {
                // Свечной график для выбранного ресурса
                let selected = state.market.selectedOre || 'coal';
                let oreData = ores.find(o => o.id === selected);
                let history = state.market.history[selected] || [];
                
                // Ограничиваем историю для графика
                let chartData = history.slice(-20);
                if (chartData.length < 2) chartData = [oreData.base, oreData.base];

                let minPrice = Math.min(...chartData) * 0.9;
                let maxPrice = Math.max(...chartData) * 1.1;
                let range = maxPrice - minPrice || 1;

                // Рисуем SVG график
                let svgHtml = `<svg viewBox="0 0 300 150" style="width:100%; height:150px; background:#000; border:1px solid #333; border-radius:8px;">`;
                
                // Сетка
                for(let i=0; i<5; i++) {
                    let y = 20 + i * 25;
                    svgHtml += `<line x1="0" y1="${y}" x2="300" y2="${y}" stroke="#222" stroke-width="1" />`;
                }

                // Линия графика
                let pathD = "";
                chartData.forEach((price, index) => {
                    let x = (index / (chartData.length - 1)) * 300;
                    let y = 150 - ((price - minPrice) / range) * 130 - 10;
                    if (index === 0) pathD += `M ${x} ${y} `;
                    else pathD += `L ${x} ${y} `;
                });

                let lineColor = chartData[chartData.length-1] >= chartData[0] ? '#0f0' : '#f00';
                svgHtml += `<path d="${pathD}" fill="none" stroke="${lineColor}" stroke-width="2" />`;
                
                // Точка на конце
                let lastX = 300;
                let lastY = 150 - ((chartData[chartData.length-1] - minPrice) / range) * 130 - 10;
                svgHtml += `<circle cx="${lastX}" cy="${lastY}" r="3" fill="${lineColor}" />`;
                svgHtml += `</svg>`;

                contentHtml = `
                <div style="margin-bottom:10px; display:flex; gap:5px; overflow-x:auto;">
                    ${ores.map(o => `<button class="btn-3d ${o.id === selected ? 'btn-3d-yellow' : ''}" onclick="state.market.selectedOre='${o.id}'; openMarketMenu()" style="padding:5px 10px; font-size:10px;">${o.icon} ${o.name}</button>`).join('')}
                </div>
                ${svgHtml}
                <div style="text-align:center; margin-top:10px; color:#aaa; font-size:12px;">
                    Текущая цена: <b style="color:${lineColor};">${format(state.market.prices[selected])} 🍪</b>
                </div>`;
            }
            else if (activeTab === 'history') {
                contentHtml = `<div style="text-align:center; color:#aaa; padding:20px;">История торгов (в разработке)</div>`;
            }

            let html = `<h3 style="text-align:center; color:#0f0; text-shadow:0 0 10px #0f0;">💱 Торговый Терминал</h3>
            ${tabsHtml}
            ${contentHtml}
            <button class="btn-3d" onclick="closeCustomModal()" style="width:100%; margin-top:15px;">Закрыть</button>`;
            
            showCustomModal(html);
        };

        // 2. ПРОДАЖА
        window.sellMarketOre = function(oreId, amount) {
            if (!state.inventory || (state.inventory[oreId] || 0) < amount) return showToast('❌ Недостаточно руды!');
            
            let price = state.market.prices[oreId];
            let total = price * amount;
            
            state.inventory[oreId] -= amount;
            state.cookies += total;
            state.totalBaked += total;
            
            showToast(`💱 Продано ${amount} руды за ${format(total)} 🍪`);
            playSound(600, 0.1);
            openMarketMenu();
            if (typeof updateUI === 'function') updateUI();
            if (typeof save === 'function') save();
        };

        // 3. ПОКУПКА
        window.buyMarketOre = function(oreId, amount) {
            let price = state.market.prices[oreId];
            let total = price * amount;
            
            if (state.cookies < total) return showToast('❌ Не хватает печенек!');
            
            state.cookies -= total;
            if (!state.inventory) state.inventory = {};
            state.inventory[oreId] = (state.inventory[oreId] || 0) + amount;
            
            showToast(`💱 Куплено ${amount} руды за ${format(total)} 🍪`);
            playSound(600, 0.1);
            openMarketMenu();
            if (typeof updateUI === 'function') updateUI();
            if (typeof save === 'function') save();
        };

        // 4. ДИНАМИКА ЦЕН
        setInterval(() => {
            if (typeof state.market === 'undefined') return;
            
            ores.forEach(ore => {
                let current = state.market.prices[ore.id];
                let change = 1 + (Math.random() * 0.04 - 0.02);
                let newPrice = Math.max(Math.floor(ore.base * 0.2), Math.floor(current * change));
                
                state.market.prices[ore.id] = newPrice;
                
                if (!state.market.history[ore.id]) state.market.history[ore.id] = [];
                state.market.history[ore.id].push(newPrice);
                if (state.market.history[ore.id].length > 20) state.market.history[ore.id].shift();
            });

            // Обновляем меню (только если открыто)
            if (Date.now() % 3 === 0) {
                let modal = document.getElementById('customModal');
                if (modal && modal.style.display === 'flex' && modal.innerText.includes('Торговый Терминал')) {
                    openMarketMenu();
                }
            }
        }, 1000);

        // 5. СОБЫТИЯ
        setInterval(() => {
            if (Math.random() > 0.3) return;
            let eventType = Math.random();
            let ore = ores[Math.floor(Math.random() * ores.length)];
            
            if (eventType < 0.5) {
                state.market.prices[ore.id] = Math.floor(state.market.prices[ore.id] * 2);
                showToast(`📈 НОВОСТИ: Спрос на ${ore.name} вырос! Цена x2!`);
            } else {
                state.market.prices[ore.id] = Math.floor(state.market.prices[ore.id] * 0.5);
                showToast(`📉 НОВОСТИ: Найдена жила ${ore.name}! Цена упала в 2 раза!`);
            }
            if (typeof save === 'function') save();
        }, 120000);

        console.log("✅ Торговый Терминал (Рынок PRO) загружен!");
    }, 1500);
});
</script>

<script>
// ==========================================
// ДЕРЕВО НАВЫКОВ 2.0 (4 ВЕТКИ, 40 УЛУЧШЕНИЙ)
// ==========================================
window.addEventListener('load', () => {
    setTimeout(() => {
        if (typeof state === 'undefined') return;

        // Инициализация
        if (!state.skills) state.skills = { click: 0, cps: 0, luck: 0, mult: 0 };
        if (state.skillPoints === undefined) state.skillPoints = 0;

        // Выдача очка за уровень
        const origForceClick = window.forceClick;
        window.forceClick = function(e) {
            let oldLevel = state.evoLevel;
            if (typeof origForceClick === 'function') origForceClick(e);
            
            if (state.evoLevel > oldLevel) {
                state.skillPoints = (state.skillPoints || 0) + 1;
                showToast(`🌳 Получено 1 Очко Навыка! (Всего: ${state.skillPoints})`);
            }
        };

        // 1. МЕНЮ ДЕРЕВА
        window.openTreeMenu = function() {
            let sp = state.skillPoints || 0;
            
            let html = `<h3 style="text-align:center; color:#0f0; text-shadow:0 0 10px #0f0;">🌳 Дерево Навыков</h3>
            <p style="text-align:center; color:#aaa;">Доступно очков: <b style="color:#ff0; font-size:18px;">${sp}</b></p>
            
            <div style="display:flex; flex-direction:column; gap:10px; max-height:55vh; overflow-y:auto;">`;

            const branches = [
                { id: 'click', name: '🗡️ Сила Клика', desc: '+10% к клику за ур.', max: 10, color: '#f00' },
                { id: 'cps', name: '🏭 Сила Пассива', desc: '+10% к пассиву за ур.', max: 10, color: '#0ff' },
                { id: 'luck', name: '🍀 Удача', desc: '+2% к шансу крита за ур.', max: 10, color: '#ff0' },
                { id: 'mult', name: '💎 Множитель', desc: '+5% ко всему за ур.', max: 10, color: '#f0f' }
            ];

            branches.forEach(branch => {
                let currentLvl = state.skills[branch.id] || 0;
                let cost = currentLvl + 1;
                let isMax = currentLvl >= branch.max;
                let canBuy = sp >= cost && !isMax;

                let btnStyle = isMax ? 'background:#333; color:#666;' : (canBuy ? `background:${branch.color}; color:#000;` : 'background:#111; color:#555; border:1px solid #333;');
                let btnText = isMax ? 'MAX' : `Улучшить (${cost} очк.)`;

                html += `
                <div style="background:rgba(0,0,0,0.5); border:1px solid ${branch.color}; border-radius:10px; padding:12px;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                        <b style="color:${branch.color};">${branch.name} [Ур. ${currentLvl}/${branch.max}]</b>
                    </div>
                    <div style="color:#aaa; font-size:11px; margin-bottom:10px;">${branch.desc}</div>
                    <div style="width:100%; height:6px; background:#111; border-radius:3px; margin-bottom:10px;">
                        <div style="width:${(currentLvl/branch.max)*100}%; height:100%; background:${branch.color}; border-radius:3px; box-shadow:0 0 5px ${branch.color};"></div>
                    </div>
                    <button class="btn-3d" onclick="upgradeSkill('${branch.id}')" style="width:100%; padding:8px; border-radius:5px; font-weight:bold; ${btnStyle}" ${!canBuy ? 'disabled' : ''}>
                        ${btnText}
                    </button>
                </div>`;
            });

            html += `</div>
            <button class="btn-3d" onclick="closeCustomModal()" style="width:100%; margin-top:15px;">Закрыть</button>`;
            showCustomModal(html);
        };

        // 2. ЛОГИКА ПОКУПКИ
        window.upgradeSkill = function(id) {
            let currentLvl = state.skills[id] || 0;
            let cost = currentLvl + 1;

            if (state.skillPoints < cost) return showToast('❌ Не хватает очков навыков!');
            if (currentLvl >= 10) return showToast('❌ Максимальный уровень!');

            state.skillPoints -= cost;
            state.skills[id] = currentLvl + 1;
            
            showToast('🌳 Навык улучшен!');
            playSound(800, 0.1);
            openTreeMenu();
            
            if (typeof updateUI === 'function') updateUI();
            if (typeof save === 'function') save();
        };

        // 3. ПРИМЕНЕНИЕ БОНУСОВ (Перезапись множителей)
        const oldGetMultipliers = window.getMultipliers;
        window.getMultipliers = function() {
            let base = { mClick: 1, mCps: 1 };
            if (typeof oldGetMultipliers === 'function') {
                base = oldGetMultipliers();
            }
            
            if (state.skills) {
                base.mClick *= (1 + (state.skills.click || 0) * 0.1);
                base.mCps *= (1 + (state.skills.cps || 0) * 0.1);
                let multBonus = 1 + (state.skills.mult || 0) * 0.05;
                base.mClick *= multBonus;
                base.mCps *= multBonus;
            }
            return base;
        };

        console.log("✅ Дерево Навыков 2.0 загружено!");
    }, 1500);
});
</script>

<script>
// ==========================================
// ДРОНЫ 3.0: 6 КНОПОК, ГЛУБОКАЯ СИСТЕМА
// ==========================================
window.addEventListener('load', () => {
    setTimeout(() => {
        if (typeof state === 'undefined') return;

        // Инициализация дронов (если нет)
        if (!state.dronesData) {
            state.dronesData = {
                miner: { lvl: 0, baseCost: 100, name: '⛏️ Шахтер', desc: 'Добывает 5 руды / 10 сек' },
                clicker: { lvl: 0, baseCost: 250, name: '🤖 Кликер', desc: '+1 клик / сек' },
                warrior: { lvl: 0, baseCost: 500, name: '🚁 Боевой', desc: '+10% урона в Арене' }
            };
        }

        // 1. МЕНЮ ДРОНОВ (6 КНОПОК)
        window.openDronesMenu = function() {
            let data = state.dronesData;
            
            let html = `<h3 style="text-align:center; color:#0ff; text-shadow:0 0 10px #0ff;">🛸 Дроны-Помощники</h3>
            <p style="text-align:center; color:#aaa; font-size:11px; margin-bottom:15px;">Управляй своей армией дронов</p>
            
            <div style="display:flex; flex-direction:column; gap:10px; max-height:55vh; overflow-y:auto; padding-right:5px;">
            `;

            // Функция для отрисовки одного дрона
            let renderDrone = (id, dataObj, color, icon) => {
                let cost = dataObj.lvl === 0 ? dataObj.baseCost : Math.floor(dataObj.baseCost * Math.pow(1.6, dataObj.lvl));
                let canBuy = state.crystals >= cost;
                
                return `
                <div style="background:rgba(0,0,0,0.5); border:1px solid ${color}; border-radius:10px; padding:12px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span style="font-size:28px;">${icon}</span>
                            <div>
                                <b style="color:${color}; font-size:14px;">${dataObj.name}</b><br>
                                <span style="font-size:10px; color:#aaa;">${dataObj.desc}</span>
                            </div>
                        </div>
                        <div style="text-align:right;">
                            <span style="color:#fff; font-size:12px;">Ур. ${dataObj.lvl}</span>
                        </div>
                    </div>
                    <button class="btn-3d" onclick="upgradeDrone('${id}')" style="width:100%; padding:8px; font-size:12px; border-color:${color} !important; color:${color} !important;" ${!canBuy ? 'disabled style="opacity:0.5;"' : ''}>
                        Улучшить (${format(cost)} 💎)
                    </button>
                </div>`;
            };

            html += renderDrone('miner', data.miner, '#0f0', '⛏️');
            html += renderDrone('clicker', data.clicker, '#f0f', '🤖');
            html += renderDrone('warrior', data.warrior, '#f00', '🚁');

            html += `</div>
            
            <!-- 3 КНОПКИ ДЕЙСТВИЙ -->
            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; margin-top:15px;">
                <button class="btn-3d btn-3d-blue" onclick="collectDroneOres()" style="padding:10px; font-size:11px;">⛏️ Собрать руду</button>
                <button class="btn-3d btn-3d-yellow" onclick="boostDrones()" style="padding:10px; font-size:11px;">⚡ Буст (10 мин)</button>
                <button class="btn-3d btn-3d-red" onclick="sellAllDrones()" style="padding:10px; font-size:11px;">💰 Продать всех</button>
            </div>
            
            <button class="btn-3d" onclick="closeCustomModal()" style="width:100%; margin-top:10px;">Закрыть</button>`;
            showCustomModal(html);
        };

        // 2. УЛУЧШЕНИЕ
        window.upgradeDrone = function(type) {
            let data = state.dronesData[type];
            let cost = data.lvl === 0 ? data.baseCost : Math.floor(data.baseCost * Math.pow(1.6, data.lvl));
            
            if (state.crystals < cost) return showToast('❌ Не хватает кристаллов!');
            
            state.crystals -= cost;
            data.lvl++;
            
            showToast(`🛸 ${data.name} улучшен до ур. ${data.lvl}!`);
            playSound(800, 0.2);
            openDronesMenu();
            if (typeof updateUI === 'function') updateUI();
            if (typeof save === 'function') save();
        };

        // 3. КНОПКА "СОБРАТЬ РУДУ" (Мгновенный сбор)
        window.collectDroneOres = function() {
            if (state.dronesData.miner.lvl === 0) return showToast('❌ У тебя нет шахтеров!');
            
            let amount = state.dronesData.miner.lvl * 10;
            if (!state.inventory) state.inventory = {};
            state.inventory.coal = (state.inventory.coal || 0) + amount;
            
            showToast(`⛏️ Собрано ${amount} руды!`);
            playSound(600, 0.1);
            if (typeof save === 'function') save();
        };

        // 4. КНОПКА "БУСТ ДРОНОВ" (Ускорение на 10 минут)
        window.boostDrones = function() {
            if (state.crystals < 100) return showToast('❌ Нужно 100 💎!');
            state.crystals -= 100;
            state.dronesBoost = Date.now() + 10 * 60 * 1000; // 10 минут
            showToast('⚡ Дроны ускорены на 10 минут!');
            playSound(1000, 0.3);
            if (typeof updateUI === 'function') updateUI();
            if (typeof save === 'function') save();
        };

        // 5. КНОПКА "ПРОДАТЬ ВСЕХ" (Сброс дронов за кристаллы)
        window.sellAllDrones = function() {
            let totalLvls = state.dronesData.miner.lvl + state.dronesData.clicker.lvl + state.dronesData.warrior.lvl;
            if (totalLvls === 0) return showToast('❌ У тебя нет дронов!');
            
            let refund = totalLvls * 50; // Возврат 50 кристаллов за уровень
            state.crystals += refund;
            
            state.dronesData.miner.lvl = 0;
            state.dronesData.clicker.lvl = 0;
            state.dronesData.warrior.lvl = 0;
            
            showToast(`💰 Продано! Возвращено ${refund} 💎`);
            playSound(400, 0.3);
            openDronesMenu();
            if (typeof updateUI === 'function') updateUI();
            if (typeof save === 'function') save();
        };

        // 6. АВТОМАТИЧЕСКАЯ РАБОТА ДРОНОВ (С УЧЕТОМ БУСТА)
        setInterval(() => {
            if (!state.dronesData) return;
            
            let isBoosted = state.dronesBoost && Date.now() < state.dronesBoost;
            let multiplier = isBoosted ? 2 : 1;

            // Шахтер
            if (state.dronesData.miner.lvl > 0) {
                if (!state.inventory) state.inventory = {};
                let amount = state.dronesData.miner.lvl * multiplier;
                state.inventory.coal = (state.inventory.coal || 0) + amount;
            }

            // Кликер
            if (state.dronesData.clicker.lvl > 0) {
                let gain = state.dronesData.clicker.lvl * (state.cpc || 1) * multiplier;
                state.cookies += gain;
                state.totalBaked += gain;
            }

            if (typeof updateUI === 'function') updateUI();
        }, 1000);

        console.log("✅ Дроны 3.0 (6 кнопок) загружены!");
    }, 1500);
});
</script>

<script>
// ==========================================
// ЛАБОРАТОРИЯ 3.0: 6 ВЕТОК УЛУЧШЕНИЙ
// ==========================================
window.addEventListener('load', () => {
    setTimeout(() => {
        if (typeof state === 'undefined') return;

        // Инициализация (добавляем новые ветки)
        if (!state.lab) state.lab = {};
        if (state.lab.dna === undefined) state.lab.dna = 0;
        if (state.lab.clickMult === undefined) state.lab.clickMult = 0;
        if (state.lab.cpsMult === undefined) state.lab.cpsMult = 0;
        if (state.lab.critChance === undefined) state.lab.critChance = 0;
        if (state.lab.offlineEarn === undefined) state.lab.offlineEarn = 0;
        if (state.lab.autoSpeed === undefined) state.lab.autoSpeed = 0;
        if (state.lab.goldBonus === undefined) state.lab.goldBonus = 0; // Новое: бонус к золоту

        // 1. МЕНЮ ЛАБОРАТОРИИ (6 КНОПОК)
        window.openLabMenu = function() {
            let lab = state.lab;
            
            let html = `<h3 style="text-align:center; color:#f0f; text-shadow:0 0 10px #f0f;">🧬 Лаборатория</h3>
            <p style="text-align:center; color:#aaa; font-size:12px; margin-bottom:15px;">Исследуй и улучшай свои способности</p>
            
            <div style="text-align:center; margin-bottom:15px; background:rgba(0,0,0,0.5); padding:10px; border-radius:10px; border:1px solid #333;">
                <p style="color:#0f0; font-size:18px;">Твой запас ДНК: <b>${lab.dna} 🧬</b></p>
            </div>
            
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; max-height:55vh; overflow-y:auto; padding-right:5px;">`;

            const branches = [
                { id: 'clickMult', name: '🗡️ Сила Клика', desc: '+10% к клику', cost: 50, color: '#0f0' },
                { id: 'cpsMult', name: '🏭 Сила Пассива', desc: '+10% к пассиву', cost: 50, color: '#0ff' },
                { id: 'critChance', name: '💥 Шанс Крита', desc: '+2% к криту', cost: 100, color: '#ff0' },
                { id: 'offlineEarn', name: '🌙 Офлайн Доход', desc: '+10% в офлайне', cost: 150, color: '#f0f' },
                { id: 'autoSpeed', name: '⚡ Автоклик', desc: '+1 клик/сек', cost: 200, color: '#f00' },
                { id: 'goldBonus', name: '🪙 Бонус Золота', desc: '+5% к золоту', cost: 250, color: '#ff0' }
            ];

            branches.forEach(branch => {
                let lvl = lab[branch.id] || 0;
                let cost = branch.cost + (lvl * Math.floor(branch.cost * 0.5));
                let canBuy = lab.dna >= cost;

                let btnStyle = canBuy ? `border-color:${branch.color} !important; color:${branch.color} !important;` : 'opacity:0.5; border-color:#333 !important; color:#555 !important;';
                
                html += `
                <div style="background:rgba(0,0,0,0.5); border:1px solid ${branch.color}; border-radius:10px; padding:10px; display:flex; flex-direction:column; justify-content:space-between;">
                    <div style="text-align:center; margin-bottom:10px;">
                        <div style="font-size:24px; margin-bottom:5px;">${branch.name.split(' ')[0]}</div>
                        <b style="color:${branch.color}; font-size:12px;">${branch.name.split(' ').slice(1).join(' ')}</b><br>
                        <span style="font-size:10px; color:#aaa;">${branch.desc}</span><br>
                        <span style="font-size:10px; color:#fff;">Ур. ${lvl}</span>
                    </div>
                    <button class="btn-3d" onclick="upgradeLab('${branch.id}')" style="width:100%; padding:8px; font-size:11px; ${btnStyle}" ${!canBuy ? 'disabled' : ''}>
                        ${cost} 🧬
                    </button>
                </div>`;
            });

            html += `</div>
            <button class="btn-3d" onclick="closeCustomModal()" style="width:100%; margin-top:15px;">Закрыть</button>`;
            showCustomModal(html);
        };

        // 2. ЛОГИКА ПОКУПКИ
        window.upgradeLab = function(id) {
            let lab = state.lab;
            let lvl = lab[id] || 0;
            
            let baseCosts = { clickMult: 50, cpsMult: 50, critChance: 100, offlineEarn: 150, autoSpeed: 200, goldBonus: 250 };
            let cost = baseCosts[id] + (lvl * Math.floor(baseCosts[id] * 0.5));

            if (lab.dna < cost) return showToast('❌ Не хватает ДНК!');
            
            lab.dna -= cost;
            lab[id] = lvl + 1;
            
            showToast(`🧬 ${id} улучшен до ур. ${lab[id]}!`);
            playSound(800, 0.2);
            openLabMenu();
            if (typeof updateUI === 'function') updateUI();
            if (typeof save === 'function') save();
        };

        // 3. ПРИМЕНЕНИЕ БОНУСОВ
        const oldGetMultipliers = window.getMultipliers;
        window.getMultipliers = function() {
            let base = { mClick: 1, mCps: 1 };
            if (typeof oldGetMultipliers === 'function') base = oldGetMultipliers();
            
            if (state.lab) {
                base.mClick *= (1 + (state.lab.clickMult || 0) * 0.1);
                base.mCps *= (1 + (state.lab.cpsMult || 0) * 0.1);
            }
            return base;
        };

        // 4. АВТОКЛИК
        setInterval(() => {
            if (state.lab && state.lab.autoSpeed > 0) {
                let gain = state.lab.autoSpeed * (state.cpc || 1);
                state.cookies += gain;
                state.totalBaked += gain;
                if (typeof updateUI === 'function') updateUI();
            }
        }, 1000);

        console.log("✅ Лаборатория 3.0 (6 кнопок) загружена!");
    }, 1500);
});
</script>

<script>
// ==========================================
// КВЕСТЫ 3.0: ЕЖЕДНЕВНЫЕ, ЦЕПОЧКА, МАГАЗИН
// ==========================================
window.addEventListener('load', () => {
    setTimeout(() => {
        if (typeof state === 'undefined') return;

        // Инициализация
        if (!state.quests) {
            state.quests = {
                coins: 0,
                daily: [],
                lastReset: 0,
                chainProgress: 0,
                chainClaimed: false
            };
        }

        const dailyPool = [
            { id: 'clicks', text: 'Сделай 500 кликов', target: 500, reward: 10, type: 'click' },
            { id: 'cookies', text: 'Накопи 10.000 печенек', target: 10000, reward: 15, type: 'cookie' },
            { id: 'arena', text: 'Победи в Арене 3 раза', target: 3, reward: 20, type: 'arena' },
            { id: 'factory', text: 'Купи 5 заводов', target: 5, reward: 15, type: 'factory' },
            { id: 'pvp', text: 'Победи в PvP 2 раза', target: 2, reward: 25, type: 'pvp' }
        ];

        const chainQuests = [
            { text: 'Добро пожаловать! Сделай 100 кликов', target: 100, reward: 20 },
            { text: 'Купи свой первый завод', target: 1, reward: 50 },
            { text: 'Достигни 5 уровня', target: 5, reward: 100 },
            { text: 'Победи в Арене 5 раз', target: 5, reward: 150 },
            { text: 'Открой 10 карточек', target: 10, reward: 200 }
        ];

        // 1. ГЕНЕРАЦИЯ КВЕСТОВ
        window.generateDailyQuests = function(force = false) {
            let now = Date.now();
            let oneDay = 24 * 60 * 60 * 1000;
            
            if (force || now - state.quests.lastReset > oneDay || state.quests.daily.length === 0) {
                state.quests.lastReset = now;
                state.quests.daily = [];
                
                let shuffled = [...dailyPool].sort(() => 0.5 - Math.random());
                let selected = shuffled.slice(0, 3);
                
                selected.forEach(q => {
                    state.quests.daily.push({
                        id: q.id, text: q.text, target: q.target, reward: q.reward, progress: 0, claimed: false
                    });
                });
                if (typeof save === 'function') save();
            }
        };

        // 2. МЕНЮ КВЕСТОВ
        window.openQuestMenu = function() {
            generateDailyQuests();

            let html = `<h3 style="text-align:center; color:#0f0; text-shadow:0 0 10px #0f0;">📜 Квесты</h3>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <p style="color:#ff0; font-size:16px;">Монеты: <b>${state.quests.coins} 📜</b></p>
                <button class="btn-3d btn-3d-yellow" onclick="openQuestShop()" style="padding:5px 10px; font-size:12px;">🛒 Магазин</button>
            </div>
            
            <h4 style="color:#0f0; margin-bottom:5px;">🔥 Ежедневные</h4>
            <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:15px;">`;

            state.quests.daily.forEach(q => {
                let percent = Math.min(100, (q.progress / q.target) * 100);
                let btn = q.claimed 
                    ? `<button class="btn-3d" disabled style="opacity:0.5; padding:5px 10px; font-size:10px;">✅</button>`
                    : (q.progress >= q.target 
                        ? `<button class="btn-3d btn-3d-yellow" onclick="claimQuest('${q.id}')" style="padding:5px 10px; font-size:10px;">Забрать</button>`
                        : `<button class="btn-3d" disabled style="opacity:0.5; padding:5px 10px; font-size:10px;">В процессе</button>`);

                html += `
                <div style="background:rgba(0,0,0,0.5); border:1px solid #333; border-radius:8px; padding:8px;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                        <b style="color:#0f0; font-size:11px;">${q.text}</b>
                        <span style="color:#ff0; font-size:11px;">+${q.reward} 📜</span>
                    </div>
                    <div style="width:100%; height:6px; background:#111; border-radius:3px; margin-bottom:5px;">
                        <div style="width:${percent}%; height:100%; background:#0f0;"></div>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="color:#aaa; font-size:10px;">${q.progress} / ${q.target}</span>
                        ${btn}
                    </div>
                </div>`;
            });

            html += `</div>
            <h4 style="color:#0ff; margin-bottom:5px;">🌌 Сюжетная цепочка</h4>
            <div style="background:rgba(0,0,255,0.1); border:1px solid #0ff; border-radius:8px; padding:10px;">
                ${getChainQuestHtml()}
            </div>
            
            <button class="btn-3d" onclick="closeCustomModal()" style="width:100%; margin-top:15px;">Закрыть</button>`;
            showCustomModal(html);
        };

        // 3. СЮЖЕТНАЯ ЦЕПОЧКА
        function getChainQuestHtml() {
            let prog = state.quests.chainProgress || 0;
            if (prog >= chainQuests.length) {
                return `<div style="text-align:center; color:#0f0; padding:10px;">🏆 Все сюжетные квесты пройдены!</div>`;
            }

            let q = chainQuests[prog];
            let current = 0;
            if (prog === 0) current = state.clicks || 0;
            if (prog === 1) current = state.pUpgrades && Object.keys(state.pUpgrades).length > 0 ? 1 : 0;
            if (prog === 2) current = state.evoLevel || 1;
            if (prog === 3) current = state.arena.wins || 0;
            if (prog === 4) current = Object.keys(state.cards || {}).length || 0;

            let percent = Math.min(100, (current / q.target) * 100);
            let btn = current >= q.target 
                ? `<button class="btn-3d btn-3d-yellow" onclick="claimChainQuest()" style="padding:5px 10px; font-size:10px;">Забрать</button>`
                : `<button class="btn-3d" disabled style="opacity:0.5; padding:5px 10px; font-size:10px;">В процессе</button>`;

            return `
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                <b style="color:#0ff; font-size:12px;">${q.text}</b>
                <span style="color:#ff0; font-size:12px;">+${q.reward} 📜</span>
            </div>
            <div style="width:100%; height:6px; background:#111; border-radius:3px; margin-bottom:5px;">
                <div style="width:${percent}%; height:100%; background:#0ff;"></div>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="color:#aaa; font-size:10px;">${current} / ${q.target}</span>
                ${btn}
            </div>`;
        }

        window.claimChainQuest = function() {
            let prog = state.quests.chainProgress || 0;
            if (prog >= chainQuests.length) return;
            
            let q = chainQuests[prog];
            state.quests.chainProgress = prog + 1;
            state.quests.coins += q.reward;
            
            showToast(`🌌 Сюжетный квест выполнен! +${q.reward} 📜`);
            playSound(1000, 0.3);
            openQuestMenu();
            if (typeof save === 'function') save();
        };

        // 4. МАГАЗИН
        window.openQuestShop = function() {
            let html = `<h3 style="text-align:center; color:#ff0;">🛒 Магазин Квестов</h3>
            <p style="text-align:center; color:#0f0; margin-bottom:15px;">У тебя: ${state.quests.coins} 📜</p>
            
            <div style="display:flex; flex-direction:column; gap:10px;">
                <div style="background:rgba(0,0,0,0.5); border:1px solid #0f0; border-radius:10px; padding:10px; display:flex; justify-content:space-between; align-items:center;">
                    <div><b style="color:#0f0;">⚡ Бафф Клика</b><br><span style="font-size:10px; color:#aaa;">x2 к клику на 10 мин</span></div>
                    <button class="btn-3d" onclick="buyQuestItem('click')" style="padding:5px 10px; font-size:12px;">50 📜</button>
                </div>
                <div style="background:rgba(0,0,0,0.5); border:1px solid #0ff; border-radius:10px; padding:10px; display:flex; justify-content:space-between; align-items:center;">
                    <div><b style="color:#0ff;">💎 Сундук Кристаллов</b><br><span style="font-size:10px; color:#aaa;">+500 Кристаллов</span></div>
                    <button class="btn-3d btn-3d-blue" onclick="buyQuestItem('crystals')" style="padding:5px 10px; font-size:12px;">100 📜</button>
                </div>
                <div style="background:rgba(0,0,0,0.5); border:1px solid #ff0; border-radius:10px; padding:10px; display:flex; justify-content:space-between; align-items:center;">
                    <div><b style="color:#ff0;">🏅 Медали PvP</b><br><span style="font-size:10px; color:#aaa;">+50 Медалей</span></div>
                    <button class="btn-3d btn-3d-yellow" onclick="buyQuestItem('medals')" style="padding:5px 10px; font-size:12px;">75 📜</button>
                </div>
            </div>
            
            <button class="btn-3d" onclick="openQuestMenu()" style="width:100%; margin-top:15px;">Назад</button>`;
            showCustomModal(html);
        };

        // 5. ЛОГИКА
        window.claimQuest = function(id) {
            let q = state.quests.daily.find(x => x.id === id);
            if (!q || q.claimed || q.progress < q.target) return;
            
            q.claimed = true;
            state.quests.coins += q.reward;
            showToast(`🎁 Получено ${q.reward} 📜!`);
            playSound(800, 0.2);
            openQuestMenu();
            if (typeof save === 'function') save();
        };

        window.buyQuestItem = function(type) {
            if (type === 'click') {
                if (state.quests.coins < 50) return showToast('❌ Мало монет!');
                state.quests.coins -= 50;
                state.quests.buffs = { clickMult: 2, expire: Date.now() + 600000 };
                showToast('⚡ Бафф активирован!');
            } else if (type === 'crystals') {
                if (state.quests.coins < 100) return showToast('❌ Мало монет!');
                state.quests.coins -= 100;
                state.crystals += 500;
                showToast('💎 Получено 500 Кристаллов!');
            } else if (type === 'medals') {
                if (state.quests.coins < 75) return showToast('❌ Мало монет!');
                state.quests.coins -= 75;
                if (!state.pvp) state.pvp = { medals: 0 };
                state.pvp.medals += 50;
                showToast('🏅 Получено 50 Медалей!');
            }
            playSound(1000, 0.2);
            openQuestShop();
            if (typeof save === 'function') save();
        };

        // 6. ОТСЛЕЖИВАНИЕ
        const oldForceClick = window.forceClick;
        window.forceClick = function(e) {
            if (typeof oldForceClick === 'function') oldForceClick(e);
            if (state.quests && state.quests.daily) {
                state.quests.daily.forEach(q => {
                    if (q.id === 'clicks' && q.progress < q.target) q.progress++;
                    if (q.id === 'cookies' && state.totalBaked >= q.target && q.progress < q.target) q.progress = q.target;
                });
            }
        };

        const oldEndBattle = window.endBattle;
        window.endBattle = function(win) {
            if (typeof oldEndBattle === 'function') oldEndBattle(win);
            if (win && state.quests && state.quests.daily) {
                state.quests.daily.forEach(q => {
                    if (q.id === 'arena' && q.progress < q.target) q.progress++;
                });
            }
        };

        const oldBuyFactory = window.upgradeFactory;
        window.upgradeFactory = function(id, cost) {
            if (typeof oldBuyFactory === 'function') oldBuyFactory(id, cost);
            if (state.quests && state.quests.daily) {
                state.quests.daily.forEach(q => {
                    if (q.id === 'factory' && q.progress < q.target) q.progress++;
                });
            }
        };

        console.log("✅ Квесты 3.0 загружены!");
    }, 1500);
});
</script>

<script>
// ==========================================
// ЕЖЕДНЕВНЫЙ БОНУС 2.0 (7 ДНЕЙ, СТРИК)
// ==========================================
window.addEventListener('load', () => {
    setTimeout(() => {
        if (typeof state === 'undefined') return;

        // Инициализация
        if (!state.dailyBonus) {
            state.dailyBonus = { lastClaim: 0, streak: 0 };
        }

        // Награды за 7 дней
        const rewards = [
            { day: 1, type: 'cookies', val: 1000, icon: '🍪', text: '1.000 печенек' },
            { day: 2, type: 'crystals', val: 50, icon: '💎', text: '50 кристаллов' },
            { day: 3, type: 'cookies', val: 10000, icon: '🍪', text: '10.000 печенек' },
            { day: 4, type: 'dna', val: 20, icon: '🧬', text: '20 ДНК' },
            { day: 5, type: 'crystals', val: 200, icon: '💎', text: '200 кристаллов' },
            { day: 6, type: 'souls', val: 10, icon: '👻', text: '10 Душ' },
            { day: 7, type: 'crystals', val: 1000, icon: '💎', text: '1000 Кристаллов (Джекпот)' }
        ];

        // 1. МЕНЮ БОНУСА
        window.openBonusMenu = function() {
            let now = Date.now();
            let lastClaim = state.dailyBonus.lastClaim;
            let oneDay = 24 * 60 * 60 * 1000;
            let timePassed = now - lastClaim;
            let canClaim = timePassed >= oneDay;
            let currentStreak = state.dailyBonus.streak % 7; // 0-6 (день недели)

            // Если прошло больше 2 дней, стрик сбрасывается
            if (timePassed > 2 * oneDay) {
                state.dailyBonus.streak = 0;
                currentStreak = 0;
            }

            let timeLeftStr = "";
            if (!canClaim) {
                let diff = oneDay - timePassed;
                let h = Math.floor(diff / (1000 * 60 * 60));
                let m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                timeLeftStr = `${h}ч ${m}м`;
            }

            let html = `<h3 style="text-align:center; color:#0f0; text-shadow:0 0 10px #0f0;">🎁 Ежедневный Бонус</h3>
            <p style="text-align:center; color:#ff0; font-size:14px; margin-bottom:15px;">Твоя серия: <b>${state.dailyBonus.streak} дней</b></p>
            
            <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-bottom:20px;">`;

            rewards.forEach((r, i) => {
                let isClaimed = currentStreak > i || (currentStreak === i && lastClaim > 0 && !canClaim);
                let isToday = currentStreak === i && canClaim;
                let isNext = currentStreak === i && !canClaim;
                
                let borderColor = isClaimed ? '#333' : (isToday ? '#0f0' : (isNext ? '#ff0' : '#555'));
                let bgColor = isClaimed ? 'rgba(0,0,0,0.3)' : (isToday ? 'rgba(0,255,0,0.1)' : 'rgba(0,0,0,0.5)');
                let opacity = isClaimed ? '0.5' : '1';
                let checkMark = isClaimed ? '✅' : (isToday ? '🎁' : '🔒');

                html += `
                <div style="background:${bgColor}; border:2px solid ${borderColor}; border-radius:10px; padding:10px; text-align:center; opacity:${opacity}; position:relative;">
                    <div style="position:absolute; top:5px; right:5px; font-size:12px;">${checkMark}</div>
                    <div style="font-size:11px; color:#aaa; margin-bottom:5px;">День ${r.day}</div>
                    <div style="font-size:24px; margin-bottom:5px;">${r.icon}</div>
                    <div style="font-size:11px; color:#fff; font-weight:bold;">${r.text}</div>
                </div>`;
            });

            html += `</div>
            <button class="btn-3d btn-3d-yellow" onclick="claimDailyBonus()" style="width:100%; padding:15px; font-size:16px;" ${!canClaim ? 'disabled style="opacity:0.5;"' : ''}>
                ${canClaim ? '🎁 ЗАБРАТЬ БОНУС' : '⏳ Ждать ' + timeLeftStr}
            </button>
            <button class="btn-3d" onclick="closeCustomModal()" style="width:100%; margin-top:10px;">Закрыть</button>`;
            showCustomModal(html);
        };

        // 2. ПОЛУЧЕНИЕ БОНУСА
        window.claimDailyBonus = function() {
            let now = Date.now();
            let lastClaim = state.dailyBonus.lastClaim;
            let oneDay = 24 * 60 * 60 * 1000;
            let timePassed = now - lastClaim;

            if (timePassed < oneDay && lastClaim > 0) return showToast('❌ Бонус еще не доступен!');

            let currentStreak = state.dailyBonus.streak % 7;
            
            // Если прошло больше 2 дней, сбрасываем стрик
            if (timePassed > 2 * oneDay && lastClaim > 0) {
                state.dailyBonus.streak = 0;
                currentStreak = 0;
            }

            let reward = rewards[currentStreak];
            
            // Выдаем награду
            if (reward.type === 'cookies') { state.cookies += reward.val; state.totalBaked += reward.val; }
            if (reward.type === 'crystals') { state.crystals += reward.val; }
            if (reward.type === 'dna') { if (!state.lab) state.lab = {dna:0}; state.lab.dna += reward.val; }
            if (reward.type === 'souls') { state.souls = (state.souls || 0) + reward.val; }

            state.dailyBonus.lastClaim = now;
            state.dailyBonus.streak++;

            showToast(`🎁 Получено: ${reward.text}!`);
            playSound(1000, 0.3);
            
            // Красивое окно результата
            let html = `
            <div style="text-align:center; padding:20px;">
                <div style="font-size:60px; margin-bottom:10px; animation: float3D 1s infinite;">${reward.icon}</div>
                <h2 style="color:#0f0; margin-bottom:10px;">День ${reward.day}</h2>
                <p style="color:#fff; font-size:16px; margin-bottom:20px;">Ты получил: ${reward.text}</p>
                <p style="color:#ff0; font-size:14px; margin-bottom:20px;">Серия: ${state.dailyBonus.streak} дней подряд!</p>
                <button class="btn-3d" onclick="openBonusMenu()" style="width:100%; padding:15px;">Отлично!</button>
            </div>`;
            showCustomModal(html);

            if (typeof updateUI === 'function') updateUI();
            if (typeof save === 'function') save();
        };

        console.log("✅ Ежедневный бонус 2.0 загружен!");
    }, 1500);
});
</script>

<script>

window.addEventListener('load', () => {
    setTimeout(() => {
        if (typeof state === 'undefined') return;

        if (!state.playerId) {
            state.playerId = Math.floor(100000 + Math.random() * 900000);
